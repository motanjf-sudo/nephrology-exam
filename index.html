<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شبیه‌ساز بورد نفرولوژی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FAF8F3;
    --cream2: #F4F0E8;
    --cream3: #EDE8DC;
    --white: #FFFFFF;
    --gold: #B8963E;
    --gold-light: #D4AF5A;
    --gold-pale: #F5EDD8;
    --text-dark: #2C2416;
    --text-mid: #5A4E38;
    --text-light: #8A7A60;
    --correct: #2D7A4F;
    --correct-bg: #EAF7F0;
    --wrong: #B03030;
    --wrong-bg: #FDF0F0;
    --shadow: 0 4px 24px rgba(44,36,22,0.08);
    --shadow-hover: 0 8px 36px rgba(44,36,22,0.15);
    --radius: 16px;
    --radius-sm: 10px;
  }

  body {
    font-family: 'Vazirmatn', 'Tahoma', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== PARTICLES BG ===== */
  #particles {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: var(--gold-light);
    opacity: 0;
    animation: float-particle linear infinite;
  }

  @keyframes float-particle {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 0.15; }
    90%  { opacity: 0.1; }
    100% { transform: translateY(-100px) scale(1); opacity: 0; }
  }

  /* ===== SCREENS ===== */
  .screen {
    display: none;
    position: relative; z-index: 1;
    min-height: 100vh;
  }
  .screen.active { display: flex; }

  /* ===== WELCOME SCREEN ===== */
  #screen-welcome {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }

  .welcome-card {
    background: var(--white);
    border-radius: 28px;
    padding: 60px 50px;
    max-width: 640px;
    width: 100%;
    box-shadow: var(--shadow);
    animation: slide-up 0.8s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes slide-up {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .kidney-icon {
    width: 90px; height: 90px;
    margin: 0 auto 28px;
    animation: pulse-icon 2.5s ease-in-out infinite;
  }

  @keyframes pulse-icon {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.06); }
  }

  .welcome-card h1 {
    font-size: 2rem;
    font-weight: 700;
    color: var(--text-dark);
    line-height: 1.4;
    margin-bottom: 10px;
  }

  .welcome-card h1 span {
    color: var(--gold);
  }

  .welcome-subtitle {
    font-size: 1rem;
    color: var(--text-light);
    margin-bottom: 36px;
    line-height: 1.8;
  }

  .stats-row {
    display: flex;
    gap: 16px;
    margin-bottom: 40px;
    justify-content: center;
  }

  .stat-box {
    background: var(--cream);
    border-radius: var(--radius-sm);
    padding: 16px 24px;
    flex: 1;
    max-width: 160px;
    animation: slide-up 0.8s cubic-bezier(.22,1,.36,1) both;
  }
  .stat-box:nth-child(1) { animation-delay: 0.1s; }
  .stat-box:nth-child(2) { animation-delay: 0.2s; }
  .stat-box:nth-child(3) { animation-delay: 0.3s; }

  .stat-num {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--gold);
  }
  .stat-label {
    font-size: 0.78rem;
    color: var(--text-light);
    margin-top: 2px;
  }

  .btn-start {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 18px 50px;
    font-size: 1.1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(184,150,62,0.35);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-start::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.25) 50%, transparent 70%);
    transform: rotate(45deg) translateX(-100%);
    transition: transform 0.6s ease;
  }

  .btn-start:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 32px rgba(184,150,62,0.45);
  }

  .btn-start:hover::after {
    transform: rotate(45deg) translateX(100%);
  }

  .btn-start:active { transform: translateY(0); }

  /* ===== EXAM SCREEN ===== */
  #screen-exam {
    flex-direction: column;
    align-items: center;
    padding: 24px 20px;
  }

  .exam-header {
    background: var(--white);
    border-radius: var(--radius);
    padding: 16px 24px;
    max-width: 780px;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    animation: slide-down 0.5s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes slide-down {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .progress-wrap {
    flex: 1;
  }

  .progress-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--text-light);
    margin-bottom: 6px;
  }

  .progress-bar {
    height: 8px;
    background: var(--cream2);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    border-radius: 999px;
    transition: width 0.6s cubic-bezier(.22,1,.36,1);
    position: relative;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 40px; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5));
    animation: shimmer 1.5s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%   { opacity: 0; }
    50%  { opacity: 1; }
    100% { opacity: 0; }
  }

  .q-counter {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--gold);
    white-space: nowrap;
  }

  /* Question Card */
  .question-card {
    background: var(--white);
    border-radius: 20px;
    padding: 36px 40px;
    max-width: 780px;
    width: 100%;
    box-shadow: var(--shadow);
    animation: card-enter 0.5s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes card-enter {
    from { opacity: 0; transform: translateX(40px) scale(0.97); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }

  .q-badge {
    display: inline-block;
    background: var(--gold-pale);
    color: var(--gold);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 16px;
  }

  .q-text {
    font-size: 1rem;
    line-height: 2;
    color: var(--text-dark);
    margin-bottom: 28px;
    border-right: 3px solid var(--gold-pale);
    padding-right: 16px;
  }

  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    background: var(--cream);
    border: 2px solid transparent;
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    cursor: pointer;
    text-align: right;
    font-family: inherit;
    font-size: 0.95rem;
    line-height: 1.7;
    color: var(--text-dark);
    transition: all 0.25s ease;
    width: 100%;
  }

  .option-btn:hover:not(:disabled) {
    background: var(--gold-pale);
    border-color: var(--gold-light);
    transform: translateX(-4px);
  }

  .option-key {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 32px;
    height: 32px;
    background: var(--white);
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--gold);
    border: 1.5px solid var(--gold-light);
    transition: all 0.25s ease;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .option-btn.selected {
    background: var(--gold-pale);
    border-color: var(--gold);
  }
  .option-btn.selected .option-key {
    background: var(--gold);
    color: white;
    border-color: var(--gold);
  }

  .option-btn.correct {
    background: var(--correct-bg);
    border-color: var(--correct);
    animation: correct-pulse 0.4s ease;
  }
  .option-btn.correct .option-key {
    background: var(--correct);
    color: white;
    border-color: var(--correct);
  }

  @keyframes correct-pulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

  .option-btn.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
    animation: shake 0.4s ease;
  }
  .option-btn.wrong .option-key {
    background: var(--wrong);
    color: white;
    border-color: var(--wrong);
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%      { transform: translateX(-6px); }
    75%      { transform: translateX(6px); }
  }

  .next-row {
    display: flex;
    justify-content: flex-start;
    margin-top: 24px;
  }

  .btn-next {
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: white;
    border: none;
    border-radius: 12px;
    padding: 13px 36px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(184,150,62,0.3);
    transition: all 0.3s ease;
    display: none;
    align-items: center;
    gap: 8px;
  }

  .btn-next:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(184,150,62,0.4);
  }

  .btn-next.visible { display: flex; }

  /* ===== RESULT SCREEN ===== */
  #screen-result {
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  .result-card {
    background: var(--white);
    border-radius: 28px;
    padding: 50px 50px;
    max-width: 720px;
    width: 100%;
    box-shadow: var(--shadow);
    animation: slide-up 0.7s cubic-bezier(.22,1,.36,1) both;
    text-align: center;
  }

  .score-ring {
    position: relative;
    width: 160px;
    height: 160px;
    margin: 0 auto 30px;
  }

  .score-ring svg {
    transform: rotate(-90deg);
  }

  .score-ring-bg {
    fill: none;
    stroke: var(--cream2);
    stroke-width: 10;
  }

  .score-ring-fill {
    fill: none;
    stroke: url(#ringGrad);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 1.5s cubic-bezier(.22,1,.36,1);
  }

  .score-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .score-num {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
  }

  .score-label {
    font-size: 0.75rem;
    color: var(--text-light);
    margin-top: 2px;
  }

  .result-title {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 8px;
  }

  .result-subtitle {
    font-size: 0.95rem;
    color: var(--text-light);
    margin-bottom: 32px;
  }

  .score-details {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }

  .score-detail-box {
    background: var(--cream);
    border-radius: var(--radius-sm);
    padding: 16px 24px;
    min-width: 120px;
  }

  .score-detail-box .num {
    font-size: 1.6rem;
    font-weight: 700;
  }
  .score-detail-box .lbl {
    font-size: 0.75rem;
    color: var(--text-light);
    margin-top: 2px;
  }
  .score-detail-box.c .num { color: var(--correct); }
  .score-detail-box.w .num { color: var(--wrong); }

  /* Gemini Analysis */
  .analysis-section {
    background: var(--cream);
    border-radius: var(--radius);
    padding: 28px;
    text-align: right;
    margin-top: 8px;
  }

  .analysis-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .gemini-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #4285F4, #EA4335, #FBBC04, #34A853);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
    font-size: 0.9rem;
  }

  .analysis-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-dark);
  }

  .analysis-text {
    font-size: 0.92rem;
    line-height: 2;
    color: var(--text-mid);
    white-space: pre-line;
  }

  .loading-dots {
    display: flex;
    gap: 8px;
    justify-content: center;
    padding: 20px 0;
  }

  .loading-dots span {
    width: 10px; height: 10px;
    background: var(--gold-light);
    border-radius: 50%;
    animation: dot-bounce 1.2s ease-in-out infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dot-bounce {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
  }

  .btn-restart {
    margin-top: 28px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px 40px;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(184,150,62,0.3);
    transition: all 0.3s ease;
  }
  .btn-restart:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(184,150,62,0.4);
  }

  /* Decorative wave */
  .wave-divider {
    width: 100%;
    overflow: hidden;
    line-height: 0;
    margin: 6px 0;
  }

  @media (max-width: 600px) {
    .welcome-card { padding: 36px 24px; }
    .welcome-card h1 { font-size: 1.5rem; }
    .question-card { padding: 24px 20px; }
    .stats-row { flex-wrap: wrap; }
    .result-card { padding: 36px 24px; }
  }
</style>
</head>
<body>

<!-- Particles -->
<div id="particles"></div>

<!-- ===== WELCOME SCREEN ===== -->
<div id="screen-welcome" class="screen active">
  <div class="welcome-card">
    <div class="kidney-icon">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="kg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#D4AF5A"/>
            <stop offset="100%" stop-color="#B8963E"/>
          </linearGradient>
        </defs>
        <path d="M35 20 C15 20 10 40 12 55 C14 70 22 82 35 82 C42 82 47 76 50 70 C53 76 58 82 65 82 C78 82 86 70 88 55 C90 40 85 20 65 20 C58 20 53 26 50 32 C47 26 42 20 35 20Z" fill="url(#kg)" opacity="0.15"/>
        <path d="M35 20 C15 20 10 40 12 55 C14 70 22 82 35 82 C42 82 47 76 50 70 C53 76 58 82 65 82 C78 82 86 70 88 55 C90 40 85 20 65 20 C58 20 53 26 50 32 C47 26 42 20 35 20Z" stroke="url(#kg)" stroke-width="3" fill="none"/>
        <circle cx="35" cy="50" r="8" fill="url(#kg)" opacity="0.4"/>
        <circle cx="65" cy="50" r="8" fill="url(#kg)" opacity="0.4"/>
        <path d="M42 50 C44 44 56 44 58 50" stroke="url(#kg)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      </svg>
    </div>

    <h1>شبیه‌ساز بورد<br><span>فوق‌تخصصی نفرولوژی</span></h1>
    <p class="welcome-subtitle">
      آزمون جامع بر اساس کتاب برنر و رکتور<br>
      سوالات به صورت تصادفی پرسیده می‌شوند
    </p>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num">۱۵۰</div>
        <div class="stat-label">سوال تخصصی</div>
      </div>
      <div class="stat-box">
        <div class="stat-num">۴</div>
        <div class="stat-label">گزینه‌ای</div>
      </div>
      <div class="stat-box">
        <div class="stat-num">AI</div>
        <div class="stat-label">تحلیل هوشمند</div>
      </div>
    </div>

    <button class="btn-start" onclick="startExam()">
      🩺 شروع آزمون
    </button>
  </div>
</div>

<!-- ===== EXAM SCREEN ===== -->
<div id="screen-exam" class="screen">
  <div class="exam-header">
    <div class="progress-wrap">
      <div class="progress-labels">
        <span id="progress-text">سوال ۱ از ۱۵۰</span>
        <span id="score-live">✓ 0 &nbsp; ✗ 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
    <div class="q-counter" id="q-counter">۱ / ۱۵۰</div>
  </div>

  <div class="question-card" id="question-card">
    <div class="q-badge" id="q-badge">سوال ۱</div>
    <div class="q-text" id="q-text"></div>
    <div class="options-grid" id="options-grid"></div>
    <div class="next-row">
      <button class="btn-next" id="btn-next" onclick="nextQuestion()">
        سوال بعدی ←
      </button>
    </div>
  </div>
</div>

<!-- ===== RESULT SCREEN ===== -->
<div id="screen-result" class="screen">
  <div class="result-card">
    <div class="score-ring">
      <svg width="160" height="160" viewBox="0 0 160 160">
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#B8963E"/>
            <stop offset="100%" stop-color="#D4AF5A"/>
          </linearGradient>
        </defs>
        <circle class="score-ring-bg" cx="80" cy="80" r="70"/>
        <circle class="score-ring-fill" id="ring-fill" cx="80" cy="80" r="70"
          stroke-dasharray="439.82" stroke-dashoffset="439.82"/>
      </svg>
      <div class="score-center">
        <div class="score-num" id="score-pct">0%</div>
        <div class="score-label">نمره</div>
      </div>
    </div>

    <h2 class="result-title" id="result-title">نتیجه آزمون</h2>
    <p class="result-subtitle" id="result-subtitle"></p>

    <div class="score-details">
      <div class="score-detail-box c">
        <div class="num" id="res-correct">0</div>
        <div class="lbl">✓ پاسخ درست</div>
      </div>
      <div class="score-detail-box w">
        <div class="num" id="res-wrong">0</div>
        <div class="lbl">✗ پاسخ اشتباه</div>
      </div>
      <div class="score-detail-box">
        <div class="num" style="color:var(--gold)" id="res-total">150</div>
        <div class="lbl">کل سوالات</div>
      </div>
    </div>

    <div class="analysis-section">
      <div class="analysis-header">
        <div class="analysis-title">تحلیل هوشمند</div>
        <div class="gemini-badge">✦ Gemini AI</div>
      </div>
      <div id="analysis-content">
        <div class="loading-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <button class="btn-restart" onclick="restartExam()">🔄 شروع مجدد آزمون</button>
  </div>
</div>

<script>
const QUESTIONS = [

{id:"۶",text:"در نوزاد مبتلا به هایپرتنشن شدید، هایپوکالمی و آلکالوز متابولیک با رنین و آلدوسترون پایین، شک به نقص آنزیم ۱۱بتا-هیدروکسیلاز (11beta-hydroxylase deficiency) وجود دارد. برای تایید قطعی بیوشیمیایی این نقص آنزیمی، پایش افزایش ادراری و سرمی کدام دو متابولیت استروئیدی در اولویت قرار دارد؟",options:[{key:"الف",text:"کورتیزول و آلدوسترون"}, {key:"ب",text:"۱۱-دئوکسی‌کورتیکوسترون (DOC) و ۱۱-دئوکسی‌کورتیزول"}, {key:"ج",text:"پروژسترون و ۱۷-هیدروکسی‌پروژسترون"}, {key:"د",text:"آندروستندیون و تستوسترون"}],correct:"ب"},

{id:"۹",text:"مرد ۷۲ ساله‌ای با سابقه نارسایی احتقانی قلب و بیماری مزمن کلیه با کراتینین پایه ۲.۱ میلی‌گرم در دسی‌لیتر، به علت برادی‌کاردی شدید (تعداد ضربان ۳۲ در دقیقه)، شوک، هایپرکالمی شدید (K+: 6.8 mEq/L) و آسیب حاد کلیه (Creatinine: 4.8 mg/dL) به اورژانس ارجاع می‌شود. بیمار از یک هفته قبل جهت کنترل فشار خون تحت درمان با آتنولول بوده است. این سندرم بالینی به چه نامی شناخته می‌شود و پاتوفیزیولوژی آن چیست؟",options:[{key:"الف",text:"سندرم برونر؛ سمیت مستقیم آتنولول بر روی سلول‌های پودوسیت"}, {key:"ب",text:"سندرم BRASH؛ چرخه معیوب هم‌افزایی بین برادی‌کاردی، نارسایی کلیه، مسدودکننده گره AV (آتنولول) و هایپرکالمی."}, {key:"ج",text:"سندرم کوپپتین؛ مهار ترشح وازوپرسین دیستال"}, {key:"د",text:"سندرم بارتر کاذب؛ اتلاف شدید پتاسیم توبولار"}],correct:"ب"},

{id:"۱۱",text:"بیمار مرد ۵۵ ساله‌ای با شاخص توده بدنی (BMI) برابر با ۳۸ و دیابت کنترل‌نشده، با علائم کولترال‌های وریدی شکمی مراجعه کرده که بیانگر هایپرتنشن پورتال ثانویه به بیماری کبد چرب مرتبط با متابولیسم (MAFLD) است. در بررسی همودینامیک عروق شکمی و کلیوی این بیمار، کدام مکانیسم پاتوفیزیولوژیک مسئول اصلی احتباس حجم کلیوی و ادم است؟",options:[{key:"الف",text:"افزایش ترشح وازوپرسین به دنبال هایپرولمی موثر شریانی"}, {key:"ب",text:"وازودیلاتاسیون شریانچه‌ای اسپلانکنیک به واسطه افزایش تولید اکسید نیتریک (NO) سیستمیک، که در نهایت Sympathetic و سیستم RAAS را فعال می‌کند."}, {key:"ج",text:"کاهش فیزیکی برون‌ده قلبی به دنبال نارسایی قلبی راست"}, {key:"د",text:"انقباض شدید مجاری توبولار پروگزیمال در پاسخ به افزایش فشار ورید پورتال"}],correct:"ب"},
{id:"۱۲",text:"در پایش بیماران همودیالیزی مبتلا به سندرم آپنه انسدادی خواب (OSA)، انتقال بیمار از همودیالیز استاندارد ۳ بار در هفته به همودیالیز شبانه (Nocturnal HD) چه تأثیر پاتوفیزیولوژیک و بالینی اثبات شده‌ای بر شاخص‌های خواب بیمار دارد؟",options:[{key:"الف",text:"بهبود معنی‌دار در کل شاخص‌های ذهنی کیفیت خواب بدون هیچ تغییری در آپنه خواب"}, {key:"ب",text:"بهبود عینی و معنی‌دار در پارامترهای آپنه خواب (Sleep Apnea) بدون بهبود خالص و معنی‌دار در کیفیت ذهنی کلی خواب"}, {key:"ج",text:"بهبود کامل هر دو حیطه کیفیت خواب و آپنه خواب به همراه مهار کامل ترشح ملاتونین اگزوژن"}, {key:"د",text:"تشدید هایپرکلسمی پایدار شبانه و بی‌خوابی مفرط"}],correct:"ب"},
{id:"۱۳",text:"برای غربالگری اختلالات شناختی (MCI و دمانس) در یک بیمار ۶۸ ساله نامزد شروع دیالیز که فاقد توانایی خواندن و نوشتن (بی‌سواد یا کم‌سواد) است، کدام ابزار ارزیابی شناختی و با چه معیاری ترجیح داده می‌شود؟",options:[{key:"الف",text:"تست MoCA استاندارد با امتیاز کمتر از ۲۶"}, {key:"ب",text:"ابزار Montreal Cognitive Assessment-Basic (MoCA-Basic) با آستانه امتیاز کمتر از ۲۴"}, {key:"ج",text:"ابزار Mini-Cog بدون تعدیل برای سطح تحصیلات"}, {key:"د",text:"این بیماران به علت بی‌سوادی تنها کاندید تست تصویربرداری پت‌اسکن مغز هستند."}],correct:"ب"},
{id:"۱۴",text:"خانم ۶۲ ساله‌ای با نارسایی قلبی و کسر تخلیه کاهش یافته (HFrEF) کاندید شروع درمان با داروی مهارکننده SGLT2 (امپاگلیفلوزین) است. بر اساس کارآزمایی بالینی مرجع EMPEROR-REDUCED مندرج در کتاب، حداقل میزان GFR بیمار جهت ایمن بودن شروع امپاگلیفلوزین چقدر است؟",options:[{key:"الف",text:"eGFR بالای ۳۰ میلی‌لیتر در دقیقه"}, {key:"ب",text:"eGFR بالای ۲۰ میلی‌لیتر در دقیقه"}, {key:"ج",text:"eGFR بالای ۴۵ میلی‌لیتر در دقیقه"}, {key:"د",text:"امپاگلیفلوزین در تمامی سطوح GFR (حتی در نارسایی کلیوی انتهایی دیالیزی) قابل شروع است."}],correct:"ب"},

{id:"۱۶",text:"بیمار خانم ۴۵ ساله‌ای با بیماری مزمن کلیه (eGFR: 32 mL/min) و پروتئینوری پایدار ۲.۴ گرم در روز کاندید شروع درمان با مهارکننده اختصاصی گیرنده اندوتلین است. پایش بالینی ترکیب زیبوتنتان (Zibotentan) به همراه داپاگلیفلوزین (منبع: Endothelin receptor antagonists) در مقایسه با مونوتراپی با داپاگلیفلوزین چه تاثیری بر سطح پروتئینوری و عوارض احتباس مایعات (مانند ادم عروقی و تغییرات BNP) دارد؟",options:[{key:"الف",text:"زیبوتنتان تاثیر داپاگلیفلوزین را مهار کرده و ادم را کاهش می‌دهد."}, {key:"ب",text:"ترکیب زیبوتنتان با داپاگلیفلوزین منجر به کاهش بارزتر پروتئینوری می‌گردد، در حالی که استفاده از دوزهای پایین زیبوتنتان (مانند 0.25 mg) به همراه داپاگلیفلوزین به مهار عوارض احتباس مایعات و ثبات BNP کمک می‌کند."}, {key:"ج",text:"زیبوتنتان همواره با افزایش شدید و غیرقابل کنترل حجم پلاسما همراه است و در CKD ممنوعیت مطلق دارد."}, {key:"د",text:"استفاده از دوز بالای زیبوتنتان ایمن‌ترین گزینه جهت پیشگیری از ادم ریوی است."}],correct:"ب"},
{id:"۱۷",text:"در ارزیابی ریسک فاکتورهای ادراری و تغذیه‌ای سنگ‌های کلیوی اگزالات کلسیمی (Calcium Oxalate Stones)، کدام تداخل تغذیه‌ای یا پاتوفیزیولوژیک بیشترین نقش پاتوژنیک را در بروز \"هایپراگزالوری ثانویه\" ایفا می‌کند؟",options:[{key:"الف",text:"مصرف بالای سبزیجات و میوه‌ها به دلیل محتوای قلیایی ادراری"}, {key:"ب",text:"مال‌آبسوربسیون چربی‌ها (مانند موارد پس از جراحی‌های چاقی یا بیماری‌های التهابی روده) که منجر به اتصال کلسیم به چربی‌های روده و آزاد شدن اگزالات جهت بازجذب مفرط می‌گردد."}, {key:"ج",text:"مصرف بالای مکمل کلسیم به همراه وعده‌های غذایی"}, {key:"د",text:"استفاده مداوم از رژیم غذایی به سبک DASH"}],correct:"ب"},
{id:"۱۸",text:"بیمار خانم ۲۴ ساله‌ای است که با تابلوی سندرم نفروتیک حاد و کراتینین نرمال بیوپسی می‌شود. پاتولوژی کلیه نفروپاتی غشایی (Membranous Nephropathy) را نشان می‌دهد. در بررسی‌های تکمیلی بافتی، رنگ‌آمیزی ایمونوهیستوشیمی برای آنتی‌ژن **NELL-1** به شدت مثبت گزارش می‌گردد. بر اساس شواهد پاتوژنز مقالات مرجع (منبع: Drug-Induced Membranous Nephropathy)، رد کردن کدام علت ثانویه درگیری NELL-1 در این بیمار در اولویت نخست بالینی قرار دارد؟",options:[{key:"الف",text:"مصرف داروهای ضدبارداری خوراکی سیستمیک"}, {key:"ب",text:"مواجهه با جیوه از طریق کرم‌های ضد لک و سفیدکننده پوست یا استفاده از طب سنتی بومی (Traditional medicines)."}, {key:"ج",text:"مصرف فریک کربوکسی‌مالتوز وریدی"}, {key:"د",text:"سابقه خانوادگی سندرم آلپورت"}],correct:"ب"},
{id:"۱۹",text:"سندرم پره‌اکلامپسی (Preeclampsia) یک پودوسیتوپاتی جدی دوران بارداری است. بر اساس مکانیسم‌های پاتوفیزیولوژیک تشریح شده در کتاب برنر، علت اصلی بروز ضایعه اختصاصی گلومرولار اندوتلیوزیس (Glomerular endotheliosis) در پره‌اکلامپسی چیست؟",options:[{key:"الف",text:"رسوب مستقیم مجتمع‌های ایمنی حاوی IgG و C3 در فضای زیراندوتلیال گلومرول"}, {key:"ب",text:"افزایش شدید و بحرانی سطوح سرمی فاکتور ضد رگ‌زایی **sFlt1** (گیرنده محلول VEGF) که با اتصال به VEGF پودوسیتی مانع از سیگنالینگ بقای اندوتلیال گلومرول می‌گردد."}, {key:"ج",text:"ترشح مفرط کوپپتین از غشای پایه"}, {key:"د",text:"مهار فیزیکی پمپ‌های کلسیمی TRPV5 در مدولا"}],correct:"ب"},
{id:"۲۰",text:"پاتولوژیست در ارزیابی بیوپسی کلیه کورتیکال یک بیمار مبتلا به مالتیپل میلوما و آسیب حاد کلیه الیگوریک، گزارش پاتولوژی را به عنوان نفروپاتی سیلندری زنجیره سبک (Light Chain Cast Nephropathy - LCCN) ثبت می‌کند. بر اساس معیارهای اجماع گروه بین‌المللی پاتولوژی کلیه (RPS)، سیلندرهای ادراری پاتوژنیک در LCCN باید واجد کدام معیارهای ساختاری باشند؟",options:[{key:"الف",text:"به شدت پاس (PAS) مثبت، دارای لبه‌های نرم و گرد به همراه ارتشاح غنی از پودوسیت‌ها"}, {key:"ب",text:"پاس (PAS) منفی (یا بسیار رنگ‌پریده)، دارای نمای خردشده، شکسته‌شده و زاویه‌دار (Fractured) به همراه واکنش سلول‌های غول‌پیکر دور توبولی."}, {key:"ج",text:"حاوی رسوبات خطی IgG در امتداد غشای پایه گلومرول"}, {key:"د",text:"انحصاراً در توبول جمع‌کننده مدولاری متمرکز باشند"}],correct:"ب"},
{id:"۲۱",text:"بیمار خانم ۶۴ ساله‌ای با نارسایی مزمن کبد ثانویه به سیروز انسدادی شدید، با سدیم سرم ۱۱۸ میلی‌گرم در دسی‌لیتر جهت بررسی هایپوناترمی ارجاع می‌شود. همزمان در آزمایش‌ها هایپرکلسترولی شدید به همراه حضور لیپوپروتئین-X (Lp-X) گزارش می‌گردد. رویکرد بیوشیمیایی و پاتوفیزیولوژیک آزمایشگاه در قبال این گزارش چیست؟",options:[{key:"الف",text:"بیمار دچار هایپوناترمی هایپوولمیک واقعی است و نیازمند تجویز فوری سالین هایپرتونیک است."}, {key:"ب",text:"حضور Lp-X منجر به هایپرلیپیدمی شدید گردیده که حجم بخش آب پلاسما را به طور کاذبی کاهش داده و منجر به **هایپوناترمی کاذب (Pseudohyponatremia)** شده است؛ سنجش با الکترود انتخابی یون مستقیم (Direct ISE) سدیم واقعی را نشان می‌دهد."}, {key:"ج",text:"پدیده medullary washout کلیوی واسطه این هایپوناترمی است."}, {key:"د",text:"سنجش سدیم با روش غیرمستقیم (Indirect ISE) در حضور Lp-X دقیق‌ترین نتیجه را ارائه می‌دهد."}],correct:"ب"},
{id:"۲۲",text:"در بیمار مبتلا به نارسایی مزمن کلیه پیشرونده با الگوی توارث اتوزومال غالب، در بیوپسی کلیوی آتروفی شدید توبولار و فیبروز اینترستیشال بدون هیچ‌گونه رسوب ایمنی در کورتکس گزارش می‌شود. پاتولوژیست تشخیص بیماری کلیوی توبولوآینترستیشال اتوزومال غالب (ADTKD) را مطرح می‌کند. بروز جهش در ژن کدام فاکتور رونویسی کلیدی، پاتوژنز اختصاصی ADTKD به شمار می‌رود و با آنومالی‌های ساختاری کلیه (مانند پدیده CAKUT) و هایپومنیزمی همراهی دارد؟",options:[{key:"الف",text:"جهش در ژن *MUC1* که غشای توبول را درگیر می‌کند"}, {key:"ب",text:"جهش در فاکتور رونویسی **HNF1B** که نقش محوری در رونویسی ژن‌های فیزیولوژی توبولار ایفا می‌سازد."}, {key:"ج",text:"جهش در ژن *UMOD* که تام-هورسفال را کد می‌کند"}, {key:"د",text:"جهش در لوکوس ژنتیکی *Sall1*"}],correct:"ب"},
{id:"۲۳",text:"در بیولوژی تکوین و توسعه رویانی کلیه، بیان موضعی ژن **Sall1** در کدام بخش از فرآیند تکوین آلوگرافت و سیستم ادراری نقش کلیدی ایفا می‌کند و نقص آن با کدام فنوتیپ بالینی همراه است؟",options:[{key:"الف",text:"بیان Sall1 در سلول‌های Cap mesenchyme رخ داده و واسطه تکوین پودوسیت‌ها است."}, {key:"ب",text:"بیان Sall1 در سلول‌های متانفریک مزانشیم رخ داده و با پایش ترشح فاکتور GDNF به جوانه زدن حالب (Ureteric bud outgrowth) کمک می‌کند؛ نقص آن منجر به عدم تشکیل کلیه یا سندرم Townes-Brocks می‌شود."}, {key:"ج",text:"بیان Sall1 انحصاماً در اندوتلیوم عروق کورتیکال رخ می‌دهد."}, {key:"د",text:"Sall1 کانال‌های همزمان سدیم-کلراید توبولی را فعال می‌سازد."}],correct:"ب"},
{id:"۲۴",text:"در تنظیم دوز داروهای هایپرتنشن در بیماران مبتلا به نارسایی پیشرفته کلیه (CKD)، داروی بتا-بلوکر انتخابی بتا-یک **بتاکسولول (Betaxolol)** مورد تجویز قرار می‌گیرد. بر اساس فارماکوکینتیک این دارو مندرج در کتاب برنر، کدام دوز درمانی برای شروع در بیماران پیشرفته کلیوی توصیه می‌شود؟",options:[{key:"الف",text:"دوز پایه ۴۰ میلی‌گرم روزانه بدون نیاز به تعدیل دوز"}, {key:"ب",text:"دوز شروع ۵ میلی‌گرم روزانه به همراه پایش دقیق روند تیتراسیون دوز؛ زیرا کلیرنس کلیوی دارو در CKD کاهش می‌یابد."}, {key:"ج",text:"دوز شروع ۲۰ میلی‌گرم روزانه به همراه سالین ایزوتونیک"}, {key:"د",text:"بتاکسولول در CKD ممنوعیت مطلق دارد و باید تعویض شود."}],correct:"ب"},
{id:"۲۵",text:"داروی بتا-بلوکر غیرمعمول **سلیپرولول (Celiprolol)** واجد ویژگی‌های وازودیلاتوری و تحریک اختصاصی بتا-۲ به همراه مهار گیرنده آلفا-۲ آدرنرژیک است. در صورت تجویز سلیپرولول در بیمار با کلیرنس کراتینین کمتر از ۱۵ میلی‌لیتر در دقیقه، دوز درمانی چگونه تعدیل می‌گردد؟",options:[{key:"الف",text:"عدم نیاز به هیچ‌گونه تعدیل دوز به دلیل کلیرنس منحصراً کبدی دارو"}, {key:"ب",text:"کاهش دوز به میزان ۵۰ درصد (کاهش نصف دوز پایه) به همراه مانیتورینگ دقیق فشار خون."}, {key:"ج",text:"قطع کامل دارو و جایگزینی با لابتالول وریدی"}, {key:"د",text:"افزایش دو برابری دوز به منظور جبران مقاومت محیطی عروق"}],correct:"ب"},
{id:"۲۶",text:"در پاتوفیزیولوژی اثرات طولانی‌مدت داروهای محرک اریتروپوئزیس (ESA)، داروی داربپوئتین آلفا (Darbepoetin alfa) در مقایسه با اریتروپوئتین انسانی (EPO) طبیعی واجد تفاوت‌های ساختاری و عملکردی است. بر اساس متون کتاب برنر، علت اصلی نیمه‌عمر طولانی‌تر داربپوئتین آلفا در گردش خون چیست؟",options:[{key:"الف",text:"داربپوئتین با سرعت بسیار بالاتری به درون سلول‌ها انتقال می‌یابد."}, {key:"ب",text:"اریتروپوئتین طبیعی با سرعت بسیار کمتری از گیرنده خود (EPO-R) جدا می‌شود؛ در نتیجه میزان بیشتری از EPO نسبت به داربپوئتین آلفا اینترنالیزه و تخریب می‌گردد."}, {key:"ج",text:"اتصال مستقیم داربپوئتین به پروتئین‌های ناقل آلبومین در پلاسما"}, {key:"د",text:"داربپوئتین فاقد زنجیره‌های کربوهیدراتی متصل به N است."}],correct:"ب"},
{id:"۲۷",text:"سیگنالینگ عامل القاشونده با هایپوکسی (HIF) تنظیم‌کننده اصلی سنتز اریتروپوئتین (EPO) در کلیه است. در شرایط نرموکسی (حضور اکسیژن کافی)، کدام رویداد بیوشیمیایی منجر به مهار پاتوفیزیولوژیک مسیر سنتز EPO می‌گردد؟",options:[{key:"الف",text:"هیدروکسیلاسیون باقیمانده‌های پرولیل و آسپاراژیل در زیرواحد HIF-alpha توسط آنزیم‌های PHD، که منجر به اتصال پروتئین فون هیپل-لیندو (pVHL) و تخریب پروتئازومی آن می‌گردد."}, {key:"ب",text:"مهار ترشح سایتوکاین‌های پودوسیتی به صورت اتوکرین"}, {key:"ج",text:"فسفوریلاسیون انتخابی زیرواحد HIF-beta توسط فاکتورهای رشد"}, {key:"د",text:"مهار مستقیم گیرنده p300 توسط هورمون آلدوسترون"}],correct:"الف"},
{id:"۲۸",text:"بر اساس نتایج کارآزمایی بالینی بزرگ TREAT مندرج در کتاب برنر، استفاده از داروی داربپوئتین آلفا در بیماران مبتلا به بیماری مزمن کلیه (CKD)، دیابت تیپ ۲ و آنمی خفیف با هدف دستیابی به هموگلوبین ۱۳ گرم در دسی‌لیتر، با افزایش معنی‌دار در بروز کدام عارضه بالینی همراه بوده است؟",options:[{key:"الف",text:"نارسایی حاد کلیه الیگوریک"}, {key:"ب",text:"افزایش دو برابری ریسک بروز سکته مغزی (Stroke)"}, {key:"ج",text:"هایپرکالمی مفرط و آریتمی قلبی"}, {key:"د",text:"خونریزی‌های گوارشی غیرقابل کنترل"}],correct:"ب"},
{id:"۲۹",text:"هورمون هپسیدین (Hepcidin) نقش محوری در تنظیم هومئوستاز آهن ایفا می‌کند. بر اساس پاتوفیزیولوژی آنمی فقر آهن در CKD، مکانیسم عمل هپسیدین بر روی جذب و ذخیره‌سازی آهن چیست؟",options:[{key:"الف",text:"هپسیدین با فعال‌سازی فروپورتین منجر به افزایش بازجذب آهن در دوازدهه می‌شود."}, {key:"ب",text:"هپسیدین با مهار منفی فروپورتین، هم مانع از جذب آهن در دوازدهه (Duodenal iron absorption) شده و هم مانع از آزاد شدن آهن از ماکروفاژها (Iron release) می‌گردد."}, {key:"ج",text:"هپسیدین انحصاماً ترشح انتقال‌دهنده‌های کلسیمی را در توبول پروگزیمال مهار می‌کند."}, {key:"د",text:"هپسیدین با افزایش بیان گیرنده‌های ترانسفرین، برداشت آهن عروقی را تسهیل می‌سازد."}],correct:"ب"},
{id:"۳۰",text:"در ارزیابی بیوشیمیایی و پایش آزمایشگاهی آنمی در بیماران مبتلا به CKD، کدام پارامتر به عنوان دقیق‌ترین و حساس‌ترین شاخص نشان‌دهنده \"دسترسی عملکردی آهن برای اریتروپوئزیس\" (Functional iron availability) به شمار می‌رود؟",options:[{key:"الف",text:"غلظت فریتین سرم (Serum ferritin)"}, {key:"ب",text:"رنگ‌آمیزی آهن در بیوپسی مغز استخوان"}, {key:"ج",text:"محتوای هموگلوبین رتیکولوسیت (Reticulocyte hemoglobin content)"}, {key:"د",text:"غلظت گیرنده محلول ترانسفرین"}],correct:"ج"},
{id:"۳۱",text:"در تنظیم دوز داروهای ضد انعقاد خوراکی جدید (NOACs)، تجویز داروی **آبیکسابان (Apixaban)** در بیماران مبتلا به بیماری مزمن کلیه انجام می‌شود. بر اساس جدول دارویی برنر، در چه وضعیتی از GFR شروع آبیکسابان توصیه نمی‌شود؟",options:[{key:"الف",text:"eGFR بین ۳۰ تا ۵۰ میلی‌لیتر در دقیقه"}, {key:"ب",text:"eGFR کمتر از ۲۵ میلی‌لیتر در دقیقه (Not recommended)"}, {key:"ج",text:"بیماران با کراتینین سرم کمتر از ۱.۵ میلی‌گرم در دسی‌لیتر"}, {key:"د",text:"آبیکسابان در تمام سطوح GFR ایمن است و نیاز به هیچ تیتراسیونی ندارد."}],correct:"ب"},
{id:"۳۲",text:"در پایش بیماران دیابتی مبتلا به CKD کاندید شروع داروی **متفورمین (Metformin)**، بر اساس راهنمای دوز دارویی برنر، دوز متفورمین در محدوده GFR معادل ۳۰ تا ۵۰ میلی‌لیتر در دقیقه چگونه تنظیم می‌شود و در چه محدوده‌ای باید به طور کامل قطع (Avoid) گردد؟",options:[{key:"الف",text:"کاهش دوز به میزان ۲۵ تا ۵۰ درصد در GFR معادل ۳۰-۵۰ و قطع کامل در GFR کمتر از ۳۰ میلی‌لیتر در دقیقه."}, {key:"ب",text:"عدم نیاز به تغییر دوز در GFR بالای ۱۵ و قطع کامل در دیالیز"}, {key:"ج",text:"افزایش دو برابری دوز به همراه پایش اسیدوز لاکتیک"}, {key:"د",text:"متفورمین در تمامی بیماران با کراتینین بالای ۱.۵ میلی‌گرم در دسی‌لیتر ممنوعیت مطلق دارد."}],correct:"الف"},
{id:"۳۳",text:"در همودیالیز نگهدارنده، مفهوم \"كلیرنس معادل اوره\" یا **standard Kt/V** توسعه یافته است تا دوز دیالیز در رژیم‌های مختلف را استاندارد سازد. بر اساس تعاریف کتاب مرجع دیالیز، پایش کلیرنس معادل ادراری اوره (EKRU) بر اساس چه معادله و رابطه‌ای پاتوفیزیولوژیک محاسبه می‌گردد؟",options:[{key:"الف",text:"نسبت غلظت پتاسیم به کلیرنس توبولار"}, {key:"ب",text:"نسبت نرخ تولید اوره (Urea generation rate) به میانگین غلظت سرمی اوره در طول هفته."}, {key:"ج",text:"تفاوت مطلق میزان اوره سرم قبل و بعد از دیالیز"}, {key:"د",text:"نسبت حجم توزیع اوره به کل زمان دیالیز شبانه"}],correct:"ب"},
{id:"۳۴",text:"قبل از تعبیه دسترسی عروقی فیستول شریانی-وریدی (AVF) در اندام فوقانی بیمار کاندید دیالیز، انجام تست فیزیکی **تست آلن (Allen's Test)** الزامی است. تداوم رنگ‌پریدگی دست (Blanching) برای چه مدت پس از رها کردن شریان‌های اولنار یا رادیال به عنوان تست مثبت برای نارسایی شریانی تلقی شده و مانع از تعبیه فیستول در آن اندام می‌گردد؟",options:[{key:"الف",text:"معادل یا بیش از ۵ ثانیه"}, {key:"ب",text:"کمتر از ۲ ثانیه"}, {key:"ج",text:"معادل ۱۰ ثانیه انحصاماً برای شریان اولنار"}, {key:"د",text:"تست آلن فاقد ارزش پیش‌بینی‌کننده عروقی است."}],correct:"الف"},
{id:"۳۵",text:"بیمار دیالیزی به دلیل مسمومیت حاد یا سندرم وازوپلژیک تحت درمان با دوزهای بالای داروی **هیدروکسوکوبالامین (Hydroxocobalamin)** قرار می‌گیرد. در جلسه دیالیز بعدی، دستگاه به طور مکرر آلارم کاذب وجود خون در دیالیزات (False Blood Leak Alarm) را فعال می‌سازد. مکانیسم پاتوفیزیولوژیک این تداخل دستگاه دیالیز چیست و چه اقدام تاییدکننده‌ای لازم است؟",options:[{key:"الف",text:"هیدروکسوکوبالامین غشای دیالیزور را تخریب کرده و منجر به نشت واقعی خون می‌گردد."}, {key:"ب",text:"هیدروکسوکوبالامین به علت داشتن رنگ قرمز شدید، سنسورهای نوری دستگاه دیالیز را تحریک کرده و آلارم کاذب ایجاد می‌کند؛ اقدام بعدی تایید با نوار تست ادراری (Test strip) مخصوص تشخیص هموگلوبین در مایع پساب دیالیز است."}, {key:"ج",text:"دارو پمپ‌های توبولار را فعال ساخته و منجر به رسوب کلسیم می‌شود."}, {key:"د",text:"شروع فوری دوزهای فوق‌العاده بالای هپارین وریدی به دلیل ترومبوز فیزیکی عروق دیالیزور"}],correct:"ب"},
{id:"۳۶",text:"در پایش خانم‌های جوان مبتلا به نارسایی کلیوی انتهایی دیالیزی که مایل به بارداری ایمن هستند، چه رابطه‌ای بین شدت و تعداد جلسات همودیالیز هفتگی با نرخ موفقیت لقاح و تولد نوزاد زنده وجود دارد؟",options:[{key:"الف",text:"دیالیز فاقد تاثیری بر باروری است و لقاح تنها پس از پیوند کلیه رخ می‌دهد."}, {key:"ب",text:"افزایش دوز و شدت دیالیز به میزان ۳۶ ساعت یا بیشتر در هفته (به ویژه با رژیم دیالیز شبانه مکرر)، با کاهش اورمی پایدار و ادم، شانس لقاح و تولد نوزاد زنده را به طور چشمگیری افزایش می‌دهد."}, {key:"ج",text:"دیالیز مکرر شبانه به دلیل القای ترشحات مفرط الکتورلیتی منجر به سقط می‌شود."}, {key:"د",text:"بیماران دیالیزی باید تحت درمان با دوزهای بالای کورتون باشند."}],correct:"ب"},
{id:"۳۷",text:"در تصمیم‌گیری بالینی برای بیماران کاندید بیوپسی کلیه که بلافاصله قبل از آن تحت درمان با تعویض پلاسما (Plasmapheresis / TPE) بوده‌اند، پایش افت فاکتورهای انعقادی پس از جلسه TPE الزامی است. بر اساس جدول مرجع کتاب، سطح کدام فاکتور انعقادی و مهارکننده آنتی‌کوآگولان پس از ۲۴ ساعت از اتمام TPE کماکان در کمترین سطح خود (بیشترین افت نسبت به پایه) باقی می‌ماند؟",options:[{key:"الف",text:"فاکتور V انعقادی"}, {key:"ب",text:"آنتی‌ترومبین III (Antithrombin III) با افت پایداری حدود ۷۰ درصد."}, {key:"ج",text:"فاکتور VIII انعقادی"}, {key:"د",text:"فیبرینوژن پلاسما با بازگشت برق‌آسا به سطح پایه"}],correct:"ب"},
{id:"۳۸",text:"در طبقه بندی بیولوژی پیوند و تطابق بافتی دهنده و گیرنده، تفاوت عمده پایش با روش سنتی **تعداد میس‌مچ‌های HLA (HLA Antigen Mismatch)** در مقایسه با روش نوین **Eplet Mismatch** چیست؟",options:[{key:"الف",text:"میس‌مچ‌های HLA تنها بر اساس کراس‌مچ سلول‌های B تعریف می‌شوند."}, {key:"ب",text:"میس‌مچ اِپلت بر اساس تفاوت‌های ریز ساختاری اسیدهای آمینه در سطح اپیتوپ‌های ایمونوژنیک مولکول‌های HLA تعریف می‌شود و دقت بسیار بالاتری در پیش‌بینی ریسک تولید آنتی‌بادی‌های ضد HLA اختصاصی دهنده (DSA) پس از پیوند دارد."}, {key:"ج",text:"HLA mismatch همیشه تعداد کمتری از کل تفاوت‌های بافتی را نسبت به اِپلت نشان می‌دهد."}, {key:"د",text:"هر دو روش کارایی یکسانی در پایش پس‌زدن‌های سلولی آلوگرافت دارند."}],correct:"ب"},
{id:"۳۹",text:"بر اساس نتایج مطالعات اپیدمیولوژیک مرجع درازمدت (مانند کارهای Muzaale و Mjoen) مندرج در کتاب برنر، اهدای کلیه زنده (Living Kidney Donation) چه تاثیری بر ریسک مطلق درازمدت ابتلا به نارسایی مرحله انتهایی کلیه (ESKD) در مقایسه با افراد سالم غیر اهداکننده همسان دارد؟",options:[{key:"الف",text:"هیچ تفاوتی در ریسک ESKD بین اهداکنندگان و غیر اهداکنندگان وجود ندارد."}, {key:"ب",text:"اهدای کلیه با افزایش اندک اما معنی‌دار در خطر مطلق ابتلا به ESKD همراه است (بروز حدود ۱ درصد در اهداکنندگان در مقابل ۰.۲۵ درصد در جمعیت سالم غیر اهداکننده در طول پایش درازمدت)."}, {key:"ج",text:"اهداکنندگان بیش از ۵۰ درصد ریسک ابتلا به هایپرتنشن عروقی برق‌آسا دارند."}, {key:"د",text:"این ریسک انحصاماً در اهداکنندگانی که سن بالای ۶۰ سال دارند رویت شده است."}],correct:"ب"},
{id:"۴۰",text:"در مانیتورینگ ژنتیکی کاندیداهای اهدای کلیه زنده با نژاد آفریقایی‌تبار، ارزیابی واریانت‌های ریسک کلیوی ژن **APOL1** انجام می‌شود. بر اساس یافته‌های ژنتیک پیوند، حضور کدام واریانت محافظتی ویژه (Protective modifier) می‌تواند اثرات پاتوژنیک دو واریانت ریسک *APOL1* را مهار ساخته و ریسک نارسایی کلیه را تعدیل کند؟",options:[{key:"الف",text:"واریانت هتروزیگوت *NPHS1*"}, {key:"ب",text:"واریانت محافظتی ویژه **p.N264K** در ژن APOL1."}, {key:"ج",text:"جهش‌های فعال‌کننده ژن *LMX1B*"}, {key:"د",text:"بیش‌بیانی کلاژن تیپ IV غشای پایه"}],correct:"ب"},
{id:"۴۱",text:"خانم ۲۶ ساله باردار در هفته ۲۴ بارداری جهت ارزیابی روتین به کلینیک نفرولوژی ارجاع می‌شود. وی سابقه هیچ‌گونه بیماری زمینه‌ای ندارد. در معاینه بالینی، فشار خون وی ۱۱۰/۷۰ میلی‌متر جیوه و ضربان قلب وی ۸۴ در دقیقه است. نتایج آزمایشگاهی بیمار به این شرح گزارش می‌شود: کراتینین سرم: ۰.۵ میلی‌گرم در دسی‌لیتر، سدیم خون: ۱۳۴ میلی‌اکی‌والان در لیتر، اسید اوریک: ۲.۵ میلی‌گرم در دسی‌لیتر. گاز خون شریانی (ABG) بیمار نشان‌دهنده pH: ۷.۴۴، PaCO2: ۳۰ میلی‌متر جیوه و HCO3: ۱۸ میلی‌اکی‌والان در لیتر است. بر اساس پاتوفیزیولوژی تغییرات همودینامیک طبیعی دوران بارداری (منطبق بر متون Chapter 48 و کتاب مایعات ردی)، کدام گزاره بالینی در خصوص وضعیت بیمار صحیح است؟ [۱۶۴، ۸۳۵]",options:[{key:"الف",text:"افت سدیم پلاسما به ۱۳۴ نشان‌دهنده شروع ترشح نابهنجار وازوپرسین (SIADH) بارداری است و بیمار باید تحت محدودیت مایعات قرار گیرد."}, {key:"ب",text:"اسید اوریک بیمار به طور غیرطبیعی کاهش یافته و احتمال وجود یک نقص انتقالی توبولار پروگزیمال ارثی را مطرح می‌سازد."}, {key:"ج",text:"بیمار دچار آلکالوز تنفسی خفیف است که با افزایش دفع کلیوی بیکربنات جبران شده است؛ این تغییرات همگام با افزایش فیلتراسیون گلومرولی (GFR) و کاهش سدیم سرم کاملاً فیزیولوژیک محسوب می‌شوند."}, {key:"د",text:"افزایش کراتینین سرم به ۰.۵ نشان‌دهنده نارسایی حاد کلیه (AKI) مرحله ۱ در بارداری است، زیرا کراتینین پایه بارداری باید زیر ۰.۳ باشد."}],correct:"ج"},
{id:"۴۲",text:"خانم ۳۲ ساله باردار (G1P0) در هفته ۳۲ بارداری با شکایت از تورم فزاینده اندام‌های تحتانی و سردرد خفیف به اورژانس مراجعه می‌کند. در سنجش علائم حیاتی، فشار خون وی ۱۵۵/۹۵ میلی‌متر جیوه ثبت می‌شود که در بررسی مجدد پس از ۴ ساعت کماکان ۱۵۲/۹۴ باقی می‌ماند. آزمایش ادرار ۲۴ ساعته بیمار نشان‌دهنده دفع پروتئین ۳۸۰ میلی‌گرم در روز است. کراتینین سرم بیمار ۱.۱ میلی‌گرم در دسی‌لیتر (پایه ۰.۵ در ابتدای بارداری) گزارش شده است. پلاکت بیمار ۱۴۵,۰۰۰ و آنزیم‌های کبدی (AST, ALT) در محدوده طبیعی هستند. بر اساس راهنمای برنر، کدام تشخیص بالینی و اقدام درمانی بعدی برای این بیمار ارجاع صحیح است؟ [۱۶۳، ۸۳۵]",options:[{key:"الف",text:"هایپرتنشن بارداری ساده (Gestational Hypertension)؛ ترخیص با توصیه به استراحت در منزل و پایش هفتگی فشار خون."}, {key:"ب",text:"پره‌اکلامپسی (Preeclampsia)؛ بستری جهت پایش دقیق مادر و جنین و شروع درمان‌های حمایتی بر اساس اندیکاسیون‌ها."}, {key:"ج",text:"پره‌اکلامپسی شدید با ویژگی‌های شدید (Severe Features)؛ القای زایمان فوری بدون در نظر گرفتن سن بارداری."}, {key:"د",text:"سندرم HELLP زودهنگام؛ شروع پالس کورتیکواستروئید وریدی دوز بالا و تعویض پلاسما به صورت اورژانسی."}],correct:"ب"},
{id:"۴۳",text:"خانم ۲۹ ساله‌ای با سابقه نفریت لوپوسی کلاس ۴ فعال که از یک سال پیش تحت درمان نگهدارنده با مایکوفتولات موفتیل (MMF) با دوز ۵۰۰ میلی‌گرم دوبار در روز، هیدروکسی‌کلروکین ۲۰۰ میلی‌گرم روزانه، نیفدیپین ۶۰ میلی‌گرم روزانه و پردنیزون ۵ میلی‌گرم روزانه قرار داشته و در وضعیت خاموشی کامل قرار دارد، در هفته ۷ بارداری ناخواسته ارزیابی می‌شود. در معاینه بالینی، فشار خون وی ۱۴۰/۸۵ میلی‌متر جیوه است. آزمایشات نشان‌دهنده کراتینین ۱.۲ میلی‌گرم در دسی‌لیتر (ثابت نسبت به پایه) و نسبت پروتئین به کراتینین ادرار رندوم (UPCR) معادل ۱۴۳ میلی‌گرم در گرم است. طبق راهنمای Chapter 70 و Chapter 48 کتاب برنر، ایمن‌ترین و منطقی‌ترین تغییر در رژیم دارویی بیمار کدام است؟",options:[{key:"الف",text:"ادامه رژیم فعلی بدون تغییر تا پایان بارداری به دلیل خاموشی بیماری لوپوس."}, {key:"ب",text:"قطع فوری نیفدیپین و جایگزینی آن با لوزارتان جهت کنترل بهتر فشار خون."}, {key:"ج",text:"قطع فوری مایکوفتولات موفتیل (MMF) به دلیل تراتوژن بودن شدید و جایگزینی آن با داروی ایمن آزاتیوپرین (Azathioprine) جهت حفظ فاز نگهدارنده خاموشی لوپوس."}, {key:"د",text:"قطع کامل کلیه داروها از جمله هیدروکسی‌کلروکین و پردنیزون برای ممانعت از هرگونه آسیب جنینی."}],correct:"ج"},
{id:"۴۴",text:"خانم ۲۶ ساله‌ای به دنبال خونریزی شدید رحمی حین زایمان دچار شوک همودینامیک شدید و افت فشار طولانی‌مدت به مدت ۶ ساعت شده است. وی متعاقباً دچار آسیب حاد کلیوی شدید (AKI) با کراتینین ۷ میلی‌گرم در دسی‌لیتر شده و اکنون مدت ۳ هفته است که تحت همودیالیز مکرر قرار دارد. حجم ادرار ۲۴ ساعته بیمار کماکان ۲۰۰ میلی‌لیتر است. آزمایش ادرار بیمار نشان‌دهنده هماچوری میکروسکوپی خفیف بدون سیلندر ادراری است. سونوگرافی کلیه‌ها سایز طبیعی با افزایش اکوژنیسیته کورتکس را نشان می‌دهد. بر اساس سناریوهای بالینی Chapter 79 کتاب برنر، بهترین اقدام تشخیصی بعدی جهت تعیین پیش‌آگهی و افتراق علل عدم بازگشت کارکرد کلیه کدام است؟ [۳۷۳، ۳۷۴]",options:[{key:"الف",text:"انجام فوری سی‌تی اسکن کلیه‌ها با تزریق ماده حاجب (Contrast-enhanced CT) جهت بررسی وجود یا عدم وجود نکروز کورتیکال حاد (Acute Cortical Necrosis)."}, {key:"ب",text:"شروع فوری پالس کورتیکواستروئید وریدی دوز بالا و پلاسمافرز بدون نیاز به تصویربرداری عروقی."}, {key:"ج",text:"اعلام فوری بیماری به عنوان نارسایی برگشت‌ناپذیر کلیه (ESKD) و ثبت‌نام در لیست پیوند."}, {key:"د",text:"تجویز دوزهای بالای لوپ دیورتیک‌ها (فاروزماید وریدی تا ۵۰۰ میلی‌گرم در روز) جهت تحریک توبول‌ها."}],correct:"الف"},
{id:"۴۵",text:"خانم ۶۵ ساله‌ای به دلیل افزایش ناگهانی فشار خون به ۱۷۰/۹۵ میلی‌متر جیوه در طی دو سال اخیر که قبلاً همیشه زیر ۱۴۰/۹۰ بوده، ارزیابی می‌شود. وی در حال حاضر تحت درمان با لوزارتان، آملودیپین و اینداپامید قرار دارد. فشار خون وی در مطب ۱۳۴/۷۰ میلی‌متر جیوه است. آزمایشات بیمار کراتینین ۱.۵ میلی‌گرم در دسی‌لیتر (eGFR: 36 mL/min) را نشان می‌دهد. سونوگرافی داپلر کلیه‌ها سرعت جریان خون بسیار بالا (۳۱۰ سانتی‌متر بر ثانیه) را در شریان کلیوی چپ (با طول کلیه چپ ۹ سانتی‌متر) و سرعت طبیعی (۸۵ سانتی‌متر بر ثانیه) را در کلیه راست (با طول ۱۰.۸ سانتی‌متر) نشان می‌دهد. بر اساس یافته‌های بیوشیمیایی و پاتوفیزیولوژیک درگیری کلیوی شریان‌ها در Chapter 47 کتاب برنر، کدام گزاره در خصوص وضعیت کلیه چپ بیمار صحیح است؟",options:[{key:"الف",text:"به دلیل تنگی شدید عروقی و افت محسوس جریان خون، هایپوکسی لایه کورتیکال کلیه چپ حتمی بوده و منجر به آتروفی سریع می‌گردد."}, {key:"ب",text:"علیرغم کاهش شدید خون‌رسانی عروقی کلیوی، میزان اکسیژن‌رسانی به لایه کورتیکال کلیه چپ (Cortical oxygenation) تا حد زیادی حفظ می‌شود، زیرا کاهش GFR منجر به افت بار کاری انتقال املاح توبولار و در نتیجه کاهش مصرف اکسیژن می‌گردد."}, {key:"ج",text:"کاهش فیلتراسیون گلومرولی (GFR) به طور پاتولوژیک هایپوکسی لایه مدولاری کلیه چپ را تشدید می‌کند."}, {key:"د",text:"درمان با مسدودکننده‌های گیرنده آنژیوتانسین (لوزارتان) مانع از ترشح جبرانی رنین از کلیه ایسکمیک چپ می‌شود."}],correct:"ب"},
{id:"۴۶",text:"مرد ۸۱ ساله‌ای با تشخیص تنگی شدید شریان کلیوی دوطرفه در زمینه آترواسکلروز منتشر عروق، کراتینین ۱.۵ میلی‌گرم در دسی‌لیتر و آنوریسم آئورت شکمی کوچک (۳.۲ سانتی‌متر) پایش می‌شود. بر اساس مطالعات کوهورت درازمدت و تحلیل داده‌های مدیکر (Kalra et al) مندرج در Chapter 47 کتاب برنر، محتمل‌ترین عارضه بالینی و رویداد آسیب‌رسان که این بیمار را در طی ۲ سال آینده تهدید می‌کند کدام است؟ [۱۶۰، ۱۶۱]",options:[{key:"الف",text:"پارگی ناگهانی آنوریسم آئورت شکمی"}, {key:"ب",text:"پیشرفت برق‌آسا به سمت نارسایی مرحله انتهایی کلیه (ESKD) نیازمند دیالیز"}, {key:"ج",text:"بروز عوارض قلبی عروقی جدید شامل بروز یا تشدید آنژین صدری (Angina pectoris) و سندرم کرونری حاد"}, {key:"د",text:"سکته مغزی ایسکمیک عاجل عروقی"}],correct:"ج"},
{id:"۴۷",text:"مرد ۷۳ ساله‌ای در حین بررسی‌های مربوط به دردهای شکمی، با آنژیو-سی‌تی اسکن متوجه تنگی ۷۰ درصدی شریان کلیوی راست می‌شود. کارکرد کلیه چپ کاملاً طبیعی گزارش شده است. بیمار سابقه ۱۵ سال فشار خون بالا دارد و در حال حاضر با رژیم دارویی شامل یک داروی مهارکننده ACE (رامپریل)، یک بتا-بلاکر، یک آلفا-بلاکر، یک دیورتیک و دوزهای ضدپلاکتی آسپرین و کلوپیدوگرل تحت کنترل مناسب قرار دارد (فشار خون ۱۴۵/۷۴ میلی‌متر جیوه). بیمار فاقد نارسایی قلبی یا ادم ریوی راجعه است. متخصص قلب وی پیشنهاد استنت‌گذاری شریان کلیوی راست را مطرح می‌کند. طبق توصیه‌ها و پاسخ‌نامه‌های بورد مرجع برنر، بهترین اپروچ درمانی چیست؟ [۱۵۸، ۱۶۰]",options:[{key:"الف",text:"ارجاع سریع بیمار جهت انجام آنژیوپلاستی و تعبیه استنت شریان کلیه راست جهت ملوگیری از آتروفی کلیه."}, {key:"ب",text:"افزایش دوز رامپریل به تنهایی و قطع کلوپیدوگرل به دلیل خطر ترومبوز عروق داخل استنت."}, {key:"ج",text:"ادامه مدیریت محافظه‌کارانه و درمان طبی فعلی و پایش دوره‌ای؛ زیرا استنت‌گذاری عروق در تنگی‌های یک‌طرفه پایدار آترواسکلروتیک مزیتی بر درمان طبی بهینه نشان نداده است."}, {key:"د",text:"تعویض رامپریل با یک مسدودکننده گیرنده آنژیوتانسین (ARB) به همراه تعبیه اورژانسی فیلتر در شریان کلیه."}],correct:"ج"},
{id:"۴۸",text:"بیمار مرد ۲۶ ساله‌ای که ۹ ماه پیش پیوند کلیه دریافت کرده است، در پیگیری روتین با افزایش کراتینین سرم از ۱.۲ به ۱.۶ میلی‌گرم در دسی‌لیتر ارزیابی می‌شود. بیوپسی آلوگرافت کلیه انجام شده و التهاب شدید توبولوآینترستیشال همراه با ارتشاح لنفوسیتی و حضور اینکلوژن‌های هسته‌ای مثبت از نظر SV40 در سلول‌های اپیتلیال توبولار رویت می‌شود که پاتوگنومونیک نفریت ویروس BK (BKPyVAN) است. سطح ویرمی در پلاسما ۳۵۰,۰۰۰ کپی گزارش می‌شود. رژیم ایمونوسپرسیو فعلی شامل تاکرولیموس، مایکوفتولات موفتیل (MMF) و پردنیزون است. گام اول پاتوفیزیولوژیک در مدیریت درمانی این بیمار بر اساس راهنمای بالینی برنر کدام است؟",options:[{key:"الف",text:"شروع فوری سیدوفوویر (Cidofovir) وریدی دوز پایین به صورت هر دو هفته یک‌بار."}, {key:"ب",text:"افزودن لِووفلوکساسین خوراکی به مدت ۲ هفته جهت مهار پاتوژنیک ترشحات توبولار."}, {key:"ج",text:"شروع تزریق ماهیانه ایمونوگلوبولین وریدی (IVIG) دوز بالا بدون دستکاری دوز داروهای سرکوب‌کننده."}, {key:"د",text:"کاهش دوز یا قطع کامل داروی ضد متابولیت مایکوفتولات موفتیل (MMF) جهت احیای سیستم ایمنی سلولی آلوژنیک خودی."}],correct:"د"},
{id:"۴۹",text:"خانم ۵۰ ساله‌ای با بیماری کلیه پلی‌کیستیک (ADPKD) تحت پیوند کلیه قرار گرفته و داروی باسیلیکسی‌مب را به عنوان القای ایمنی دریافت کرده است. رژیم نگهدارنده وی شامل تاکرولیموس، مایکوفتولات موفتیل و پردنیزون است. کارکرد کلیه پیوندی ابتدا بسیار مناسب است اما در روز چهارم پس از پیوند، حجم ادرار ناگهان افت کرده و کراتینین سرم بالا می‌رود. بررسی‌های آزمایشگاهی نشان‌دهنده ترومبوسیتوپنی شدید (۴۲,۰۰۰), کم‌خونی پیشرونده (Hb: ۷.۵), حضور واضح شیستوسیت‌ها در لام خون محیطی، هپتوگلوبین کمتر از ۱۰ و LDH بالا (۷۵۰) به همراه کومبس مستقیم منفی است. بر اساس راهنمای Chapter 70 برنر، مناسب‌ترین گام بعدی در مدیریت درمانی چیست؟",options:[{key:"الف",text:"شروع پالس کورتیکواستروئید وریدی (متیل‌پردنیزولون) به دلیل ظن قوی به پس‌زدن سلولی حاد (TCMR)."}, {key:"ب",text:"شروع تعویض پلاسما روزانه به همراه تزریق اکولیزومب جهت مهار مسیر آلترناتیو کمپلمان."}, {key:"ج",text:"قطع فوری داروی تاکرولیموس و جایگزینی آن با سیکلوسپورین (یا یک رژیم عاری از CNI) به دلیل بروز میکروآنژیوپاتی ترومبوتیک (TMA) القا شده با تاکرولیموس."}, {key:"د",text:"ترخیص بیمار با دوزهای بالای هیدراتاسیون وریدی بدون دستکاری رژیم دارویی."}],correct:"ج"},
{id:"۵۰",text:"نفرولوژیست بخش پیوند در حال تنظیم رژیم دارویی سرکوب‌کننده ایمنی برای بیماران کاندید پیوند کلیه است و مایل است از پروتئین ادغامی **بِلاتاسِپت (Belatacept)** به عنوان جایگزین مهارکننده‌های کلسینورین جهت پیشگیری از نفروتوکسیسیته استفاده کند. بر اساس دستورالعمل‌های رسمی Chapter 70 برنر، استفاده از بلاتاسپت در کدام دسته از گیرندگان پیوند کلیه مطلقاً ممنوع (Contraindicated) است؟",options:[{key:"الف",text:"گیرندگان مسن بالای ۶۵ سال با سابقه بیماری قلبی عروقی پایدار."}, {key:"ب",text:"بیمارانی که گیرنده کلیه از یک اهداکننده با تطابق کامل HLA (HLA-identical) هستند."}, {key:"ج",text:"گیرندگان پیوند کلیه که از نظر سرمی برای ویروس اپشتین-بار منفی هستند (EBV Seronegative) به دلیل ریسک بسیار بالا و کشنده بروز بیماری لنفوپرولیفراتیو پس از پیوند (PTLD)."}, {key:"د",text:"گیرندگان پیوند کلیه که از نظر سرمی برای سیتومگالوویروس منفی (CMV Seronegative) هستند."}],correct:"ج"},
{id:"۵۱",text:"بیمار ۴۵ ساله‌ای که تحت پیوند کلیه قرار گرفته و رژیم نگهدارنده وی شامل تاکرولیموس با دوز هدف‌گذاری شده سطح خونی ۶-۸\text{ ng/mL} است، به دلیل بروز پرفشاری خون عروقی جدید کاندید شروع داروی فشار خون می‌شود. کدام داروی ضد فشار خون به دلیل مهار شدید آنزیم CYP3A4/5 کبد منجر به افزایش بحرانی و کشنده سطوح سرمی تاکرولیموس و بروز نفروتوکسیسیته حاد می‌گردد؟",options:[{key:"الف",text:"آزیترومایسین"}, {key:"ب",text:"دیلتیازم (Diltiazem)"}, {key:"ج",text:"فنی‌توئین (Phenytoin)"}, {key:"د",text:"آملودیپین (Amlodipine)"}],correct:"ب"},
{id:"۵۲",text:"در پاتوفیزیولوژی بیماری‌های بدخیم لنفاوی پس از پیوند، بروز سندرم **PTLD (Post-Transplant Lymphoproliferative Disorder)** به طور ذاتی ارتباط پاتومورفولوژیک بسیار نزدیکی با تکثیر کلونال کدام ویروس فرصت‌طلب در بستر سرکوب شدید ایمنی سلولی گیرنده دارد و منشأ سلولی شایع‌ترین نوع لیمفومای آن کدام است؟",options:[{key:"الف",text:"ویروس سیتومگالوویروس (CMV)؛ سلول‌های T-helper."}, {key:"ب",text:"ویروس اپشتین-بار (EBV)؛ لنفوسیت‌های B."}, {key:"ج",text:"ویروس پولیوما BK؛ سلول‌های توبولار مدولاری."}, {key:"د",text:"ویروس پاپیلومای انسانی (HPV)؛ سلول‌های سنگفرشی جداری."}],correct:"ب"},
{id:"۵۳",text:"در پایش بیوپسی کلیه آلوگرافت یک خانم ۳۵ ساله با افت ناگهانی کارکرد کلیه پیوندی، پاتولوژیست ویژگی‌های پاتومورفولوژیک را بررسی می‌کند. طبق معیارهای به روز شده سیستم بَنف (Banff Classification) مندرج در کتاب برنر، کدام ترکیب از یافته‌های بافتی و سرولوژیک قویاً مطرح‌کننده بروز **پس‌زدن حاد با واسطه آنتی‌بادی (Active AMR)** است؟",options:[{key:"الف",text:"ارتشاح ائوزینوفیلی شدید توبولار به همراه کست‌های مونوکلونال."}, {key:"ب",text:"رنگ‌آمیزی مثبت و شدید C4d در بیش از ۱۰ درصد مویرگ‌های دور توبولی، حضور آنتی‌بادی‌های اختصاصی دهنده (DSA) در سرم و التهاب میکروواسکولار شامل گلومرولیت (g > 0) و کاپیلاریت دور توبولی (ptc > 0)."}, {key:"ج",text:"آتروفی شدید بیش از ۵۰ درصد توبول‌های کورتکس به همراه نکروز لایه مدولاری."}, {key:"د",text:"حضور تجمعات لنفوسیتی در دیواره شریان‌های بزرگ بدون درگیری مویرگ‌ها."}],correct:"ب"},
{id:"۵۴",text:"در انتخاب رژیم درمانی القایی (Induction Therapy) در زمان جراحی پیوند کلیه جهت تعدیل خطر رد پیوند، کدام دارو به عنوان یک عامل **غیر کاهنده لنفوسیت (Non-lymphocyte depleting agent)** عمل می‌کند و پاتوژنز سلولی آن چیست؟",options:[{key:"الف",text:"داروی باسیلیکسی‌مب (Basiliximab)؛ آنتی‌بادی مونوکلونال ضد گیرنده آلفای اینترلوکین ۲ (CD25) که بدون تخریب سلول‌ها مانع از تکثیر آن‌ها می‌شود."}, {key:"ب",text:"داروی آلِمتوزومب (Alemtuzumab)؛ با مهار فیزیکی انتخابی لنفوسیت‌های مغز استخوان."}, {key:"ج",text:"آنتی‌تیموسیت گلوبولین (ATG)؛ که منجر به لیز سریع و گسترده تمام رده‌های سلول T می‌گردد."}, {key:"د",text:"داروی اکولیزومب؛ با مهار فیزیکی آبشار سیستم عروقی."}],correct:"الف"},
{id:"۵۵",text:"در ارزیابی کاندیداهای پیوند کلیه مبتلا به ویروس نقص ایمنی انسانی (HIV)، طبق پروتکل‌های رسمی Chapter 70 برنر، کاندیداتوری پیوند در کدام شرایط همودینامیک و ایمونولوژیک تایید می‌گردد؟ [۳۰۳، ۳۰۴]",options:[{key:"الف",text:"تعداد سلول‌های T CD4 کمتر از ۲۰۰ سلول در میکرولیتر و لود ویروسی بالا."}, {key:"ب",text:"پایداری کامل بالینی و کنترل مناسب لود ویروسی HIV (کاملاً غیرقابل شناسایی) به همراه تعداد سلول‌های CD4 بالای ۲۰۰ سلول در میکرولیتر و پایداری بر روی رژیم دارویی ضد ویروسی فعال (HAART)."}, {key:"ج",text:"عدم نیاز به پایش تعداد CD4 به شرط دریافت داروهای مهارکننده کلسینورین."}, {key:"د",text:"ممنوعیت مطلق دریافت کلیه پیوندی در مبتلایان به HIV به دلیل خطر بالای سپسیس عاجل."}],correct:"ب"},
{id:"۵۶",text:"بروز دیابت پس از پیوند (PTDM) یک عارضه متابولیک جدی با افزایش بار عوارض قلبی عروقی است. بر اساس پاتوفیزیولوژی Chapter 70 برنر، کدام داروی ایمونوسپرسیو نگهدارنده با مهار مستقیم فعالیت ذاتی رونویسی انسولین در سلول‌های بتای پانکراس، بیشترین ارتباط را با القای PTDM دارد؟",options:[{key:"الف",text:"داروی مایکوفتولات موفتیل (MMF)"}, {key:"ب",text:"داروی تاکرولیموس (Tacrolimus)"}, {key:"ج",text:"داروی سیکلوسپورین (Cyclosporine)"}, {key:"د",text:"داروی راپامایسین (Sirolimus)"}],correct:"ب"},
{id:"۵۷",text:"در بررسی بیوپسی آلوگرافت یک بیمار ۵۵ ساله که ۵ سال پیش پیوند کلیه دریافت کرده و اکنون با پروتئینوری شدید و افزایش تدریجی کراتینین مراجعه کرده است، پاتولوژیست نمای ایجاد خطوط دوگانه (Double contours) را در مویرگ‌های گلومرولی توصیف می‌کند. پاتوژنز و مکانیسم بافتی این پدیده عروقی ناشی از چیست؟",options:[{key:"الف",text:"آسیب حاد توبولار ناشی از مهارکننده‌های کلسینورین."}, {key:"ب",text:"پاسخ واکنشی و بازسازی مجدد دیواره اندوتلیوم مویرگ‌ها به دنبال آسیب مزمن عروقی فعال با واسطه آنتی‌بادی (Chronic active AMR)."}, {key:"ج",text:"سمیت مستقیم و برق‌آسای اوره بر روی پودوسیت‌های بومی."}, {key:"د",text:"ارتشاح سلول‌های آمیلوئیدی در کورتکس مدولاری کلیه پیوندی."}],correct:"ب"},
{id:"۵۸",text:"خانم ۳۴ ساله‌ای با سابقه دو بارداری موفق کاندید دریافت پیوند کلیه از اهداکننده زنده غیرفامیل است. بررسی سرم فعلی وی هیچ‌گونه آنتی‌بادی اختصاصی HLA ضد دهنده (DSA) را نشان نمی‌دهد و کراس‌مچ فلوسایتومتری فعلی برای هر دو سلول T و B کاملاً منفی است. با این حال، در پرونده بیمار سابقه یک تست کراس‌مچ فلوسایتومتری مثبت تاریخی (Historical) برای هر دو سلول T و B اهداکننده ثبت شده است. تعریف ریسک ایمونولوژیک این بیمار و اپروچ مناسب چگونه است؟",options:[{key:"الف",text:"فاقد ریسک ایمونولوژیک؛ انجام پیوند بدون نیاز به القای ایمنی تهاجمی بلامانع است."}, {key:"ب",text:"ریسک ایمونولوژیک بالا؛ حضور سلول‌های B حافظه‌ای تاریخی خطر عود زودهنگام یادآور (Anamnestic response) و تولید انبوه DSA پس از پیوند را به همراه دارد و بیمار نیازمند القای تهاجمی است."}, {key:"ج",text:"ریسک متوسط؛ بیمار تنها کاندید دریافت دوزهای تعدیل‌شده تاکرولیموس است."}, {key:"د",text:"نیاز به تعویض پلاسما پیش از پیوند برطرف شده زیرا سیستم ایمنی هومورال فعلی وی در فاز خاموشی کامل است."}],correct:"ب"},
{id:"۵۹",text:"داوطلب اهدای کلیه زنده به دلیل تنوع شدید در توده عضلانی و وزن بدن، جهت ارزیابی دقیق میزان فیلتراسیون گلومرولی (GFR) بررسی می‌شود. طبق الگوریتم رسمی ارزیابی اهداکننده در Chapter 71 (شکل ۷۱.۳)، بهترین و دقیق‌ترین رویکرد در تخمین GFR اولیه و تایید نهایی آن کدام است؟",options:[{key:"الف",text:"سنجش GFR انحصاماً با فرمول eGFRcr بر اساس کراتینین سرم کافی است."}, {key:"ب",text:"ارزیابی اولیه با eGFRcr یا eGFRcys (سیستاتین C) شروع شده و تایید نهایی در صورت لزوم باید با اندازه گیری مستقیم (mGFR با کلیرنس اگزوژن یا کلیرنس کراتینین ۲۴ ساعته) صورت گیرد."}, {key:"ج",text:"انجام بیوپسی کلیه جهت شمارش تعداد گلومرول‌های فعال الزامی است."}, {key:"د",text:"تست بار پروتئینی تنها راه تایید کارکرد کلیه در اهداکنندگان جوان است."}],correct:"ب"},
{id:"۶۰",text:"در مشاوره ژنتیک برای کاندیداهای اهدای کلیه زنده با نژاد آفریقایی-آمریکایی، غربالگری ژنتیکی برای واریانت‌های ریسک ژن **APOL1** انجام می‌شود. حضور دو واریانت ریسک در فرد داوطلب بر اساس پایش‌های Chapter 71 کتاب برنر با چه عواقبی برای اهداکننده همراه است؟ [۴۹۶، ۵۴۱]",options:[{key:"الف",text:"وجود این دو واریانت به طور ذاتی ریسک ابتلای خود فرد داوطلب به نارسایی کلیه را در طول عمر افزایش می‌دهد و نفرکتومی اهداکننده با کاهش توده کلیوی می‌تواند بروز این روند را سرعت بخشد."}, {key:"ب",text:"وجود این دو واریانت یک کنتراندیکاسیون مطلق برای اهدای کلیه است زیرا منجر به نارسایی برق‌آسای کلیه مقابل پس از نفرکتومی می‌شود."}, {key:"ج",text:"این ژن تنها زمانی اهمیت دارد که گیرنده پیوند نیز دو واریانت ریسک مشابه را دارا باشد."}, {key:"د",text:"حضور این واریانت‌ها GFR پایه بیمار را بیش از ۵۰ درصد کاهش می‌دهد."}],correct:"الف"},
{id:"۶۱",text:"بیمار مرد ۵۴ ساله‌ای که تحت همودیالیز نگهدارنده از طریق گرافت عروقی (AVG) در ساعد چپ است، با افزایش مکرر فشارهای وریدی دستگاه حین جلسات دیالیز ارزیابی می‌شود. پزشک بخش مشکوک به وجود تنگی در مسیر خروجی عروقی است. بر اساس آمار حاصل از آنژیوگرافی‌های ثبت‌شده در متون مرجع Handbook of Dialysis، شایع‌ترین ضایعه رادیولوژیک عروقی که مسئول اصلی اختلال جریان خون و شکست دسترسی‌های عروقی فیستول (AVF) و گرافت (AVG) است کدام است و محل شایع آن در گرافت کجاست؟",options:[{key:"الف",text:"تنگی شریان تغذیه‌کننده آوران (Arterial stenosis)؛ در محل اتصال به گرافت."}, {key:"ب",text:"تنگی ورید تخلیه‌کننده (Venous stenosis)؛ به ویژه در محل اتصال گرافت به ورید تخلیه‌کننده (Vein-graft anastomosis) در AVG و ناحیه مجاور آناستوموز در AVF."}, {key:"ج",text:"تنگی ورید مرکزی ساب‌کلاوین (Central vein stenosis) به طور انحصاری."}, {key:"د",text:"تشکیل پاتوژنیک کست‌های فیبرینی در طول کل مسیر گرافت."}],correct:"ب"},
{id:"۶۲",text:"بیمار خانم ۶۲ ساله‌ای که تحت همودیالیز خانگی مکرر است، به دلیل خونریزی شدید ناگهانی از محل آنوریسم ایجاد شده روی فیستول عروقی به اورژانس آورده می‌شود. در پایش‌های قبلی بیمار مشخص شده که وی از تکنیک سوزن‌زنی در یک ناحیه محدود استفاده می‌کرده است. بر اساس راهنمای مراقبت از دسترسی عروقی در Handbook of Dialysis، کدام فاکتور جدی با افزایش خطر نازک‌شدن دیواره عروق و پارگی (Rupture) فیستول در این بیمار همراهی دارد؟",options:[{key:"الف",text:"سوزن‌زنی مکرر در یک سوراخ یا ناحیه بسیار محدود (Area cannulation) به جای استفاده از تکنیک نردبانی (Rope ladder)."}, {key:"ب",text:"انجام دیالیزهای شبانه طولانی‌مدت به همراه استفاده از هپارین دوز بالا."}, {key:"ج",text:"انجام ارزیابی‌های آنژیوگرافی دوره‌ای پیشگیرانه."}, {key:"د",text:"استفاده از پمپ‌های کلسیمی توبولار پروگزیمال در مجرای دیالیز."}],correct:"الف"},
{id:"۶۳",text:"نفرولوژیست بخش دیالیز در حال آموزش به پرسنل پرستاری در خصوص نحوه مواجهه با خونریزی حاد عروقی از محل فیستول یا گرافت پس از خروج سوزن‌ها است. بر اساس دستورالعمل‌های رسمی Handbook of Dialysis، کدام تکنیک یا اقدام برای کنترل خونریزی **نامناسب (Inappropriate)** است و می‌تواند عواقب فاجعه‌باری داشته باشد؟",options:[{key:"الف",text:"اعمال فشار مستقیم دیجیتال با انگشت بر روی نقطه دقیق خونریزی."}, {key:"ب",text:"اعمال فشار مستقیم موضعی با استفاده از درب بطری که قسمت توخالی آن به سمت پوست بیمار قرار دارد."}, {key:"ج",text:"بستن تورنیکه (تورنیکت) سفت در قسمت پروگزیمال نقطه خونریزی (نزدیک‌تر به تنه بیمار)؛ به دلیل خطر بسیار بالای بروز ایسکمی شدید دست و ترومبوز عاجل و دائم فیستول عروقی."}, {key:"د",text:"استفاده از پدهای هموستاتیک استریل آغشته به کلسیم."}],correct:"ج"},
{id:"۶۴",text:"بیمار مرد ۵۰ ساله‌ای که قرار است تحت دیالیز صفاقی مداوم سیار (CAPD) قرار گیرد، از نفرولوژیست خود در خصوص موثرترین و تاییدشده‌ترین راه جهت به حداقل رساندن ریسک بروز پریتونیت (PD-related peritonitis) سوال می‌کند. طبق شواهد بالینی مندرج در Handbook of Dialysis، کدام اقدام به طور پیوسته منجر به کاهش آماری نرخ عفونت صفاقی می‌شود؟",options:[{key:"الف",text:"استفاده منظم از محلول آیکودکسترین (Icodextrin) برای تعویض‌های طولانی‌مدت شبانه."}, {key:"ب",text:"تعبیه کاتتر صفاقی پیش‌جناغی (Pre-sternal catheter) برای کلیه بیماران."}, {key:"ج",text:"استفاده روتین از دستکش‌های کاملاً استریل برای انجام تعویض‌های معمولی در منزل."}, {key:"د",text:"مصرف روزانه و موضعی پماد آنتی‌بیوتیکی موپیروسین (Mupirocin) یا جنتامایسین در محل خروجی کاتتر صفاقی (Exit-site)."}],correct:"د"},
{id:"۶۵",text:"در ارزیابی روش‌های نوین طب اورژانس برای مسمومیت‌ها و اوردوزهای دارویی، نفرولوژیست کاندیداتوری تصفیه سموم خارج‌بدنی را پایش می‌کند. بر اساس فارماکوکینتیک سموم مندرج در کتاب برنر و هندبوک دیالیز، شایع‌ترین روش خارج‌بدنی مورد استفاده در مسمومیت‌ها کدام است و ویژگی‌های سم ایده‌آل برای این روش چیست؟",options:[{key:"الف",text:"هموپرفیوژن (Hemoperfusion)؛ برای سموم بسیار بزرگ و کاملاً متصل به چربی."}, {key:"ب",text:"همودیالیز متناوب (Intermittent Hemodialysis)؛ برای سموم واجد وزن مولکولی پایین، محلول در آب، دارای حجم توزیع کم و اتصال ناچیز به پروتئین‌های پلاسما."}, {key:"ج",text:"پلاسمافرز تهاجمی دوز بالا؛ برای سموم حاوی ترکیبات کلسیمی غشایی."}, {key:"د",text:"هموفیلتراسیون مداوم (CVVH)؛ به عنوان خط اول درمان در تمامی مسمومیت‌های حاد."}],correct:"ب"},
{id:"۶۶",text:"بیمار خانم ۶۵ ساله‌ای با نارسایی کلیه پیشرفته و اورمی شدید (BUN: 210 mg/dL) کاندید شروع اولین جلسه همودیالیز متناوب است. بیمار در طی جلسه اول دچار سردرد شدید، تهوع، بیقراری و گرفتگی عضلات می‌شود و متعاقباً دچار تشنج حاد می‌گردد. سی‌تی اسکن مغز ادم مغزی شدید را گزارش می‌کند. پاتوفیزیولوژی این پدیده عروقی یعنی **سندرم عدم تعادل دیالیز (DDS)** ناشی از چیست و کدام فاکتور ریسک بروز آن را بالا می‌برد؟ [۶۹۳، ۶۹۴t]",options:[{key:"الف",text:"سمیت مستقیم ترکیبات آلومینیوم موجود در آب تصفیه‌نشده دیالیز."}, {key:"ب",text:"کلیرنس و کاهش سریع اوره از فضای خارج‌سلولی خون در طی دیالیز شدید، که منجر به ایجاد گرادیان اسمزی معکوس و ورود آب به سلول‌های مغزی و ادم مغزی می‌گردد؛ غلظت بالای BUN اولیه بیمار ریسک بروز آن را به شدت بالا می‌برد."}, {key:"ج",text:"افت ناگهانی سطوح کلسیم کورتیکال به علت مهار پمپ‌های توبولار."}, {key:"د",text:"نشت مفرط مایع دیالیز صفاقی به داخل مجرای دیافراگم."}],correct:"ب"},
{id:"۶۷",text:"خانم ۵۸ ساله‌ای با نارسایی کلیه اورمیک و سوءتغذیه شدید تحت درمان همودیالیز نگهدارنده قرار دارد. پزشک وی رژیم تغذیه داخل دیالیز (IDPN) حاوی دکستروز ۵۰ درصد، آمینواسیدها و چربی‌ها را برقرار می‌کند [۸۶۹، ۸۷۰]. پرستار دیالیز در پایان جلسه دیالیز، کیسه حاوی محلول IDPN را ناگهان قطع می‌کند. بیمار ۱۰ دقیقه پس از اتمام دیالیز دچار ضعف شدید، عرق سرد، تپش قلب و گیجی می‌شود. پاتوفیزیولوژی این عارضه در این بیمار چیست و پرستار چگونه باید از بروز آن ممانعت می‌کرد؟",options:[{key:"الف",text:"بروز هایپرکالمی شدید واکنشی؛ پالس وریدی کلسیم گلوکونات."}, {key:"ب",text:"بروز هایپوگلیسمی واکنشی (Rebound hypoglycemia) ناشی از مهار ناگهانی بار کربوهیدراتی بالا در خون؛ جهت ممانعت، بیمار باید در ۳۰ دقیقه پایانی دیالیز کربوهیدرات دهانی مصرف می‌کرد یا سرعت قطع دارو تدریجی می‌بود."}, {key:"ج",text:"بروز هایپرلیپیدمی شدید با سمیت مستقیم روی عضلات قلب."}, {key:"د",text:"سمیت مستقیم آمینواسیدها بر روی سلول‌های پودوسیتی کورتکس مغز."}],correct:"ب"},
{id:"۶۸",text:"مرد ۶۰ ساله‌ای مبتلا به نارسایی کلیه ثانویه به هایپرتنشن، به مدت ۳ سال تحت دیالیز صفاقی خودکار (APD) قرار دارد. وی تا سال گذشته دارای ادرار باقیمانده به میزان ۵۰۰ سی‌سی در روز بوده اما اکنون کاملاً آنوریک شده است. بررسی‌های آزمایشگاهی اخیر وی نشان‌دهنده افت میزان کل Kt/Vurea هفتگی به ۱.۵۶ (هدف حداقل ۱.۷) است. طبق راهنمای مدیریت دیالیز صفاقی در Handbook of Dialysis، موثرترین اقدام اولیه جهت دستیابی به هدف کفایت دیالیز در این بیمار چیست؟",options:[{key:"الف",text:"شروع داروهای دیورتیک خوراکی دوز بالا جهت احیای ادرار."}, {key:"ب",text:"افزایش حجم محلول تعویض شبانه یا افزایش فرکانس تعویض‌های صفاقی جهت جبران توده فعال از دست رفته کلیه خود بیمار."}, {key:"ج",text:"قطع کامل دیالیز صفاقی و انتقال عاجل بیمار به بخش همودیالیز نگهدارنده."}, {key:"د",text:"کاهش شدید دوز پروتئین مصرفی روزانه بیمار جهت کاهش تولید اوره."}],correct:"ب"},
{id:"۶۹",text:"دختر ۱۸ ساله‌ای با نارسایی کلیه مرحله انتهایی که مدت ۴ ماه است تحت دیالیز صفاقی خودکار (APD) قرار دارد، با شکایت از تغییر ناگهانی رنگ مایع تخلیه‌شده صفاقی به رنگ صورتی مایل به قرمز مراجعه می‌کند. این عارضه از روز گذشته و همزمان با شروع خونریزی ماهیانه وی پدید آمده است. در معاینه بالینی، وی کاملاً پایدار بوده و ادم، تب یا درد شکم ندارد. آنالیز سلولی مایع صفاقی نشان‌دهنده سفیدک‌های (WBC) معادل ۲۰ در میکرولیتر و RBC معادل ۸۰۰ در میکرولیتر است. بر اساس راهنمای Handbook of Dialysis، رویکرد درمانی طلایی در مواجهه با این عارضه چیست؟",options:[{key:"الف",text:"انجام فوری جراحی خروج کاتتر صفاقی به دلیل خونریزی شدید فعال داخلی."}, {key:"ب",text:"شروع درمان با دوزهای بالای آنتی‌بیوتیک داخل صفاقی جهت پوشش پریتونیت فعال."}, {key:"ج",text:"اطمینان‌بخشی به بیمار و ادامه روتین درمان صفاقی؛ این پدیده به عنوان هموپریتونئوم خوش‌خیم ناشی از قاعدگی پس‌رونده (Retrograde menstruation) شناخته شده و نیازمند اقدام تهاجمی نیست."}, {key:"د",text:"شستشوی تهاجمی صفاق با محلول نرمال سالین سرد حاوی مقادیر بالای هپارین."}],correct:"ج"},
{id:"۷۰",text:"مرد ۵۸ ساله‌ای جهت شروع همودیالیز ارزیابی می‌شود. وی سابقه تعبیه مکرر کتترهای وریدی موقت در ناحیه **ساب‌کلاوین راست** در بستری‌های قبلی داشته است. در بررسی‌های داپلر عروقی فعلی ساعد راست، جریان شریانی و وریدی مناسب جهت تعبیه فیستول رویت می‌شود اما اندام فوقانی راست بیمار دارای تورم خفیف و اتساع وریدهای سطحی است. بر اساس پاتوژنز عوارض کاتتریزاسیون در Handbook of Dialysis، شایع‌ترین عارضه عروقی دیررس ناشی از کتترهای ساب‌کلاوین که تعبیه فیستول در آن اندام را ممنوع می‌سازد چیست و چه اقدام پیشگیرانه‌ای توصیه می‌شود؟",options:[{key:"الف",text:"ترومبوز شریان بازویی؛ شروع درمان با وارفارین دوز بالا."}, {key:"ب",text:"تنگی شدید ورید مرکزی ساب‌کلاوین (Subclavian vein stenosis) ناشی از آسیب اندوتلیال کتتر؛ جهت پیشگیری، از تعبیه کتتر در ورید ساب‌کلاوین باید مطلقاً خودداری شده و ورید ژوگولار داخلی ترجیح داده شود."}, {key:"ج",text:"هایپرپلازی لایه صدف شریانچه آوران."}, {key:"د",text:"عفونت قارچی منتشر در کورتکس مدولاری دست."}],correct:"ب"},
{id:"۷۱",text:"پزشک بخش دیالیز مایل است کارکرد صافی‌های گلومرولی دیالیزورها را با یکدیگر مقایسه کند. بر اساس تعاریف فیزیکی و غشایی در Handbook of Dialysis، تفاوت عملکردی صافی‌های با غشای شار بالا (High-flux dialyzers) در مقایسه با صافی‌های شار پایین (Low-flux dialyzers) در چیست؟ [۷۵، ۸۹۳]",options:[{key:"الف",text:"صافی‌های High-flux دارای توانایی بالایی در کلیرنس مولکول‌های بزرگ و متوسط نظیر **بتا-۲ میکروگلوبولین ($\beta_2\text{-}MG$)** هستند و ضریب اولترافیلتراسیون (Kuf) آن‌ها بالای ۱۵ تا ۲۰ میلی‌لیتر بر ساعت بر میلی‌متر جیوه است."}, {key:"ب",text:"صافی‌های Low-flux دارای منافذ بسیار بزرگتری بوده و فاقد کلیرنس اوره هستند."}, {key:"ج",text:"تفاوت آن‌ها منحصراً در نوع مواد پلاستیکی به کار رفته در بدنه صافی است."}, {key:"د",text:"صافی‌های High-flux کلسیم را مهار کرده و پتاسیم را به طور کامل حفظ می‌کنند."}],correct:"الف"},
{id:"۷۲",text:"در بررسی نتایج آزمایش تبادل صفاقی (PET) یک بیمار ۵۴ ساله تحت درمان با CAPD، مشخص می‌شود که غلظت کراتینین مایع تخلیه‌شده نسبت به پلاسما در ساعت چهارم (D/P\\ Cr) معادل ۰.۸۲ (محدوده High transporter) است. پاتوفیزیولوژی این دسته از بیماران صفاقی در مواجهه با محلول‌های قندی چیست و چه رژیم دیالیزی برای آنان ارجاع ترجیحی است؟ [۳۵۷، ۴۲۲]",options:[{key:"الف",text:"این بیماران گلوکز صفاقی را بسیار کند جذب می‌کنند و دارای بیشترین میزان اولترافیلتراسیون در تعویض‌های طولانی‌مدت هستند."}, {key:"ب",text:"به دلیل انتقال سریع املاح، این بیماران گرادیان اسمزی قندی را در ساعات اولیه از دست می‌دهند و در تعویض‌های طولانی‌مدت دچار جذب مایع صفاقی می‌شوند؛ این دسته از بیماران با رژیم‌های با زمان توقف کوتاه (مانند دیالیز صفاقی خودکار یا APD) پاسخ بسیار مناسب‌تری نشان می‌دهند."}, {key:"ج",text:"این بیماران کاندیدهای مناسبی برای تعویض‌های دستی با زمان dwell بالای ۱۲ ساعت هستند."}, {key:"د",text:"غشای صفاق این بیماران فاقد هرگونه انتقال فعال برای نمک و آب است."}],correct:"ب"},
{id:"۷۳",text:"خانم ۴۲ ساله‌ای با نارسایی حاد کلیه پیشرونده سریع (eGFR: ۸)، هلال‌های وسیع در بیوپسی کلیه و هماچوری مراجعه می‌کند. بررسی سرولوژیک آنتی‌بادی Anti-GBM را تایید می‌کند. بیمار همزمان دچار خونریزی شدید ریوی (هموپتیزی واضح) شده است. پزشک بیمار مایل به شروع درمان با تعویض پلاسما (TPE) در کنار داروهای سرکوب‌کننده ایمنی است. طبق شواهد بالینی Chapter 32 و Handbook of Dialysis، کدام گزاره بالینی در خصوص کاربرد TPE در این بیمار صحیح است؟ [۲۸۹، ۲۹۰]",options:[{key:"الف",text:"نارسایی پیشرفته کلیه نیازمند دیالیز در بدو ورود، یک کنتراندیکاسیون مطلق برای شروع پلاسمافرز است."}, {key:"ب",text:"حضور خونریزی ریوی فعال شدید یک اندیکاسیون فوری و حیاتی برای شروع پلاسمافرز روزانه جهت خارج کردن سریع آنتی‌بادی‌های پاتوژنیک و حفظ بقای بیمار است."}, {key:"ج",text:"پلاسمافرز تنها در صورت عدم وجود هماچوری در آزمایش ادرار بیمار اندیکاسیون دارد."}, {key:"د",text:"کارایی پلاسمافرز در Anti-GBM کماکان فاقد شواهد علمی تایید شده است."}],correct:"ب"},
{id:"۷۴",text:"در ارزیابی کاربردهای درمانی تعویض پلاسما (TPE) در بخش نفرولوژی، کدام پاتولوژی کلیوی بر اساس مطالعات کارآزمایی بالینی تصادفی‌سازی‌شده (RCTs) بزرگ، فاقد شواهد علمی مستند در نشان دادن بهبود بقای کلیوی آلوگرافت و کاهش مرگ‌ومیر پس از درمان با TPE است؟ [۲۹۰، ۲۹۱]",options:[{key:"الف",text:"میکروآنژیوپاتی ترومبوتیک (TMA) ثانویه به مصرف تیکلوپیدین."}, {key:"ب",text:"مسمومیت‌ها با داروهای متصل به پروتئین بالا."}, {key:"ج",text:"نفروپاتی سیلندری زنجیره سبک (Cast Nephropathy) در بیماران مبتلا به مالتیپل میلوما."}, {key:"د",text:"مسمومیت‌های سیستمیک شدید با باریم نیترات."}],correct:"ج"},
{id:"۷۵",text:"بر اساس طبقه‌بندی انجمن آمریکایی پلاسمافرز (ASFA) مندرج در متون مرجع Chapter 32 برنر، استفاده از تعویض پلاسما (TPE) در کدام‌یک از پاتولوژی‌های زیر فاقد جایگاه علمی درمانی (Category IV) بوده و هیچ مزیتی بر درمان‌های سنتی نشان نداده است؟ [۲۹۱، ۲۹۲]",options:[{key:"الف",text:"سندرم گیلن باره فعال عروقی"}, {key:"ب",text:"بیماری میاستنی گراویس بحرانی"}, {key:"ج",text:"بیماری گلومرولونفریت IgA همراه با هلال در بیوپسی کلیه (Crescentic IgAN)"}, {key:"د",text:"واسکولیت‌های ANca با نارسایی کلیه پیشرفته"}],correct:"ج"},
{id:"۷۶",text:"بیمار خانم ۶۴ ساله‌ای با نارسایی مزمن کلیه (eGFR: 24 mL/min) به دلیل حملات مکرر و بسیار دردناک آرتریت نقرسی در شست پای راست ارزیابی می‌شود. پزشک وی تصمیم به شروع داروی مهارکننده گزانتین اکسیداز (آلوپورینول) جهت کنترل طولانی‌مدت اسید اوریک می‌گیرد. بر اساس دستورالعمل‌های تنظیم دوز دارو در بیماران کلیوی در Chapter 61 برنر (جدول ۶۱.۸)، دوز شروع آلوپورینول برای این بیمار چگونه باید تعدیل گردد و عارضه جدی حاصل از عدم تعدیل آن کدام است؟",options:[{key:"الف",text:"تجویز دوزهای استاندارد روزانه ۳۰۰ میلی‌گرم بدون نیاز به تعدیل دوز؛ عدم کنترل اسید اوریک پیشرونده است."}, {key:"ب",text:"کاهش دوز شروع به ۵۰ تا ۱۰۰ میلی‌گرم روزانه به دلیل کاهش کلیرنس کلیوی و تجمع متابولیت فعال آن (اکسی‌پورینول)؛ عدم تعدیل دوز ریسک بروز سندرم حساسیت مفرط مرگ‌بار آلوپورینول (AHS) همراه با واسکولیت، راش پوستی شدید اگسفولیاتیو و نارسایی کبدی را به شدت بالا می‌برد."}, {key:"ج",text:"تجویز دوزهای تک‌دوز هفتگی بدون نیاز به ارزیابی کارکرد کلیه."}, {key:"د",text:"ممنوعیت مطلق تجویز آلوپورینول در eGFR زیر ۳۰ و جایگزینی آن با لوزارتان با دوز فوق‌العاده بالا."}],correct:"ب"},
{id:"۷۷",text:"خانم ۷۲ ساله‌ای با بیماری مزمن کلیه مرحله ۴ (eGFR: 22 mL/min) متعاقب دردهای مکرر عضلانی ناشی از دیسک کمر، تحت درمان با داروی شل‌کننده عضلانی **باکلوفن (Baclofen)** با دوز ۱۰ میلی‌گرم سه بار در روز قرار می‌گیرد. بیمار پس از ۳ روز مصرف دارو، با خواب‌آلودگی شدید، منگی، برادی‌کاردی واضح و در نهایت کما به اورژانس آورده می‌شود [۲۱، ۲۲]. در بررسی مغز، هیچ‌گونه سکته یا خونریزی رویت نمی‌شود. بر اساس پاتوفیزیولوژی Chapter 15 کتاب برنر، علت اصلی وضعیت ذهنی بیمار چیست و دوز مناسب باکلوفن در این محدوده کارکرد کلیه چقدر است؟ [۲۱، ۲۲]",options:[{key:"الف",text:"نارسایی برق‌آسای حاد کبدی ناشی از سوءتغذیه؛ شروع ان‌استیل‌سیستئین."}, {key:"ب",text:"مسمومیت و سمیت حاد سیستم عصبی مرکزی با باکلوفن به دلیل کاهش فیلتراسیون کلیوی آن؛ باکلوفن در eGFR زیر ۳۰ میلی‌لیتر در دقیقه کنتراندیکاسیون مطلق داشته و باید کاملاً اجتناب شود."}, {key:"ج",text:"بروز آنسفالوپاتی اورمیک حاد ناشی از مهار پمپ‌های سدیم."}, {key:"د",text:"افت شدید کلسیم مغزی به علت مسدود شدن ترانسپورتر پندرین."}],correct:"ب"},
{id:"۷۸",text:"مرد ۶۸ ساله‌ای با بیماری مزمن کلیه مرحله ۳ب (eGFR: 38 mL/min) کاندید انجام تصویربرداری تشخیصی قلب با تزریق ماده حاجب یددار (Contrast-enhanced cardiac catheterization) است. نفرولوژیست بخش جهت مشاوره برای پیشگیری از آسیب حاد کلیوی ناشی از مواد حاجب (CA-AKI) فراخوانده می‌شود. بر اساس گایدلاین‌های رسمی Chapter 15 برنر، موثرترین و شواهدپذیرترین رویکرد در مدیریت این بیمار چیست؟",options:[{key:"الف",text:"بستری و شروع دیالیز پیشگیرانه (Prophylactic dialysis) در عرض ۲ ساعت قبل و بعد از تزریق ماده حاجب."}, {key:"ب",text:"هیدراتاسیون وریدی منظم با نرمال سالین ایزوتونیک (با سرعت ۱ میلی‌لیتر بر کیلوگرم بر ساعت) از ۱۲ ساعت قبل تا ۱۲ ساعت بعد از تزریق، به همراه قطع موقت داروهای نفروتوکسیک و لوزارتان و هولد متفورمین جهت ممانعت از بروز لاکتیک اسیدوز در صورت بروز AKI."}, {key:"ج",text:"محدودیت کامل مصرف هرگونه آب و مایعات از ۲۴ ساعت قبل جهت تمرکز فیلتراسیون."}, {key:"د",text:"هیدراتاسیون تهاجمی با قند دیستال هایپرتونیک بدون هولد لوزارتان."}],correct:"ب"},
{id:"۷۹",text:"در تنظیم رژیم درمانی دیابت برای یک بیمار ۶۲ ساله مبتلا به بیماری مزمن کلیه پیشرفته، کدام گزینه نشان‌دهنده پاتوفیزیولوژی توبولار و ممنوعیت مصرف داروی **متفورمین (Metformin)** بر اساس راهنماهای Chapter 61 برنر است؟ [۲۴۴، ۲۵۳]",options:[{key:"الف",text:"متفورمین در eGFR زیر ۴۵ میلی‌لیتر در دقیقه کنتراندیکاسیون نسبی داشته و دوز آن باید به نصف کاهش یابد؛ در eGFR زیر ۳۰ میلی‌لیتر در دقیقه به دلیل خطر تجمع مفرط دارو در کلیه و القای اسیدوز لاکتیک شدید و مرگ‌بار (Metformin-associated lactic acidosis) ممنوعیت مطلق دارد."}, {key:"ب",text:"متفورمین پتاسیم را به شدت بالا برده و منجر به وازوکنستریکشن شریانچه آوران می‌شود."}, {key:"ج",text:"این دارو با مسدود کردن انتخابی کانال‌های کلسیم در مدولای کلیه، GFR را کاهش می‌دهد."}, {key:"د",text:"متفورمین در تمام فازهای CKD بدون محدودیت دوز قابل استفاده است."}],correct:"الف"},
{id:"۸۰",text:"خانم ۵۲ ساله‌ای با کراتینین پایه ۰.۹ میلی‌گرم در دسی‌لیتر، به دنبال مصرف داروی امپرازول (یک مهارکننده پمپ پروتون یا PPI) جهت تسکین رفلاکس معده به مدت ۲ هفته، با افزایش کراتینین به ۲.۸ میلی‌گرم در دسی‌لیتر، ائوزینوفیلی خفیف خون محیطی و تب خفیف مراجعه می‌کند. بیوپسی کلیه ارتشاح منتشر لکوسیت‌های چند هسته‌ای و ائوزینوفیل‌ها را در فضای بینابینی توبول‌ها نشان می‌دهد که موید نفریت بینابینی حاد (AIN) است. طبق راهنمای Chapter 15 برنر، کدام گزاره در خصوص پاتوژنز و داروهای محرک AIN صحیح است؟",options:[{key:"الف",text:"امپرازول ارتباطی با AIN ندارد و پاتوژن محرک اصلی قطعاً مصرف پنهان مسکن‌های تیازیدی بوده است."}, {key:"ب",text:"مهارکننده‌های پمپ پروتون (PPIs)، مسکن‌های غیراستروئیدی (NSAIDs) و آنتی‌بیوتیک‌ها (نظیر آموکسی‌سیلین و سفالوسپورین‌ها) شایع‌ترین علل دارویی القاکننده عارضه ایمونولوژیک AIN در کلیه‌ها به شمار می‌روند."}, {key:"ج",text:"ضایعه بافتی AIN همواره بدون اسکار توبولار بهبود یافته و نیازی به قطع دارو وجود ندارد."}, {key:"د",text:"AIN یک واکنش سمی وابسته به دوز مصرفی دارو است."}],correct:"ب"},
{id:"۸۱",text:"در بررسی‌های اپیدمیولوژیک و کارآزمایی‌های بالینی بزرگ در نفرولوژی، اثربخشی درمان‌های کاهنده چربی (استاتین‌ها) در بیماران مبتلا به بیماری‌های کلیوی بررسی شده است. بر اساس شواهد مستند کارآزمایی‌های بالینی تصادفی‌سازی‌شده بزرگ (نظیر مطالعات 4D، AURORA و SHARP) مندرج در کتاب برنر، کدام گزاره در خصوص مصرف استاتین‌ها صحیح است؟ [۱۸۳، ۱۸۶]",options:[{key:"الف",text:"شروع درمان با استاتین‌ها در بیماران همودیالیزی منجر به کاهش بارز حوادث قلبی عروقی و بقای بیمار می‌گردد."}, {key:"ب",text:"استفاده از ترکیبات استاتین (مانند سیمواستاتین به همراه ازتیمایب بر اساس مطالعه SHARP) در کاهش عوارض عروقی و آترواسکلروتیک در بیماران مبتلا به CKD مراحل ۳ تا ۵ (غیر دیالیزی) و بیماران پیوندی موثر است؛ اما شروع آن در بیمارانی که در حال حاضر تحت دیالیز نگهدارنده هستند (بر اساس کارآزمایی‌های 4D و AURORA) هیچ منفعتی در کاهش حوادث قلبی عروقی یا مرگ‌ومیر نشان نداده است."}, {key:"ج",text:"استاتین‌ها در تمامی مراحل پیوند و دیالیز اثربخشی کاملاً یکسانی در کاهش حوادث نشان می‌دهند."}, {key:"د",text:"مصرف استاتین‌ها به کلیه دیالیزی‌ها آسیب توبولار پروگزیمال وارد می‌سازد."}],correct:"ب"},
{id:"۸۲",text:"در تصمیم‌گیری جهت اصلاح کم‌خونی در بیماران مبتلا به بیماری مزمن کلیه با استفاده از عوامل محرک اریت‌پوئز (ESAs)، تعیین میزان هدف هموگلوبین پلاسما حائز اهمیت بالینی است [۱۸۹، ۴۵۳]. بر اساس نتایج حاصل از کارآزمایی‌های بالینی بزرگ و معتبر بین‌المللی (نظیر مطالعات TREAT و CHOIR)، هدف‌گذاری و ترشح مفرط هموگلوبین به مقادیر بالای ۱۳ گرم در دسی‌لیتر با کدام عواقب بالینی همراه است؟ [۱۸۹، ۴۵۳]",options:[{key:"الف",text:"کاهش چشمگیر عوارض قلبی عروقی و بهبود چشمگیر بقای کلیه."}, {key:"ب",text:"افزایش بارز خطر بروز سکته مغزی (Stroke)، حوادث ترومبوآمبولیک عروقی، تشدید هایپرتنشن سیستمیک عضلانی و افزایش خطر مرگ‌ومیر بدون هیچ‌گونه مزیت محافظت‌کننده قلبی عروقی؛ لذا غلظت هدف هموگلوبین باید در محدوده ۱۰ تا ۱۱.۵ گرم در دسی‌لیتر حفظ شود."}, {key:"ج",text:"پاسخ‌دهی ۱۰۰ درصدی به دوزهای پایین آهن وریدی."}, {key:"د",text:"مهار ترشحات فعال هورمون پاراتیروئید از استخوان‌ها."}],correct:"ب"},
{id:"۸۳",text:"بیمار ۵۴ ساله مبتلا به CKD مرحله ۴ با آنمی فقر آهن زودهنگام ارزیابی می‌شود. نفرولوژیست مایل است میزان آهن در دسترس عملکردی سلول‌ها برای اریت‌پوئز فعال (Functional iron availability) را با تست‌های آزمایشگاهی حساس بسنجد. بر اساس پایش‌های خون‌شناسی در Chapter 53 برنر، کدام مارکر آزمایشگاهی به عنوان دقیق‌ترین و حساس‌ترین شاخص بازتاب‌دهنده غلظت آهن فعال گلبول‌ها در گردش خون کورتیکال شناخته می‌شود؟",options:[{key:"الف",text:"میزان فریتین پلاسما (Serum Ferritin) به تنهایی."}, {key:"ب",text:"میزان اشباع ترانسفرین (TSAT) به صورت غیر مستقیم."}, {key:"ج",text:"عیار هموگلوبین رتیکولوسیت (Reticulocyte hemoglobin content - CHr) که نوسانات ترشحی آهن فعال را در عرض چند روز اخیر نشان می‌دهد."}, {key:"د",text:"سنجش آهن کورتکس کلیه با روش رنگ‌آمیزی پاتولوژی مغز استخوان."}],correct:"ج"},
{id:"۸۴",text:"خانم ۵۸ ساله‌ای که به مدت ۵ سال تحت همودیالیز نگهدارنده است، با گلایه از دردهای شدید عضلانی مکرر و بروز ندول‌های سفت و بسیار دردناک پوستی در ناحیه باسن و ران‌ها مراجعه می‌کند که به سرعت به سمت زخم‌های سیاه، عمیق و لایه‌بردار پیشرفت می‌کنند. در لمس اندام‌ها، فیبروزی چوبی‌شکل دوطرفه حس می‌شود. عکس رادیوگرافی ساده بافت‌های نرم، کلسیفیکاسیون خطی عروق ریز پوستی را تایید می‌کند. بیوپسی پوست تاییدکننده عارضه **کلسوفیلاکسی (Calciphylaxis)** است. بر اساس یافته‌های بافتی Chapter 53 برنر، پاتوژنز و درمان خط اول این عارضه مرگ‌بار چیست؟ [۱۹۸، ۶۲۱]",options:[{key:"الف",text:"واسکولیت لکوسیتوکلاستیک عروق ریز؛ درمان انتخابی با پالس استروئید و پلاسمافرز."}, {key:"ب",text:"کلسیفیکاسیون لایه مدیا (Media calcification) و فیبروز لایه اینتیما در شریانچه‌های کوچک پوستی که منجر به ایسکمی شدید و نکروز بافتی می‌شود؛ درمان خط اول شامل قطع کلسیم و ویتامین D، پایش دقیق املاح و شروع تزریق وریدی داروی **سدیم تیوسولفات (Sodium Thiosulfate)** حین دیالیز است."}, {key:"ج",text:"انسداد فیزیکی مجرای توبول‌ها با کریستال‌های فسفات کلسیم؛ دیالیز تهاجمی ۲۴ ساعته."}, {key:"د",text:"تجمع مستقیم ماده آمیلوئید کونگو رد مثبت در دیواره عروق پوستی."}],correct:"ب"},
{id:"۸۵",text:"خانم ۸۲ ساله‌ای با نژاد آسیایی با سابقه ۴۲ سال پرفشاری خون عروقی خفیف تحت درمان با کلورتالیدون ۱۲.۵ میلی‌گرم روزانه، جهت ارزیابی کارکرد کلیه ارجاع می‌شود. بیمار کاملاً هوشیار و مستقل است و سابقه هیچ‌گونه افتادن یا اختلال قلبی عروقی ندارد. آزمایشات وی نشان‌دهنده کراتینین ۱.۳ میلی‌گرم در دسی‌لیتر، eGFR (با فرمول CKD-EPI) برابر با ۴۵ میلی‌لیتر در دقیقه و نسبت آلبومین به کراتینین ادرار (UACR) معادل ۱۲ میلی‌گرم در گرم (کاملاً نرمال) است. بر اساس پایش‌های Chapter 84 برنر، محتمل‌ترین فرجام بالینی درازمدت برای این بیمار در طی ۵ سال آینده چیست؟ [۴۶۸، ۴۶۹]",options:[{key:"الف",text:"پیشرفت سریع و برق‌آسا به سمت نارسایی مرحله انتهایی کلیه (ESKD) نیازمند دیالیز در عرض ۲ سال."}, {key:"ب",text:"پایداری کامل کارکرد کلیه یا نوسانات بسیار ناچیز آن در طی سالیان آتی؛ بیمار با احتمال فوق‌العاده بالاتری به علل غیرکلیوی (مانند پیری طبیعی یا حوادث قلبی عروقی سیستمیک) پیش از رسیدن به مرحله ESKD فوت خواهد کرد و نیازی به اقدامات تهاجمی کلیوی ندارد."}, {key:"ج",text:"بروز ادم ریوی راجعه حاد به دلیل احتباس سدیم."}, {key:"د",text:"افت ناگهانی عیار هموگلوبین سرم به زیر ۵ گرم در دسی‌لیتر."}],correct:"ب"},
