{id:"۸۶",text:"خانم ۷۲ ساله‌ای متعاقب افتادن در منزل و ماندن بر روی زمین به مدت ۲۴ ساعت بدون آب، به اورژانس آورده می‌شود. در بدو ورود، بیمار دچار خواب‌آلودگی شدید و گیجی است. فشار خون بیمار ۱۱۰/۶۰ میلی‌متر جیوه و سدیم سرم بیمار ۱۵۶ میلی‌اکی‌والان در لیتر ثبت می‌شود. GFR بیمار ۴۸ میلی‌لیتر در دقیقه گزارش شده است. وی تحت درمان با هیچ دارویی نیست. کدام فاکتورهای فیزیولوژیک مرتبط با سن (Age-related factors) در سالمندان، این بیمار را مستعد بروز هایپرناترمی حاد عمیق کرده است؟",options:[{key:"الف",text:"کاهش فیزیکی حس تشنگی در هیپوتالاموس، کاهش ظرفیت تغلیظ ادرار کلیوی و کاهش سهم کل آب بدن (Total body water) به علت تجمع توده چربی."}, {key:"ب",text:"افزایش خودمختار ترشح وازوپرسین ادراری در پاسخ به هرگونه تغییر همودینامیک."}, {key:"ج",text:"دفع مفرط نمک از پوست به واسطه تعریق توبولار."}, {key:"د",text:"مهار تالاموس ناشی از استفاده از داروهای مسکن."}],correct:"الف"},
{id:"۸۷",text:"بیمار خانم ۵۴ ساله‌ای با سابقه دیابت تیپ دو کنترل‌نشده، جهت کنترل فشار خون تحت درمان با داروی لیسینوپریل ۴۰ میلی‌گرم روزانه قرار دارد. در پیگیری اخیر کارکرد کلیه وی مختل گزارش شده است (eGFR: 49 mL/min). آزمایشات بیمار نشان‌دهنده پتاسیم سرم ۵.۶ میلی‌اکی‌والان در لیتر، سدیم ۱۳۷، کلر ۱۰۶، بیکربنات پلاسما ۱۹ میلی‌اکی‌والان در لیتر و نسبت پروتئین به کراتینین ادرار (UPCR) معادل ۱ گرم بر گرم است. اسید ادرار بیمار ۵.۴ ثبت می‌شود. پاتوفیزیولوژی این عارضه در بیمار چیست و اقدام درمانی بعدی کدام است؟ [۹۷، ۹۸]",options:[{key:"الف",text:"بروز اسیدوز توبولار نوع ۲ (Proximal RTA)؛ قطع فوری لیسینوپریل و شروع مستقیم پتاسیم بایندرها."}, {key:"ب",text:"بروز اسیدوز توبولار نوع ۴ (Type 4 RTA) ثانویه به پدیده هایپواسترونیسم ناشی از مهار آنزیم مبدل آنژیوتانسین توسط لیسینوپریل؛ بهترین اقدام، ادامه مصرف لیسینوپریل به دلیل اثر محافظتی بر پروتئینوری دیابتی و شروع دیورتیک تیازیدی نظیر کلورتالیدون جهت کنترل همزمان فشار خون وLower کردن پتاسیم سرم است."}, {key:"ج",text:"بروز کتوآسیدوز دیابتی کاذب؛ شروع انسولین وریدی دوز فوق‌العاده بالا."}, {key:"د",text:"انسداد مکانیکی مجرای حالب توسط کلسیم ادراری؛ ارجاع به اورولوژی."}],correct:"ب"},
{id:"۸۸",text:"نفرولوژیست بخش دیالیز مایل است وضعیت شناختی (Cognitive status) بیماران تحت دیالیز نگهدارنده را که از اختلال حاد حافظه گلایه دارند غربالگری کند. بر اساس راهنماهای ارزیابی‌های شناختی در سالمندان مبتلا به بیماری کلیوی در Chapter 13 برنر (جدول ۲)، استفاده از کدام ابزار غربالگری با حساسیت بالاتر و پایش دقیق‌تر حوزه‌های عملکرد اجرایی و توجه (Executive function and attention) همراه است؟",options:[{key:"الف",text:"آزمون سنجش وضعیت ذهنی کوچک (MMSE) بدون نیاز به تغییرات زبانی."}, {key:"ب",text:"آزمون ارزیابی شناختی مونترال (MoCA)؛ که حوزه‌های گسترده‌تری از عملکرد اجرایی را پایش کرده و حساسیت بالاتری در کشف اختلالات شناختی ملایم در بیماران دیالیزی دارد."}, {key:"ج",text:"سنجش میزان ترشحات بزاقی برای آلبومین."}, {key:"د",text:"این آزمون‌ها در بیماران دیالیزی فاقد هرگونه ارزش بالینی هستند."}],correct:"ب"},
{id:"۸۹",text:"در ارزیابی آزمایشگاهی بیماران مبتلا به هیپوکالمی پایدار همراه با آلکالوز متابولیک، افتراق بالینی بین دو اختلال انتقال توبولار کلیوی یعنی **سندرم بارتر (Bartter)** و **سندرم ژیتلمن (Gitelman)** اهمیت درمانی دارد. بر اساس متون Chapter 44 برنر (جدول ۴۴.۸) و کتاب مایعات ردی، کلیدی‌ترین مارکر ادراری افتراق‌دهنده این دو سندرم در ادرار ۲۴ ساعته کدام است؟ [۱۳۷، ۸۰۳]",options:[{key:"الف",text:"کسر دفعی سدیم ($FE\text{-}Na$) تام در ادرار."}, {key:"ب",text:"میزان دفع ادراری کلسیم (Urinary calcium excretion)؛ که در سندرم ژیتلمن به شدت پایین است (Hypocalciuria با کسر دفعی کلسیم کمتر از ۱ درصد)، در حالی که در سندرم بارتر ترشح کلسیم ادراری طبیعی یا بالا است (Hypercalciuria با کسر دفعی بالای ۲ درصد)."}, {key:"ج",text:"میزان ترشحات فسفات توبول پروگزیمال کلیه."}, {key:"د",text:"اسید ادرار که در ژیتلمن به شدت قلیایی است."}],correct:"ب"},
{id:"۹۰",text:"بیمار خانم ۵۴ ساله‌ای با آنمی فقر آهن شدید به دنبال مصرف داروی آهن وریدی **فریک کربوکسی‌مالتوز (Ferric Carboxymaltose)**، ۳ روز پس از تزریق دچار ضعف شدید عضلانی پروگزیمال در پاها و دست‌ها می‌شود. نتایج آزمایشات بیمار نشان‌دهنده فسفات سرم بسیار پایین (۱.۲\text{ mg/dL}) به همراه افزایش دفع ادراری فسفات (TmP/GFR کمتر از ۰.۸) است. پاتوفیزیولوژی بیوشیمیایی القای این هایپوفسفاتمی شدید ادراری ثانویه به تزریق FCM چیست؟ [۱۹۱، ۱۹۲]",options:[{key:"الف",text:"سمیت مستقیم ترکیبات کبالت موجود در ترکیب بر روی ترانسپورترهای راسی فسفات."}, {key:"ب",text:"تداخل مستقیم فریک کربوکسی‌مالتوز در فرآیند تجزیه هورمون استخوانی **$FGF\text{-}23$**، که منجر به افزایش شدید سطوح خونی شکل فعال این هورمون فسفاتوریک و مهار ترانسپورترهای سدیم-فسفات ($NaPi\text{-}IIa$) در توبول پروگزیمال کلیه می‌گردد."}, {key:"ج",text:"مهار انتخابی پمپ کلسیم TRPV5 در مدولای کلیه پیوندی."}, {key:"د",text:"رسوب فیزیکی املاح آهن در مجاری جمع‌کننده قشر کلیه."}],correct:"ب"},
{id:"۹۱",text:"مرد ۲۸ ساله‌ای با سابقه خانوادگی نارسایی کلیه در سنین جوانی (پدر پیوند کلیه در ۴۸ سالگی) جهت ارزیابی به کلینیک مراجعه می‌کند [۶۱، ۶۷]. در سونوگرافی اولیه، چندین کیست به صورت پراکنده در هر دو کلیه دیده شده است. برای ارزیابی دقیق‌تر ریسک پیشرفت سریع بیماری، ام‌آرآی (MRI) انجام شده و حجم کلیوی تعدیل‌شده با قد (htTKV) معادل ۶۴۰\text{ mL/m} محاسبه می‌شود که بیمار را در کلاس تصویربرداری مایو (Mayo Imaging Classification) یعنی 1C قرار می‌دهد [۶۶، ۷۱]. کراتینین بیمار ۰.۹\text{ mg/dL} (eGFR: ۱۰۵\text{ mL/min/1.73 m}^2) و فشار خون وی ۱۳۴/۸۲\text{ mm Hg} است [۷۱، ۷۵]. پاتوفیزیولوژی و رویکرد درمانی اولیه بر اساس گایدلاین ۲۰۲۵ KDIGO برای این بیمار کدام است؟ [۶۷، ۷۵]",options:[{key:"الف",text:"با توجه به سن پایین و قرارگیری در کلاس 1C، شروع فوری داروی تلوپتان (Tolvaptan) جهت مهار ترشح cAMP و سرعت رشد کیست‌ها اندیکاسیون قطعی دارد."}, {key:"ب",text:"با توجه به eGFR طبیعی، درمان دارویی با تلوپتان فعلاً اندیکاسیون ندارد؛ افزایش مصرف آب به میزان حداقل ۳ تا ۴ لیتر در روز ترجیح داده می‌شود."}, {key:"ج",text:"هدف‌گذاری فشار خون در این بیمار باید با مهار دوگانه سیستم رآس (ACEi + ARB) به کمتر از $۱۲۰/۸۰\text{ mm Hg}$ باشد تا پیشرفت کلیوی کاهش یابد."}, {key:"د",text:"با توجه به قرارگیری در کلاس 1C و ریسک پیشرفت سریع، شروع داروی بلاک‌کننده گیرنده وازوپرسین (تلوپتان) پس از بررسی آنزیم‌های کبد آغاز شود و فشار خون بیمار با مهارکننده رآس (ACEi یا ARB) به هدف بسیار دقیق خانگی کمتر از $۱۱۰/۷۵\text{ mm Hg}$ برسد."}],correct:"د"},
{id:"۹۲",text:"خانم ۳۴ ساله مبتلا به ADPKD با تب شدید (۳۹.۲^{\\circ}\text{C})، لرز، درد ناگهانی و شدید پهلوی چپ و تندرنس موضعی عمیق مراجعه می‌کند. در آزمایشات: WBC پلاسما ۱۴.۵ \times ۱۰^۹\text{/L} و CRP سرم ۸۵\text{ mg/L} گزارش می‌شود. کشت ادرار بیمار منفی است. با توجه به سختی افتراق پیلونفریت حاد از کیست عفونی کلیه در ADPKD، تصویربرداری استاندارد طلایی و پاتوفیزیولوژی انتخاب آنتی‌بیوتیک مناسب برای این بیمار بر اساس گایدلاین برنر و ۲۰۲۵ KDIGO چیست؟ [۷۶، ۷۷]",options:[{key:"الف",text:"سونوگرافی شکم بررسی شود؛ تجویز کوتریموکسازول با دوز بالا به مدت ۱۰ تا ۱۴ روز کافی است."}, {key:"ب",text:"ام‌آرآی (MRI) یا سی‌تی اسکن کلیه‌ها با کنتراست تزریقی انجام شود؛ زیرا کیست عفونی دیواره ضخیم با contrast enhancement نشان می‌دهد و تجویز یک آنتی‌بیوتیک با نفوذپذیری بالا به داخل کیست (مانند فلوروکینولون‌ها یا تری‌متوپریم-سولفامتوکسازول) به مدت ۴ تا ۶ هفته الزامی است."}, {key:"ج",text:"در صورت عدم پاسخ به آنتی‌بیوتیک‌های اولیه، انجام اسکن هسته‌ای با گالیوم-۶۷ یا $^{111}\text{In}$-WBC scan و در نهایت $^{18}\text{F}$-FDG PET-CT ترجیح داده می‌شود؛ زیرا فلوروکینولون‌ها به کیست‌های فاقد ترشح فعال نفوذپذیری بسیار پایینی دارند و نیاز به درمان طولانی‌مدت وجود دارد."}, {key:"د",text:"انجام فوری آسپیراسیون سوزنی زیر پوستی کیست چپ کاندید اصلی است؛ زیرا درمان دارویی قبل از تخلیه مکانیکی کیست کاملاً بی‌اثر است."}],correct:"ج"},
{id:"۹۳",text:"خانم ۲۶ ساله‌ای با تشخیص جدید ADPKD به درمانگاه نفرولوژی ارجاع می‌شود. بیمار کاملاً بدون علامت عصبی است اما سابقه سکته مغزی هموراژیک و مرگ ناگهانی عمویش در سن ۴۲ سالگی را ذکر می‌کند. بر اساس راهنماهای برنر و ۲۰۲۵ KDIGO، کدام رویکرد در خصوص غربالگری آنوریسم‌های داخل جمجمه‌ای (Intracranial Aneurysms - ICA) در این بیمار صحیح است؟",options:[{key:"الف",text:"با توجه به عدم وجود سردرد یا علائم فوکال عصبی، غربالگری ICA در این بیمار اندیکاسیون ندارد؛ زیرا ریسک آنوریسم با سن بیمار ارتباط مستقیم دارد."}, {key:"ب",text:"انجام آنژیوگرافی رزونانس مغناطیسی (MRA) بدون کنتراست گادولینیوم برای این بیمار به دلیل داشتن سابقه خانوادگی مثبت ICA در بستگان درجه دو اندیکاسیون دارد و در صورت منفی بودن تست، تکرار آن هر ۵ تا ۱۰ سال توصیه می‌شود."}, {key:"ج",text:"انجام فوری سی‌تی آنژیوگرافی مغز با کنتراست ترجیح داده می‌شود؛ زیرا MRA دقت کافی برای آنوریسم‌های کوچک زیر ۵ میلی‌متر ندارد."}, {key:"د",text:"غربالگری ICA تنها در بیماران کاندید اهدا یا دریافت پیوند کلیه توصیه می‌شود و در بیماران جوان بدون علامت ممنوع است."}],correct:"ب"},
{id:"۹۴",text:"مرد ۶۲ ساله‌ای با سابقه بیماری مزمن کلیه مرحله ۴ (eGFR: ۲۴\text{ mL/min/1.73 m}^2) با حملات حاد نقرس در مفصل متاتارسوفالانژیال اول پا مراجعه می‌کند. او تحت درمان با دوزهای پایین کلشیسین برای حمله حاد قرار گرفته است. پزشک وی تصمیم به شروع درمان کاهش‌دهنده اسید اوریک (ULT) با داروی آلوپورینول پس از فروکش کردن التهاب حاد می‌گیرد. پاتوفیزیولوژی و بهترین اپروچ درمانی برای شروع و پایش آلوپورینول در این بیمار برای به حداقل رساندن سندرم حساسیت مفرط آلوپورینول (AHS) بر اساس مقاله ۱۷ چیست؟",options:[{key:"الف",text:"شروع آلوپورینول با دوز ۳۰۰ میلی‌گرم روزانه به همراه مصرف کلشیسین برای مهار عود حملات."}, {key:"ب",text:"به کارگیری استراتژی \"Start-Low-Go-Slow\"؛ شروع آلوپورینول با دوز ۵۰ تا ۱۰۰ میلی‌گرم روزانه (یا حتی دوز پایین‌تر در CKD پیشرفته) و تیتراسیون تدریجی ماهانه بر اساس سطح اسید اوریک سرم به زیر $۶\text{ mg/dL}$."}, {key:"ج",text:"قطع مصرف کلشیسین به طور کامل و شروع فوری فبوکسوستات با دوز ۸۰ میلی‌گرم روزانه به عنوان درمان ارجح به علت بی‌خطری مطلق آن در CKD مرحله ۴."}, {key:"د",text:"استفاده از آلوپورینول در eGFR کمتر از ۳۰ ممنوع است و بیمار باید تحت درمان با پگلوتیکاز وریدی قرار گیرد."}],correct:"ب"},
{id:"۹۵",text:"خانم ۵۶ ساله‌ای با عفونت شدید مفاصل مصنوعی زانو تحت درمان با دوز بالای آموکسی‌سیلین وریدی (۲\text{ g} هر ۶ ساعت) قرار گرفته است. در روز چهارم درمان، بیمار دچار بی‌پاسخی به ادرار، هماچوری ماکروسکوپی و افزایش ناگهانی کراتینین از ۰.۸ به ۲.۴\text{ mg/dL} می‌گردد. در آزمایش ادرار، کریستال‌های سوزنی‌شکل، باریک و در بسته‌های مجتمع به صورت شعاعی (Broom-like or needle-shaped clusters) رویت می‌شوند. بر اساس مقاله ۱، پاتوفیزیولوژی این آسیب و فاکتورهای خطر مستقل مرتبط با بروز آسیب حاد کلیوی القا شده با آموکسی‌سیلین (AICN) کدام است؟ [۱، ۲]",options:[{key:"الف",text:"واکنش هایپرآلرژیک و نفریت بینابینی حاد (AIN)؛ فاکتور خطر اصلی، مصرف همزمان کلشیسین است."}, {key:"ب",text:"رسوب کریستال‌های آموکسی‌سیلین در توبول‌های کلیوی به دلیل غلظت بالای دارو در ادرار اسیدی و ایجاد انسداد مکانیکی؛ فاکتورهای خطر مستقل شامل غلظت‌های بالای خونی دارو، مصرف همزمان وانکومایسین در خط اول و وجود شوک سپتیک در بدو ورود است."}, {key:"ج",text:"سمیت مستقیم پودوسیتی و القای تغییرات مینیمال ثانویه؛ فاکتور خطر اصلی سن زیر ۳۰ سال است."}, {key:"د",text:"مهار مستقیم بیان کلسیم ادراری توسط تداخل با پمپ TRPV5."}],correct:"ب"},
{id:"۹۶",text:"مرد ۶۸ ساله‌ای با سابقه مالتیپل میلوما زنجیره سبک IgG با کراتینین ۱.۷\text{ mg/dL} جهت پایش دوره‌ای بستری می‌شود. در آزمایشات پایه: سدیم سرم ۱۱۸\text{ mEq/L}، پتاسیم ۴.۲\text{ mEq/L}، پروتئین تام پلاسما ۱۱.۸\text{ g/dL}، اسمولالیته سرم اندازه‌گیری‌شده ۲۸۸\text{ mOsm/kg} و گلوکز خون ۹۰\text{ mg/dL} گزارش می‌گردد. پاتوفیزیولوژی این اختلال آزمایشگاهی در سدیم و گام بعدی تشخیصی برای اثبات آن چیست؟",options:[{key:"الف",text:"بیمار دچار ترشح نامناسب هورمون ضد دیورز (SIADH) ثانویه به میلوما است؛ گام بعدی شروع درمان با محدودیت مایعات است."}, {key:"ب",text:"این یک هایپوناترمی هایپوتونیک حقیقی است؛ گام بعدی تجویز سرم سالین هایپرتونیک ۳٪ است."}, {key:"ج",text:"هایپوناترمی کاذب (Pseudohyponatremia) ناشی از اثر حجمی ایمونوگلوبولین‌های مونوکلونال بالا بر روی روش‌های سنجش شعله‌ای شعاعی غیرمستقیم (Indirect ISE)؛ گام تشخیصی بعدی اندازه‌گیری سدیم خون با استفاده از الکترود انتخابی یونی مستقیم (Direct ISE) یا گاز خون شریانی/وریدی (POC testing) است."}, {key:"د",text:"رسوب مستقیم سدیم در سیلندرهای توبولی به واسطه باند شدن با پروتئین تام هورسفال؛ گام بعدی درمان با بی‌پاسخی آب است."}],correct:"ج"},
{id:"۹۷",text:"خانم ۳۲ ساله‌ای (G2P1) به دنبال زایمان طبیعی با خونریزی بسیار شدید پس از زایمان (PPH) و شوک هموراژیک عمیق که نیازمند دریافت ۱۰ واحد پک‌سل شده است، دچار قطع ناگهانی و کامل ادرار (Anuria) می‌گردد. با وجود احیای کامل همودینامیک، در روز سوم پس از زایمان بیمار کماکان آنوریک بوده و کراتینین وی به ۵.۴\text{ mg/dL} رسیده است. در بیوپسی یا تصویربرداری‌های کلیوی چه یافته پاتولوژیکی محتمل است و تست تشخیصی انتخابی بر اساس مقاله ۲۳ کدام است؟",options:[{key:"الف",text:"نارسایی پیش‌کلیوی ساده؛ تست تشخیصی انتخابی اندازه‌گیری کسر دفعی سدیم (FE Na)."}, {key:"ب",text:"نکروز کورتیکال حاد کلیوی (Acute Cortical Necrosis - ACN) ناشی از ایسکمی شدید و مرگ سلول‌های کورتکس گلومرولی با حفظ مدولا؛ روش تشخیصی انتخابی غیرتهاجمی انجام سی‌تی اسکن کلیه با کنتراست تزریقی (نشان‌دهنده عدم تقویت کورتکس کلیه به همراه لایه نازک تقویت‌شده زیر کپسول) است."}, {key:"ج",text:"نفریت بینابینی حاد ناشی از ترانزاکسیمیک اسید؛ تست تشخیصی انتخابی سونوگرافی داپلر رنگی است."}, {key:"د",text:"سندرم کلیه پلی‌کیستیک اکتسابی زایمان؛ تست تشخیصی بررسی جهش ژن PKD1 است."}],correct:"ب"},
{id:"۹۸",text:"خانم ۴۲ ساله‌ای با هایپوناترمی عمیق عارضه دار (Na: ۱۰۸\text{ mEq/L}) به علت مصرف مفرط آب تصفیه‌شده، به اورژانس آورده می‌شود. پزشک بخش اورژانس اقدام به انفوزیون تهاجمی سالین هایپرتونیک ۳٪ می‌نماید که منجر به افزایش ناگهانی سدیم به ۱۳۰\text{ mEq/L} در عرض ۱۲ ساعت می‌گردد. بیمار روز بعد دچار فلج چهاراندام (Quadriplegia)، بی‌پاسخی به محیط و دیسفازی شدید می‌شود. پاتوفیزیولوژی بیوشیمیایی سلولی بروز سندرم دمیلیناسیون اسمزی (Osmotic Demyelination Syndrome - ODS) در سلول‌های مغز (به ویژه در پونز) چیست؟",options:[{key:"الف",text:"خروج سریع آب از سلول‌های آستروسیت مغز به دنبال افزایش سریع اسمولالیته خارج سلولی، که منجر به استرس مکانیکی، آپوپتوز آستروسیت‌ها، تخریب سد خونی-مغزی و در نهایت مرگ سلول‌های اولیگودندروسیت میلین‌ساز پونز می‌گردد."}, {key:"ب",text:"ورود آب به داخل سلول‌های اولیگودندروسیت مغز و تورم شدید نورونی."}, {key:"ج",text:"تجمع توکسین ایندوکسیل سولفات در پونز به دلیل اختلال پمپ‌های مغزی."}, {key:"د",text:"مهار پمپ‌های کلسیم در غشای میلین نورون‌ها."}],correct:"الف"},
{id:"۹۹",text:"در پاتوفیزیولوژی ایسکمی کلیه ناشی از تنگی شریان کلیوی دوطرفه، چرا کورتکس کلیه در مقایسه با مدولای کلیه در برابر درجات متوسط کاهش جریان خون شریانی مقاومت بسیار بیشتری در برابر هیپوکسی عمیق نشان می‌دهد و مصرف اکسیژن در کورتکس کلیه چگونه تنظیم می‌شود؟",options:[{key:"الف",text:"کورتکس کلیه فاقد فعالیت پمپ سدیم-پتاسیم است."}, {key:"ب",text:"بیش از ۸۰ درصد مصرف اکسیژن کورتیکال کلیه صرف کارکرد فعال بازجذب سدیم (Active Na reabsorption) در توبول پروگزیمال می‌شود؛ با کاهش جریان خون کلیه و افت GFR، لود سدیم فیلترشده سقوط کرده، کارکرد بازجذب سدیم کاهش یافته و مصرف اکسیژن کورتکس به شدت افت می‌کند که از بافت در برابر هیپوکسی محافظت می‌نماید."}, {key:"ج",text:"مدولا دارای جریان خون شریانی مستقیم بسیار قوی است و هرگز دچار ایسکمی نمی‌شود."}, {key:"د",text:"سلول‌های پودوسیتی کورتکس توانایی سنتز اکسیژن به صورت بی‌هوازی را دارا هستند."}],correct:"ب"},
{id:"۱۰۰",text:"مرد ۵۴ ساله‌ای با نارسایی قلبی و ادم مقاوم به درمان، دوز روزانه furosemide خود را دریافت می‌کند. با وجود دیورز مناسب در ۳ ساعت اول پس از مصرف دارو، بیمار در پایان ۲۴ ساعت تراز سدیم خنثی یا حتی مثبت نشان می‌دهد. پاتوفیزیولوژی این پدیده همودینامیک توبولار (که به عنوان Diuretic Braking or Post-diuretic Sodium Retention شناخته می‌شود) چیست و بهترین راهکار غلبه بر آن کدام است؟",options:[{key:"الف",text:"مهار گیرنده‌های وازوپرسین در توبول دیستال؛ راهکار اصلی قطع کامل دیورتیک است."}, {key:"ب",text:"کاهش غلظت خونی دیورتیک به زیر آستانه اثر، همراه با فعال‌سازی شدید سیستم رآس و اعصاب سمپاتیک در پاسخ به تخلیه حجم موقت، که منجر به بازجذب جبرانی و شدید سدیم در توبول‌های دیستال و لوله جمع‌کننده می‌گردد؛ راهکار غلبه بر آن تقسیم دوز روزانه به دو یا سه بار مصرف به شرط عبور از آستانه دیورتیک، یا استفاده از ترکیبات با نیمه‌عمر طولانی‌تر (مانند تورساید) است."}, {key:"ج",text:"سمیت مستقیم فوروزماید بر روی سلول‌های پودوسیتی؛ راهکار اصلی شروع فوری آلکالینیزاسیون است."}, {key:"د",text:"تخریب فیزیکی کانال‌های $NKCC2$ در بخش ضخیم صعودی لوپ هنله."}],correct:"ب"},
{id:"۱۰۱",text:"در بررسی بیمار مبتلا به پلی‌یوری شدید (۵.۲\text{ L/day}) و هایپرناترمی خفیف، پزشک معالج مشکوک به دیابت بی‌مزه (DI) مرکزی یا نفروژنیک است. به جای انجام تست سنتی محرومیت از آب (که خطرات همودینامیک دارد)، سنجش مارکر بیوشیمیایی نوین **کوپپتین (Copeptin)** در سرم پیشنهاد می‌شود. پاتوفیزیولوژی کوپپتین و نحوه افتراق دیابت بی‌مزه مرکزی از نفروژنیک با این مارکر چیست؟",options:[{key:"الف",text:"کوپپتین یک پروتئین پودوسیتی است که با تخریب غشای گلومرول ترشح می‌شود."}, {key:"ب",text:"کوپپتین بخش انتهایی کربوکسیل پیش‌ساز وازوپرسین (pro-AVP) است که به نسبت ۱:۱ با وازوپرسین از هیپوفیز ترشح می‌شود و پایداری بسیار بالاتری در پلاسما دارد؛ در دیابت بی‌مزه مرکزی سطح کوپپتین پایه و تحریک‌شده بسیار پایین است، در حالی که در نوع نفروژنیک به دلیل مقاومت کلیوی، سطح کوپپتین بسیار بالا گزارش می‌شود."}, {key:"ج",text:"کوپپتین یک ترانسپورتر تبادل‌گر در غشای راسی توبول پروگزیمال است که در دیابت بی‌مزه افزایش می‌یابد."}, {key:"د",text:"مهار کوپپتین توسط تلوپتان واسطه اصلی درمان دیابت بی‌مزه است."}],correct:"ب"},
{id:"۱۰۲",text:"خانم ۳۸ ساله‌ای به دلیل استفراغ‌های مکرر ناشی از تنگی خروجی معده با آلکالوز متابولیک شدید (pH: ۷.۵۶، بیکربنات ۴۲\text{ mEq/L}) مراجعه می‌کند. پس از اصلاح کمبود حجم با نرمال سالین، پزشک متوجه می‌شود که آلکالوز بیمار کماکان در فاز نگهداری (Maintenance phase) باقی مانده است. بر اساس بیولوژی سلولی توبولار، کدام ترانسپورتر مبادله‌گر راسی در سلول‌های اینترکالیتد بتای مجرای جمع‌کننده قشری (Cortical Collecting Duct) به دلیل کاهش غلظت کلر مایع توبولار، مسئول اصلی عدم ترشح بیکربنات و تداوم آلکالوز متابولیک است؟ [۶۳۰، ۶۴۳]",options:[{key:"الف",text:"مبادله‌گر سدیم-هیدروژن پروگزیمال ($NHE3$)."}, {key:"ب",text:"مبادله‌گر راسی کلراید-بیکربنات **پندرین (Pendrin)**؛ که فعالیت آن به شدت وابسته به حضور کلر کافی در مجرای توبول جهت تبادل با بیکربنات داخل سلولی است."}, {key:"ج",text:"پمپ کلسیمی TRPV5 کورتیکال."}, {key:"د",text:"کانال‌های سدیم اپیتلیال دیستال ($ENaC$)."}],correct:"ب"},
{id:"۱۰۳",text:"مرد ۶۴ ساله‌ای با سابقه نارسایی قلبی حاد جبران‌نشده (ADHF) به اورژانس آورده می‌شود. او تحت درمان با فوروزماید وریدی دوز بالا قرار می‌گیرد. با وجود تزریق دارو، حجم ادرار وی ناچیز بوده و دچار احتقان شدید ریوی است. بر اساس مطالعه ENACT-HF مندرج در مقاله ۱۴، رویکرد نوین پایش پاسخ دیورتیک بر اساس **سدیم ادراری ادرار رندوم (Spot urine sodium)** در ساعات اولیه پس از تزریق چگونه است و اقدام بعدی چیست؟",options:[{key:"الف",text:"سدیم ادراری در ۲ ساعت اول بعد از تزریق فوروزماید اندازه‌گیری شود؛ اگر میزان سدیم ادرار کمتر از $۵۰\text{ mEq/L}$ باشد، نشان‌دهنده مقاومت شدید دیورتیک است و دوز فوروزماید باید فوراً دو برابر شده یا درمان ترکیبی (مانند متولازون یا استازولامید) اضافه گردد."}, {key:"ب",text:"اندازه‌گیری سدیم ادرار ارزش بالینی ندارد و باید مستقیماً اولترافیلتراسیون مکانیکی شروع شود."}, {key:"ج",text:"در صورت افت سدیم ادرار به زیر ۱۰۰، دوز لیسینوپریل بیمار قطع شود."}, {key:"د",text:"سدیم ادرار باید بالای ۱۵۰ باشد تا پاسخ مناسب ارزیابی شود."}],correct:"الف"},
{id:"۱۰۴",text:"خانم ۸۲ ساله‌ای با سابقه استئوآرتریت، نارسایی قلبی و کراتینین ۱.۴\text{ mg/dL} با تابلوی گیجی و خواب‌آلودگی شدید و سقوط‌های مکرر به کلینیک نفرولوژی ارجاع می‌شود. بررسی دارویی بیمار نشان می‌دهد که وی به طور همزمان داروهای باکلوفن (۱۰\text{ mg} سه بار در روز) و گاباپنتین (۳۰۰\text{ mg} روزانه) مصرف می‌کند. بر اساس معیارهای **AGS Beers Criteria** و STOPP/START مندرج در مقاله ۱۵، اشتباه پاتوفیزیولوژیک دارویی رخ‌داده در این بیمار چیست؟ [۲۱، ۲۲، ۵۱۷]",options:[{key:"الف",text:"دوز گاباپنتین برای سن بیمار بسیار پایین است و باید به ۹۰۰ میلی‌گرم افزایش یابد."}, {key:"ب",text:"گاباپنتین و باکلوفن هر دو عمدتاً از طریق کلیه دفع می‌شوند؛ در بیماران مسن با وجود کراتینین ۱.۴، eGFR واقعی به دلیل کاهش توده عضلانی بسیار کمتر از حد انتظار است ($eGFR < ۳۰$) و تجمع این داروها منجر به سمیت شدید سیستم عصبی مرکزی، دلیریوم و سقوط شده است؛ باکلوفن در این محدوده کلیوی کنتراندیکاسیون مصرف دارد."}, {key:"ج",text:"داروهای فوق فاقد کلیرنس کلیوی هستند و خواب‌آلودگی بیمار ناشی از هایپوناترمی کاذب است."}, {key:"د",text:"مهار سیستم رآس توسط باکلوفن واسطه اصلی سقوط بیمار است."}],correct:"ب"},
{id:"۱۰۵",text:"خانم ۵۲ ساله‌ای با سابقه آرتریت روماتوئید شدید، روزانه دوزهای بالایی از داروی استامینوفن (روزانه ۴ گرم) را به همراه استروئیدها برای تسکین درد مصرف می‌کرده است [۶۷۱، ۶۷۲]. او با اسیدوز متابولیک عمیق با شکاف آنیونی بالا (pH: ۷.۱۸، بیکربنات ۸\text{ mEq/L}، آنیون گپ ۲۴) بدون کتونوری و با قند خون نرمال بستری می‌شود. غربالگری سموم ادرار برای سالیسیلات‌ها و متانول کاملاً منفی است. پاتوفیزیولوژی بیوشیمیایی ایجاد این اسیدوز (که به نام Pyroglutamic Acidosis شناخته می‌شود) در این بیمار چیست؟",options:[{key:"الف",text:"تجمع دی-لاکتات به دلیل تخریب مسیر گاموپاتی مونوکلونال."}, {key:"ب",text:"مهار آنزیم ۵-اوکسوپرولیناز و مهار سنتز گلوتاتیون توسط استامینوفن و تخلیه ذخایر سیستئین سلولی، که منجر به انباشت مفرط متابولیت واسطه‌ای به نام **۵-اوکسوپرولین (اسید پیروگلوتامیک)** در مسیر چرخه گاما-گلوتامیل و بروز اسیدوز می‌گردد."}, {key:"ج",text:"سمیت مستقیم توبولار ناشی از رسوب فیزیکی ذرات کلسیم اگزالات."}, {key:"د",text:"تحریک مستقیم سیستمیک مسیر ترشحی کمپلمان آلترناتیو."}],correct:"ب"},
{id:"۱۰۶",text:"در بخش مراقبت‌های ویژه، مرد ۵۸ ساله‌ای با شوک سپتیک، سندرم زجر تنفسی حاد (ARDS) و آسیب حاد کلیوی شدید آنوریک تحت درمان با درمان مداوم جایگزینی کلیه (CKRT) با دسترسی کاتتر دوراهه در ورید ژوگولار داخلی چپ قرار دارد. دستگاه مرتباً به دلیل کلات شدن فیلتر (Hemofilter clotting) آلارم می‌دهد. بیمار به دلیل خونریزی گوارشی اخیر فاقد آنتی‌کواگولاسیون سیستمیک با هپارین است. بر اساس گایدلاین KDIGO و مقاله ۱۱، پاتوفیزیولوژی و بهترین اپروچ برای افزایش طول عمر فیلتر در این بیمار چیست؟",options:[{key:"الف",text:"ترانزیشن فوری بیمار به همودیالیز متناوب (IHD) سنتی بدون آنتی‌کواگولان."}, {key:"ب",text:"استفاده از **آنتی‌کواگولاسیون موضعی با سیترات (Regional Citrate Anticoagulation - RCA)**؛ سیترات با کلات کردن کلسیم یونیزه در مدار فیلتر مانع از انعقاد خون می‌شود و تزریق کلسیم در انتهای مدار قبل از ورود به بدن بیمار، مانع از هایپوکلسیمی سیستمیک می‌گردد."}, {key:"ج",text:"افزایش سرعت پمپ خون ($Q_b$) به بالای ۴۰۰ میلی‌لیتر در دقیقه برای مهار فیزیکی کلات شدن."}, {key:"د",text:"تجویز دوزهای بالای هپارین وریدی به همراه پلاسمافرز اورژانسی."}],correct:"ب"},
{id:"۱۰۷",text:"مرد ۶۸ ساله‌ای با سابقه دیابت، هایپرتنشن و بیماری مزمن کلیه مرحله ۳b (eGFR: ۳۴\text{ mL/min/1.73 m}^2) کاندید انجام آنژیوگرافی عروق کرونر به دلیل آنژین صدری ناپایدار است. پزشک معالج وی جهت ارزیابی و مشاوره برای کاهش ریسک آسیب حاد کلیوی ناشی از ماده حاجب (CA-AKI) با نفرولوژیست تماس می‌گیرد. بر اساس راهنماهای مدرن و خلاصه ایمنی بیمار در مقاله ۱۵، ایمن‌ترین و موثرترین استراتژی درمانی پیشگیرانه برای این بیمار کدام است؟",options:[{key:"الف",text:"انجام همودیالیز پیشگیرانه اورژانسی بلافاصله پس از مواجهه با ماده حاجب."}, {key:"ب",text:"قطع موقت متفورمین (به دلیل خطر لاکتیک اسیدوز در صورت بروز AKI) و مهارکننده‌های رآس (ACEi/ARB) از ۲۴ ساعت قبل از پروسیجر، به همراه انفوزیون وریدی محلول‌های ایزوتونیک نمکی (نرمال سالین) قبل و بعد از تزریق ماده حاجب."}, {key:"ج",text:"تجویز دوزهای بالای ان-استیل‌سیستئین (NAC) به همراه بی‌کربنات سدیم هایپرتونیک به عنوان خط اول."}, {key:"د",text:"هیدراتاسیون تهاجمی خوراکی با آب مقطر بدون نیاز به بررسی دوزهای دارویی."}],correct:"ب"},
{id:"۱۰۸",text:"خانم ۴۲ ساله‌ای با سابقه جراحی بای‌پس روده برای درمان چاقی مفرط، با حملات مکرر کولیک کلیوی و دفع سنگ‌های متعدد کلسیم اگزالات مراجعه می‌کند. آزمایش ادرار ۲۴ ساعته بیمار هایپراگزالوری شدید (۱۲۰\text{ mg/day}) به همراه هایپوسیتراتوری شدید را نشان می‌دهد. پاتوفیزیولوژی ایجاد هایپراگزالوری پس از جراحی‌های روده (که به نام Enteric Hyperoxaluria شناخته می‌شود) چیست و بهترین رویکرد درمانی کدام است؟",options:[{key:"الف",text:"مهار مستقیم ترانسپورترهای راسی فسفات در پروگزیمال؛ شروع درمان با کلسیم وریدی دوز بالا."}, {key:"ب",text:"چربی‌های جذب‌نشده در روده با کلسیم لومن پیوند خورده و صابونی می‌شوند؛ در نتیجه اگزالات آزاد روده دیگر با کلسیم پیوند نخورده و جذب آن به شدت افزایش می‌یابد؛ درمان شامل رژیم غذایی کم‌چرب و کم‌اگزالات، مصرف کلسیم کربنات همراه با وعده‌های غذایی (جهت باند شدن با اگزالات روده) و مکمل پتاسیم سیترات است."}, {key:"ج",text:"ترشح مفرط وازوپرسین در پاسخ به medullary washout."}, {key:"د",text:"مهار پمپ‌های NCC در توبول دیستال به واسطه ترشحات چربی."}],correct:"ب"},
{id:"۱۰۹",text:"خانم ۵۸ ساله‌ای که به مدت ۵ سال تحت همودیالیز نگهدارنده است، با ضایعات پوستی به شدت دردناک، بنفش‌رنگ و نکروتیک در ناحیه ران پا مراجعه می‌کند. در بیوپسی پوست، تکلیس دیواره شریانچه‌های کوچک درم پوست به همراه هیپرپلازی لایه انتیمال و ترومبوز عروق ریز تایید می‌شود که با تشخیص کلسوفیلاکسی (Calciphylaxis) منطبق است. بهترین رویکرد درمانی پاتوفیزیولوژیک برای این بیمار چیست؟",options:[{key:"الف",text:"تجویز دوزهای بالای کلسیم خوراکی برای مهار فسفات سرم."}, {key:"ب",text:"شروع انفوزیون وریدی **سدیم تیوسولفات (Sodium Thiosulfate)** در انتهای هر جلسه دیالیز (که با حل کردن رسوبات کلسیم در عروق و اثرات قوی وازودیلاتاتوری و ضدالتهابی همراه است) به همراه مهار شدید کلسیم و فسفر و تعلیق ترکیبات کلسیمی."}, {key:"ج",text:"شروع فوری درمان با وارفارین جهت مهار ترومبوز عروق ریز پوست."}, {key:"د",text:"جراحی فوری و قطع عضو به دلیل عدم وجود درمان دارویی موثر."}],correct:"ب"},
{id:"۱۱۰",text:"در پاتوفیزیولوژی تغییرات طبیعی همودینامیک کلیوی در طی بارداری سالم، کدام تغییر در جریان پلاسما کلیه (RPF) و تصفیه گلومرولی (GFR) رخ می‌دهد و غلظت فیزیولوژیک کراتینین سرم در بارداری چگونه تغییر می‌یابد؟",options:[{key:"الف",text:"GFR و RPF تغییر نمی‌کنند؛ کراتینین سرم مشابه دوران غیربارداری است."}, {key:"ب",text:"GFR و RPF به دلیل وازودیلاتاسیون شدید عروق کلیوی (ناشی از ترشح ریلکسین و پروستاسیکلین) تا ۵۰ درصد افزایش می‌یابند؛ در نتیجه کراتینین سرم به طور فیزیولوژیک کاهش یافته و غلظت بالای $۰.۸\text{ mg/dL}$ در بارداری غیرطبیعی ارزیابی می‌شود."}, {key:"ج",text:"RPF کاهش یافته و GFR افزایش می‌یابد؛ کراتینین سرم افزایش خفیفی نشان می‌دهد."}, {key:"د",text:"GFR کاهش یافته و RPF افزایش می‌یابد؛ کراتینین سرم مهار می‌شود."}],correct:"ب"},
{id:"۱۱۱",text:"خانم ۲۸ ساله‌ای (G1P0) در هفته ۳۶ بارداری با شکایت از سردرد و ادم شدید اندام‌ها مراجعه می‌کند. در معاینه: فشار خون ۱۸۸/۹۹\text{ mm Hg} و در آزمایش ادرار پروتئینوری ۴ مثبت (PCR: ۴\\ \text{g/g}) رویت می‌شود. کراتینین بیمار ۱.۵\text{ mg/dL} (پایه ۰.۶) ثبت شده است. بر اساس گایدلاین‌های مندرج در کتاب برنر، گام بعدی در مدیریت درمانی اورژانسی کنترل فشار خون در این بیمار چیست؟ [۱۴۵، ۱۴۶]",options:[{key:"الف",text:"شروع فوری لوزارتان با دوز حداکثر به دلیل اثرات عالی محافظت کلیوی."}, {key:"ب",text:"شروع داروی متیل‌دوپا خوراکی با دوز بالا و ترخیص بیمار برای پایش هفته بعد."}, {key:"ج",text:"بستری فوری در بیمارستان و شروع داروهای خط اول تزریقی شامل **لابتالول وریدی یا هیدرازین وریدی یا نیفدیپین خوراکی سریع‌الاثر** جهت کاهش ایمن فشار خون."}, {key:"د",text:"شروع فوری تزریق منیزیم سولفات وریدی بدون نیاز به داروهای ضد فشار خون."}],correct:"ج"},
{id:"۱۱۲",text:"مرد ۲۸ ساله‌ای با بیوپسی تاییدکننده نفروپاتی IgA و پروتئینوری پایدار ۲.۴\text{ g/day} علیرغم دریافت حداکثر دوز لیسینوپریل کماکان پروتئینوری بالایی دارد. با توجه به مکانیسم‌های نوین پاتوژنز IgAN (فرضیه ۴ ضربه‌ای)، استفاده از داروهای مونوکلونال هدفمند علیه سایتوکاین‌های **APRIL و BAFF** (مانند Atacicept یا Sibeprenlimab) با چه پاتوفیزیولوژی بالینی منجر به بهبود پروتئینوری در این بیماران می‌گردد؟ [۸۲، ۸۸]",options:[{key:"الف",text:"مهار مستقیم پمپ‌های سدیم در توبول دیستال."}, {key:"ب",text:"کاهش مستقیم غلظت سرمی IgA1 فاقد گالاکتوز (Gd-IgA1) و اتوآنتی‌بادی‌های ضد آن در خون، که مانع از تشکیل کمپلکس‌های ایمنی پاتوژنیک و رسوب آن‌ها در مسانژیوم گلومرول می‌شود."}, {key:"ج",text:"مهار فیبروز توبولار به واسطه فعال‌سازی پمپ‌های کلسیم کورتیکال."}, {key:"د",text:"مهار انتخابی پمپ‌های مسیر ترشحی آلترناتیو کمپلمان در مدولا."}],correct:"ب"},
{id:"۱۱۳",text:"در ادامه ارزیابی پاتوژنز مسیرهای التهابی در نفروپاتی IgA، فعال‌سازی مسیر لکتین و مسیر آلترناتیو کمپلمان نقش مهمی در آسیب گلومرولی دارد. استفاده از داروی نوین **ایپتاکوپان (Iptacopan)** با کدام مکانیسم مستقیم بیوشیمیایی منجر به مهار آسیب‌های گلومرولی در این بیماران می‌گردد؟",options:[{key:"الف",text:"مهار مستقیم فاکتور D کمپلمان عروقی."}, {key:"ب",text:"مهار اختصاصی و کوچک مولکولی **فاکتور B کمپلمان**، که منجر به سرکوب لوپ تقویت‌کننده مسیر آلترناتیو کمپلمان در سطح گلومرول‌ها می‌شود."}, {key:"ج",text:"مهار مستقیم پروتئین C1q در مسیر کلاسیک کمپلمان."}, {key:"د",text:"مهار انتخابی بیان پمپ‌های NCC در مدولای کلیه."}],correct:"ب"},
{id:"۱۱۴",text:"بر اساس نتایج کارآزمایی‌های بالینی بزرگ مندرج در کتاب برنر و هندبوک دیالیز (مانند مطالعات 4D و AURORA)، شروع یا تداوم مصرف داروهای کاهنده چربی (Statins) پس از شروع همودیالیز نگهدارنده در بیماران مبتلا به نارسایی کلیه انتهایی، چه تاثیری بر روی حوادث ماژور قلبی عروقی (MACE) و بقای بیماران نشان داده است؟ [۱۸۳، ۱۸۶]",options:[{key:"الف",text:"مصرف استاتین‌ها در بیماران همودیالیزی منجر به کاهش بارز و ۵۰ درصدی مرگ و میر قلبی عروقی شده است."}, {key:"ب",text:"مصرف استاتین‌ها (مانند آتورواستاتین یا روزوواستاتین) پس از شروع دیالیز، علیرغم کاهش کلسترول LDL، هیچ‌گونه بهبود معنی‌داری در میزان مرگ و میر قلبی عروقی یا بقای تام این بیماران نشان نداده است و شروع روتین آن توصیه نمی‌شود."}, {key:"ج",text:"مصرف استاتین‌ها به دلیل خطر القای رابدومیولیز شدید در دیالیز مطلقاً ممنوع است."}, {key:"د",text:"استاتین‌ها با مهار پمپ‌های کلسیمی توبولار منجر به بهبود adynamic bone disease می‌شوند."}],correct:"ب"},
{id:"۱۱۵",text:"در درمان کم‌خونی بیماران CKD با داروهای تحریک‌کننده اریتروپوئزیس (ESA)، هدف‌گذاری و افزایش هموگلوبین به محدوده طبیعی بالای ۱۳ گرم در دسی‌لیتر بر اساس کارآزمایی‌های بزرگ بالینی (نظیر TREAT و CREATE) با چه عوارض پاتوفیزیولوژیک و بالینی خطرسازی همراه بوده است؟ [۱۸۹، ۴۵۳]",options:[{key:"الف",text:"القای نارسایی قلبی هایپرتروفیک و هایپرکالمی شدید."}, {key:"ب",text:"افزایش معنی‌دار در ریسک بروز حوادث عروقی مغز (سکته مغزی)، ترومبوز عروق دسترسی دیالیز، بدخیمی‌ها و پرفشاری خون عروقی بدون بهبود کیفیت زندگی."}, {key:"ج",text:"مهار کامل بازجذب فسفات در توبول دیستال."}, {key:"د",text:"القای سندرم کلسوفیلاکسی عروق پوستی به دلیل رسوب آهن."}],correct:"ب"},
{id:"۱۱۶",text:"در پایش وضعیت آهن بیماران تحت همودیالیز، با توجه به اینکه فاکتورهای التهابی منجر به افزایش کاذب فریتین سرم می‌شوند، کدام مارکر آزمایشگاهی هماتولوژیک اریتروسیتی دقیق‌ترین شاخص برای ارزیابی اریتروپوئزیس فقر آهن عملکردی (Functional Iron Deficiency) پایش می‌شود؟",options:[{key:"الف",text:"میانگین حجم سلولی اریتروسیت (MCV)."}, {key:"ب",text:"درصد اریتروسیت‌های هایپوکرومیک یا **محتوای هموگلوبین رتیکولوسیت (CHr)**؛ که به طور مستقیم آهن در دسترس برای اریتروپوئزیس را در چند روز گذشته نشان می‌دهد و تحت تاثیر فاز حاد التهاب قرار نمی‌گیرد."}, {key:"ج",text:"ترانسفرین تام پلاسما به روش رنگ‌آمیزی شیمیایی."}, {key:"د",text:"کسر دفعی آهن در ادرار ۲۴ ساعته."}],correct:"ب"},
{id:"۱۱۷",text:"خانم ۲۴ ساله‌ای در هفته ۱۲ بارداری به دلیل آکنه تحت درمان با قرص‌های ضدبارداری حاوی **دروسپیرنون (Drospirenone)** قرار گرفته است. بیمار با کراتینین ۱.۲\text{ mg/dL} پلاسما، در پایش آزمایشگاهی دچار هایپرکالمی شدید (K: ۵.۸\text{ mEq/L}) می‌گردد. پاتوفیزیولوژی دروسپیرنون در القای هایپرکالمی چیست؟",options:[{key:"الف",text:"دروسپیرنون یک آنالوگ پروژسترونی با اثرات قوی آنتاگونیست گیرنده مینرالوکورتیکوئید (مشابه اسپیرونولاکتون) است که مانع از اثر آلدوسترون بر مجرای جمع‌کننده شده و ترشح پتاسیم را مهار می‌سازد."}, {key:"ب",text:"دروسپیرنون با مهار فیزیکی مستقیم پمپ $NKCC2$ لوپ هنله مانع از ترشح پتاسیم می‌شود."}, {key:"ج",text:"القای مستقیم لیز عضلانی و رابدومیولیز عروقی."}, {key:"د",text:"مهار ترشح وازوپرسین در هیپوفیز."}],correct:"الف"},
{id:"۱۱۸",text:"در پاتوفیزیولوژی زودهنگام هایپرپاراتیروئیدی ثانویه در سیر بیماری مزمن کلیه (CKD)، کاهش زودرس بیان کدام پروتئین همکار در غشای توبولی کلیه منجر به مقاومت کلیوی به هورمون FGF-23 و افزایش متعاقب و واکنشی FGF-23 و PTH در خون می‌گردد؟ [۲۲۲، ۶۶۰]",options:[{key:"الف",text:"پروتئین پودوسین روی پودوسیت‌ها."}, {key:"ب",text:"پروتئین همکار غشایی **کلوتو (Klotho)**؛ که بیان آن در کورتکس کلیه با افت کارکرد کلیه به سرعت کاهش یافته و منجر به مقاومت به اثرات فسفاتوریک FGF-23 و القای هایپرپاراتیروئیدی ثانویه می‌شود."}, {key:"ج",text:"ترانسپورتر سدیم-فسفات کورتیکال."}, {key:"د",text:"پمپ کلسیم TRPV5 مدولاری."}],correct:"ب"},
{id:"۱۱۹",text:"در تشخیص تفکیکی نمونه بیوپسی کلیه یک بیمار ۲۴ ساله با سندرم نفروتیک و کاهش شدید سطح C3 پلاسما، پاتولوژیست نمای غشای پایه گلومرولی ضخیم لایه‌لایه با تکثیر سلولی را توصیف می‌کند. در رنگ‌آمیزی ایمونوفلورسانس (IF)، رسوب انحصاری پروتئین C3 با شدت بالا رویت می‌شود اما هیچ رسوبی از ایمونوگلوبولین‌های IgG, IgA یا IgM وجود ندارد. بر اساس پاتوفیزیولوژی برنر، این یافته نشان‌دهنده کدام عارضه است؟",options:[{key:"الف",text:"گلومرولونفریت تکثیری غشایی مرتبط با هپاتیت C."}, {key:"ب",text:"نفروپاتی غشایی لوپوسی کلاس ۵ فعال."}, {key:"ج",text:"**گلومرولونفریت C3 (C3G)** ناشی از فعال‌سازی بیش از حد و مهارنشده مسیر آلترناتیو کمپلمان در پلاسما و بافت کلیه."}, {key:"د",text:"آمیلوئیدوز اولیه ایمونوگلوبولین سبک."}],correct:"ج"},
{id:"۱۲۰",text:"در ارزیابی نمونه‌برداری کلیه یک بیمار ۶۴ ساله مبتلا به مالتیپل میلوما و آسیب حاد کلیه الیگوریک، پاتولوژیست در کورتکس کلیه سیلندرهای شکسته‌شده، زاویه‌دار و سخت (Fractured, rigid intratubular casts) را در داخل مجرای توبول‌های جمع‌کننده توصیف می‌کند که با واکنش سلول‌های غول‌پیکر بیگانه (Giant cells) دور توبولی همراه است. این یافته پاتولوژیک پاتوگنومونیک کدام عارضه میلومایی است؟",options:[{key:"الف",text:"نفروپاتی غشایی ناشی از زنجیره‌های سبک."}, {key:"ب",text:"آمیلوئیدوز عروقی کلیه کورتیکال."}, {key:"ج",text:"**نفروپاتی سیلندری زنجیره سبک (Light Chain Cast Nephropathy - LCCN)**."}, {key:"د",text:"نفریت بینابینی حاد القا شده با داروهای شیمی‌درمانی."}],correct:"ج"},
{id:"۱۲۱",text:"پاتولوژیست در بررسی نمونه میکروسکوپ الکترونی (EM) بیوپسی کلیه کورتیکال یک بیمار ۱۸ ساله با هماچوری فامیلی پایدار و کارکرد کلیوی کاملاً طبیعی، ضخامت غشای پایه گلومرولی را به طور یکنواخت زیر ۲۵۰\text{ nm} گزارش می‌کند. هیچ اثر لایه‌لایه شدگی یا تورق پاتولوژیک در غشا رویت نمی‌شود. این یافته پاتوگنومونیک کدام عارضه کلاژنی است؟ [۸۶۳، ۱۰۳۸]",options:[{key:"الف",text:"سندرم آلپورت وابسته به جنس فعال."}, {key:"ب",text:"**بیماری غشای پایه نازک (Thin Basement Membrane Nephropathy - TBMN)**."}, {key:"ج",text:"نفروپاتی غشایی اولیه لوپوسی."}, {key:"د",text:"گلومرولوسکلروز قطعی فامیلی."}],correct:"ب"},
{id:"۱۲۲",text:"مرد ۲۴ ساله‌ای مبتلا به سندرم آلپورت وابسته به جنس (جهش در زنجیره آلفا-۵ کلاژن تیپ IV) که چند سال دیالیز می‌شده است، پیوند کلیه دریافت می‌کند. در ماه سوم پس از پیوند، کارکرد کلیه وی به سرعت مختل شده و دچار هماچوری و پروتئینوری شدید می‌گردد. بیوپسی کلیه پیوندی واکنش گلومرولونفریت شدید هلال‌آسا به همراه رسوب خطی IgG در امتداد مویرگ‌ها را نشان می‌دهد. پاتوفیزیولوژی این عارضه در پیوند چیست؟",options:[{key:"الف",text:"عود مستقیم و پاتوژنیک جهش آلپورت قدیمی در کلیه پیوندی جدید."}, {key:"ب",text:"سمیت مستقیم داروی تاکرولیموس بر روی پودوسیت‌های آلوگرافت پیوندی."}, {key:"ج",text:"واکنش آلوآنتی‌بادی‌های گیرنده (که فاقد غشای کلاژن طبیعی آلفا-۵ بوده و بدن او این غشا را بیگانه ارزیابی می‌کند) علیه اپیتوپ‌های NC1 غشای پایه کلیه پیوندی جدید."}, {key:"د",text:"انتقال عفونت فعال ویروس پولیوما BK از اهداکننده کلیه."}],correct:"ج"},
{id:"۱۲۳",text:"در ارزیابی نمونه‌برداری کلیه یک خانم ۵۲ ساله با سندرم نفروتیک شدید، پاتولوژیست رسوب فیبرهای نامنظم، بدون شاخه با قطر ۱۶\text{ nm} را در فضای مزانژیال گزارش می‌کند که در رنگ‌آمیزی کونگو رد منفی گزارش شده است. در بررسی ایمونوهیستوشیمی (IHC)، این رسوبات برای کدام پروتئین اختصاصی پاتوگنومونیک به شدت مثبت هستند؟",options:[{key:"الف",text:"پروتئین وازوپرسین مغزی."}, {key:"ب",text:"پروتئین ویژه **DNAJB9**؛ که مارکر فوق‌العاده حساس و اختصاصی برای گلومرولونفریت فیبریلاری (Fibrillary GN) است."}, {key:"ج",text:"پروتئین کلاژن تیپ ۵ کورتیکال."}, {key:"د",text:"فاکتور H کمپلمان."}],correct:"ب"},
{id:"۱۲۴",text:"خانم ۳۰ ساله مبتلا به سندرم نفروتیک شدید ثانویه به نفروپاتی غشایی با آلبومین سرم ۱.۵\text{ g/dL}، به علت درد ناگهانی پهلوی چپ و هماچوری واضح مراجعه می‌کند [۸۳۴، ۹۶۴]. در بررسی‌های داپلر، ترومبوز ورید کلیوی چپ (RVT) تایید می‌شود [۸۳۴، ۹۶۴]. کدام پدیده بیوشیمیایی کبد و گردش خون، مسئول اصلی این وضعیت هایپرکواگولابلیته در سندرم نفروتیک است؟",options:[{key:"الف",text:"اتلاف ادراری شدید آنتی‌ترومبین III به همراه افزایش سنتز کبدی فاکتورهای انعقادی نظیر فایبرینوژن و فاکتورهای V و VIII."}, {key:"ب",text:"مهار مستقیم ترشح پروستاسیکلین از سلول‌های اندوتلیال گلومرول."}, {key:"ج",text:"کاهش فیزیکی تعداد پلاکت‌ها به همراه فعال‌سازی لوپ‌های دیستال."}, {key:"د",text:"از دست رفتن مفرط پروتئین C فعال از ادرار بدون هیچ تغییر همودینامیک."}],correct:"الف"},
{id:"۱۲۵",text:"یک پاتولوژیست در گزارش بیوپسی کلیه کورتیکال یک بیمار مبتلا به پروتئینوری، مایل است تفاوت ساختاری ضایعات موضعی (Focal) را از ضایعات منتشر (Diffuse) مشخص سازد [۴۲۸، ۴۳۱]. بر اساس راهنماهای برنر، آستانه درصدی گلومرول‌های درگیر برای تعریف ضایعه منتشر کدام است؟",options:[{key:"الف",text:"درگیری کمتر از ۲۵ درصد کل گلومرول‌ها."}, {key:"ب",text:"درگیری معادل و بیش از ۵۰ درصد از کل گلومرول‌های موجود در نمونه کورتیکال بیوپسی."}, {key:"ج",text:"درگیری کل گلومرول‌ها بدون استثنا."}, {key:"د",text:"این اصطلاحات انحصاماً بر اساس اندازه کلیه‌ها تعریف می‌شوند."}],correct:"ب"},
{id:"۱۲۶",text:"بیمار پیوند کلیوی ۴ هفته پس از پیوند، به دلیل پرفشاری خون عروقی تحت درمان با داروی دیلتیازم (۶۰\text{ mg} سه بار در روز) قرار می‌گیرد. بیمار همزمان داروی تاکرولیموس را به عنوان سرکوب‌کننده ایمنی نگهدارنده مصرف می‌نماید. پزشک وی در پایش روتین متوجه افزایش برق‌آسای سطح خونی تاکرولیموس به بالای ۲۵\text{ ng/mL} و افت کارکرد کلیه می‌شود. پاتوفیزیولوژی این تداخل دارویی شدید چیست؟",options:[{key:"الف",text:"مهار مستقیم پمپ‌های کلسیم در غشای توبول پروگزیمال توسط دیلتیازم."}, {key:"ب",text:"دیلتیازم با مهار پرقدرت آنزیم سیتوکروم P450 نوع **$CYP3A4$** و گلیکوپروتئین-P در کبد و دیواره روده، منجر به مهار متابولیسم تاکرولیموس و افزایش شدید سطح خونی و سمیت کلیوی آن شده است."}, {key:"ج",text:"رقابت فیزیکی دیلتیازم با تاکرولیموس بر روی پمپ‌های دفع ادراری مجاری جمع‌کننده."}, {key:"د",text:"افزایش ترشح وازوپرسین در پاسخ به اثرات دیلتیازم."}],correct:"ب"},
{id:"۱۲۷",text:"در ارزیابی نمونه بیوپسی کلیه پیوندی یک بیمار با افت ناگهانی کارکرد کلیه و حضور DSA در خون، پاتولوژیست مایل است تشخیص پس‌زدن فعال هومورال (Active AMR) را تایید کند. بر اساس معیارهای بنف (Banff)، حضور کدام یافته پاتولوژیک بافتی به عنوان معیاری قوی برای آسیب حاد لایه اندوتلیوم مویرگی در نظر گرفته می‌شود؟",options:[{key:"الف",text:"ارتشاح لنفوسیتی شدید در لایه مدولای کلیه پیوندی بدون درگیری گلومرولی."}, {key:"ب",text:"رسوب انحصاری فیبرین در غشای پایه کورتیکال."}, {key:"ج",text:"حضور التهاب لایه میکروواسکولار شامل گلومرولیت ($g > 0$) و کاپیلاریت دور توبولی ($ptc > 0$) همراه با رنگ‌آمیزی مثبت **C4d** در امتداد مویرگ‌های دور توبولی."}, {key:"د",text:"فیبروز شدید و آتروفی توبولار ($IF/TA$) بدون التهاب فعال عروقی."}],correct:"ج"},
{id:"۱۲۸",text:"بیمار دیالیز صفاقی با درد شکم، تب خفیف و مایع خروجی صفاق کدر (Turbid effluent) مراجعه می‌کند. در آزمایش روی مایع صفاق، شمارش سلول WBC: ۴۵۰\text{/mm}^3 با غلظت بالای ۷۵٪ نوتروفیل گزارش می‌شود که تاییدکننده پریتونیت حاد صفاقی است. قبل از آماده شدن نتایج کشت مایع صفاق، درمان تجربی استاندارد طلایی ادراری صفاقی بر اساس هندبوک دیالیز کدام است؟",options:[{key:"الف",text:"تجویز آنتی‌بیوتیک‌های وریدی پرقدرت (سفتراکسون به همراه مترونیدازول وریدی) به مدت ۱۰ روز."}, {key:"ب",text:"افزودن آنتی‌بیوتیک‌های داخل صفاقی (Intraperitoneal) شامل یک سسفالوسپورین نسل اول (مانند **سفازولین** برای پوشش گرم مثبت‌ها) به همراه یک داروی فعال بر روی گرم منفی‌ها (مانند **سفتاسیدیم یا امینوگلیکوزیدها**) در محلول‌های دیالیز صفاقی."}, {key:"ج",text:"تخلیه فوری کاتتر صفاقی و انتقال بیمار به همودیالیز اورژانسی."}, {key:"د",text:"شستشوی صفاق با نرمال سالین سرد به مدت ۲۴ ساعت بدون شروع آنتی‌بیوتیک."}],correct:"ب"},
{id:"۱۲۹",text:"در پایش بیماران تحت دیالیز صفاقی، بیماری که در تست کفایت صفاق (PET) به عنوان **ترانسپورتر سریع یا بالا (High Transporter)** طبقه‌بندی می‌شود، به چه علتی دچار افت شدید ظرفیت اولترافیلتراسیون در طی dwellهای طولانی‌مدت (مانند مبادله شبانه در CAPD) می‌گردد؟ [۳۵۷، ۴۲۲]",options:[{key:"الف",text:"تخریب فیزیکی غشای صفاق به دلیل رسوب ذرات گلوکز."}, {key:"ب",text:"جذب سریع و مفرط گلوکز از محلول دیالیز به داخل خون به دلیل نفوذپذیری بالای غشا؛ این پدیده منجر به از دست رفتن سریع گرادیان اسمزی گلوکز شده و مایع صفاق پس از چند ساعت مجدداً بازجذب بدن می‌گردد."}, {key:"ج",text:"کاهش فیزیکی بیان کانال‌های آکواپورین-۱ در اندوتلیوم صفاق."}, {key:"د",text:"انقباض شدید شریان‌های صفاقی در پاسخ به غلظت بالای گلوکز."}],correct:"ب"},
{id:"۱۳۰",text:"مرد ۶۲ ساله‌ای با اورمی بسیار شدید (اورس سرم ۲۸۰\text{ mg/dL}) کاندید اولین جلسه همودیالیز خود می‌شود. پزشک وی برای مهار پدیده سندرم عدم تعادل دیالیز (Dialysis Disequilibrium Syndrome - DDS) اقدامات پیشگیرانه را لحاظ می‌کند. پاتوفیزیولوژی بیوشیمیایی بروز DDS چیست؟ [۶۹۳، ۶۹۴]",options:[{key:"الف",text:"کاهش سریع کلسیم یونیزه در خون در پاسخ به دیالیز تهاجمی."}, {key:"ب",text:"خروج سریع اوره از خون در طی دیالیز، در حالی که اوره در بافت مغز به دلیل سد خونی-مغزی با سرعت بسیار کمتری کاهش می‌یابد؛ این پدیده منجر به ایجاد گرادیان اسمزی معکوس، ورود آب به داخل سلول‌های مغز و بروز ادم مغزی حاد می‌گردد."}, {key:"ج",text:"انقباض شدید عروق مغزی ناشی از افت ناگهانی فشار اسمزی سیستمیک."}, {key:"د",text:"سمیت مستقیم لوله‌های پلاستیکی دیالیز بر روی سلول‌های آستروسیت."}],correct:"ب"},
{id:"۱۳۱",text:"بیمار همودیالیزی مبتلا به سوءتغذیه شدید پروتئین-انرژی (PEW) تحت درمان با تغذیه وریدی حین دیالیز (Intradialytic Parenteral Nutrition - IDPN) قرار می‌گیرد. در انتهای جلسه دیالیز، انفوزیون محلول‌های قندی بالا به همراه اسیدهای آمینه به طور ناگهانی قطع می‌شود. بیمار ۳۰ دقیقه پس از ترخیص دچار تعریق شدید، تپش قلب و گیجی می‌شود که هایپوگلیسمی شدید وی تایید می‌گردد. پاتوفیزیولوژی این هایپوگلیسمی واکنشی چیست؟",options:[{key:"الف",text:"مهار فیزیکی ترشح گلوکاگون توسط اسیدهای آمینه تزریقی."}, {key:"ب",text:"هایپرانسولینمی شدید و موقت ایجادشده در پاسخ به غلظت بالای گلوکز تزریقی در طی جلسه دیالیز؛ با قطع ناگهانی محلول، سطح بالای انسولین در خون کماکان باقی مانده و منجر به هایپوگلیسمی برق‌آسا می‌گردد."}, {key:"ج",text:"کاهش فیزیکی ترشح کورتیزول سیستمیک."}, {key:"د",text:"مهار پمپ‌های توبولار پروگزیمال کلیه توسط ترکیبات IDPN."}],correct:"ب"},
{id:"۱۳۲",text:"در پاتوفیزیولوژی غدد و توبولار کلیه، بیماران مبتلا به سندرم پندرین (Pendred Syndrome) که دچار ناشنوایی حسی-عصبی مادرزادی و گواتر هستند، با مصرف دوزهای بسیار پایینی از دیوروتیک‌های تیازیدی دچار افت شدید پتاسیم و آلکالوز متابولیک عمیق می‌شوند. علت پاتوفیزیولوژیک این حساسیت مفرط توبولار به تیازیدها چیست؟",options:[{key:"الف",text:"دروسپیرنون اثرات دروسپیرنونی را شدت می‌بخشد."}, {key:"ب",text:"نقص ژنتیکی در مبادله‌گر راسی کلراید-بیکربنات **پندرین**؛ پندرین ترشح بیکربنات را در مجرای جمع‌کننده بر عهده دارد و در غیاب آن، بدن قادر به دفع بیکربنات اضافی تیازیدها نبوده و آلکالوز متابولیک شدیدی ایجاد می‌شود."}, {key:"ج",text:"تخریب فیزیکی مجاری کورتیکال جمع‌کننده به واسطه تجمع ذرات کلسیم."}, {key:"د",text:"کاهش ذاتی بیان کانال‌های آکواپورین-۲ در مدولا."}],correct:"ب"},
{id:"۱۳۳",text:"در درمان میکروآنژیوپاتی‌های ترومبوتیک (TMA) حاد ناشی از دیس‌رگولاسیون سیستم کمپلمان (مانند aHUS)، استفاده از آنتی‌بادی مونوکلونال **اکولیزومب (Eculizumab)** با مهار کدام جزء کلیدی کمپلمان مانع از تخریب سلول‌های اندوتلیال می‌گردد؟",options:[{key:"الف",text:"مهار مستقیم فاکتور H کمپلمان."}, {key:"ب",text:"مهار اختصاصی کلیواژ و شکستن **پروتئین C5 به دو جزء C5a و C5b**، که منجر به جلوگیری از تشکیل کمپلکس حمله‌کننده به غشا (MAC / C5b-C9) بر روی دیواره مویرگ‌ها می‌شود."}, {key:"ج",text:"مهار فیزیکی مستقیم پروتئین آغازین C1q."}, {key:"د",text:"مهار بیان پمپ‌های مسیر ترشحی آلترناتیو در کورتکس کلیه."}],correct:"ب"},
{id:"۱۳۴",text:"مرد ۶۸ ساله‌ای با نارسایی احتقانی قلب پیشرفته و ادم اندام‌ها، علیرغم دریافت دوزهای بالای فوروزماید وریدی پاسخ دیورز ضعیفی دارد. پزشک وی تصمیم به اضافه کردن دیوروتیک دوم یعنی **متولازون (Metolazone)** می‌گیرد. پاتوفیزیولوژی و فاکتورهای همودینامیک برای استفاده موثر از متولازون در این بیمار چیست؟",options:[{key:"الف",text:"متولازون به طور مستقیم پمپ $NKCC2$ لوپ هنله را مهار می‌کند."}, {key:"ب",text:"مصرف طولانی‌مدت فوروزماید منجر به هایپرتروفی واکنشی سلول‌های توبول دیستال و افزایش بازجذب سدیم در آن بخش شده است؛ متولازون با مهار اختصاصی همزمان پمپ $NCC$ توبول دیستال، این پدیده را مهار کرده و دیورز را به شدت تقویت می‌کند؛ متولازون باید ۳۰ دقیقه قبل از فوروزماید تجویز شود تا ترانسپورترها کاملاً مسدود باشند."}, {key:"ج",text:"مهار ترشح وازوپرسین در هیپوفیز توسط ترکیبات تیازیدی."}, {key:"د",text:"مهار گیرنده‌های آلدوسترون در لوله جمع‌کننده."}],correct:"ب"},
{id:"۱۳۵",text:"مرد ۴۵ ساله‌ای با سابقه افسردگی شدید، متعاقب بلع دوز بسیار بالایی از علف‌کش **پاراکوات (Paraquat)** به اورژانس آورده می‌شود. بیمار در فاز حاد فاقد نارسایی کلیه است. بر اساس راهنماهای اورژانسی برای افزایش دفع سموم، موثرترین استراتژی خارج‌پیکری (Extracorporeal) برای نجات بیمار چیست؟",options:[{key:"الف",text:"انجام فوری همودیالیز متناوب (IHD) با صافی Low-flux."}, {key:"ب",text:"شروع عاجل درمان مداوم جایگزینی کلیه (CKRT) با دوز فوق‌العاده بالا."}, {key:"ج",text:"شروع عاجل دوره‌های متوالی **هموپرفیوژن (Hemoperfusion)** با استفاده از ستون‌های زغال فعال (Charcoal) یا رزین، به دلیل تمایل اتصال بسیار بالای پاراکوات به ذرات جاذب زغال."}, {key:"د",text:"دیالیز صفاقی اورژانسی با دوزهای بالا جهت مهار فیبروز ریوی."}],correct:"ج"},
{id:"۱۳۶",text:"در پاتوژنز نفروپاتی سیلندری زنجیره سبک (Cast Nephropathy) در مالتیپل میلوما، زنجیره‌های سبک ایمونوگلوبولین (Bence Jones proteins) فیلترشده در ابتدا با کدام گیرنده غشایی ویژه در سلول‌های توبول پروگزیمال پیوند خورده و بازجذب می‌شوند که مهار این درگاه می‌تواند پاتوفیزیولوژی آسیب را تعدیل سازد؟",options:[{key:"الف",text:"کانال‌های کلسیمی TRPV5."}, {key:"ب",text:"کمپلکس گیرنده‌ای **مگالین-کوبیلین (Megalin-Cubilin Receptor Complex)** در مرز برس‌مانند سلول‌های توبول پروگزیمال."}, {key:"ج",text:"ترانسپورتر همزمان سدیم-گلوکز SGLT2."}, {key:"د",text:"مبادله‌گر راسی کلراید-بیکربنات پندرین."}],correct:"ب"},
{id:"۱۳۷",text:"در درمان پیشگیرانه سنگ‌های کلیوی کلسیمی راجعه ناشی از هایپرکالسیوری ایدیوپاتیک، تفاوت فارماکولوژیک و پاتوفیزیولوژیک بین دیوروتیک‌های تیازیدی با نیمه‌عمرهای گوناگون چیست و چرا استفاده از ترکیبات طولانی‌اثر ترجیح داده می‌شود؟",options:[{key:"الف",text:"هیدروکلروتیازید نیمه‌عمر بسیار بالایی دارد و نیازی به پایش املاح ندارد."}, {key:"ب",text:"دیوروتیک‌های با اثر کوتاه (مانند هیدروکلروتیازید) به دلیل نیمه‌عمر کوتاه منجر به بروز دیورز ناپایدار و پدیده post-diuretic sodium retention شده که بازجذب کلسیم را در توبول دیستال مهار می‌کند؛ در حالی که ترکیبات طولانی‌اثر (مانند **کلورتالیدون یا اینداپامید**) بازجذب پایدار سدیم را مهار کرده و منجر به کاهش مداوم دفع کلسیم ادراری و مهار فوق‌العاده رشد سنگ‌ها می‌شوند."}, {key:"ج",text:"کلورتالیدون ترشح وازوپرسین را به طور مستقیم مهار می‌سازد."}, {key:"د",text:"اینداپامید به علت کلات کردن مستقیم کلسیم ادراری ترجیح داده می‌شود."}],correct:"ب"},
{id:"۱۳۸",text:"بیمار ۵۴ ساله‌ای با سرطان سلول کلیوی (RCC) متاستاتیک تحت درمان با داروی مونوکلونال ضد **VEGF** یعنی **بواسیزومب (Bevacizumab)** قرار گرفته است. بیمار در هفته سوم درمان دچار پرفشاری خون عمیق (۱۷۵/۱۰۵\text{ mm Hg})، پروتئینوری شدید ۴.۲\text{ g/day} و ترومبوسیتوپنی خفیف می‌گردد. بیوپسی کلیه انجام شده و آسیب اندوتلیال شدید گلومرولی با لایه‌لایه شدگی غشا رویت می‌شود. پاتوفیزیولوژی این نفروتوکسیسیته چیست؟",options:[{key:"الف",text:"مهار مستقیم پمپ‌های کلسیم در پودوسیت‌ها."}, {key:"ب",text:"مهار ترشح فیزیولوژیک فاکتور رشد اندوتلیال عروقی (VEGF) از پودوسیت‌ها که برای حفظ و سلامت اندوتلیوم فنستره‌دار گلومرول الزامی است؛ مهار آن منجر به آسیب اندوتلیال شدید و بروز میکروآنژیوپاتی ترومبوتیک (TMA) موضعی گلومرول می‌گردد."}, {key:"ج",text:"رسوب فیزیکی ذرات بواسیزومب در مسانژیوم گلومرول."}, {key:"د",text:"القای اسیدوز توبولار نوع ۴ به واسطه مهار آلدوسترون."}],correct:"ب"},
{id:"۱۳۹",text:"بیمار ۶۲ ساله‌ای با سرطان ریه تحت درمان با داروی ضد **PD-1** یعنی **نیوولومب (Nivolumab)** قرار دارد. بیمار پس از دریافت دوز چهارم، دچار افزایش ناگهانی کراتینین از ۰.۹ به ۲.۸\text{ mg/dL} با ادرار خونی بدون پروتئینوری شدید می‌گردد. بیوپسی کلیه ارتشاح شدید سلول‌های T لنفوسیتی را در بینابین توبول‌ها (نفریت بینابینی حاد - AIN) نشان می‌دهد. پاتوفیزیولوژی این عارضه جانبی ایمونولوژیک چیست؟",options:[{key:"الف",text:"سمیت مستقیم بافتی نیوولومب بر روی سلول‌های توبول پروگزیمال."}, {key:"ب",text:"مهار سیگنال‌های مهارکننده ایمنی (Immune Checkpoints) توسط نیوولومب که به طور طبیعی مانع از فعال شدن سلول‌های T خودی علیه سلول‌های بافت بینابینی کلیه می‌شوند؛ در غیاب این مهار، پاسخ اتوایمیون شدید سلول‌های T علیه آنتی‌ژن‌های کلیه رخ داده و منجر به AIN شدید شده است."}, {key:"ج",text:"فعال‌سازی گذرا و انتخابی کمپلکس کمپلمان مسیر آلترناتیو."}, {key:"د",text:"مهار ترشح اریتروپوئتین کورتیکال."}],correct:"ب"},

{id:"۱۴۱",text:"در ۲۴ ساعت اول پس از پیوند کلیه از اهداکننده متوفی، گیرنده دچار الیگواوری حاد می‌گردد. در بررسی سونوگرافی داپلر آلوگرافت، جریان خون شریانی برقرار است اما شاخص مقاومت شریانی (Resistive Index - RI) معادل ۰.۸۸ گزارش می‌شود. رویکرد تشخیصی نفرولوژیست در قبال این گزارش چیست؟",options:[{key:"الف",text:"بالا بودن RI تاییدکننده قطعی پس‌زدن فوق حاد هومورال بوده و بیمار باید فوراً به اتاق عمل ارجاع شود."}, {key:"ب",text:"بالا بودن RI یک یافته غیراختصاصی در زمینه آسیب‌های گوناگون عروقی نظیر ATN یا پس‌زدن است و نمی‌تواند جایگزین بیوپسی کلیه جهت افتراق علل DGF گردد."}, {key:"ج",text:"مقدار RI بالای ۰.۸ نشان‌دهنده انسداد فیزیکی مجرای حالب توسط استنت دبل جی است."}, {key:"د",text:"بیمار دچار تخلیه شدید حجم شریانی است و باید تحت انفوزیون گسترده کلوئید قرار گیرد."}],correct:"ب"},
{id:"۱۴۲",text:"بیمار ۴۵ ساله‌ای ۴ هفته پس از دریافت پیوند کلیه با شکایت از تورم بدون درد اندام تحتانی سمت راست و احساس توده در ناحیه لگن مراجعه می‌کند. کراتینین بیمار به آرامی از ۱.۲ به ۱.۷ میلی‌گرم در دسی‌لیتر افزایش یافته است. در سونوگرافی، یک تجمع مایع بزرگ و بدون اکو (Anechoic) در مجاورت آلوگرافت که منجر به هیدرونفروز خفیف شده رویت می‌شود. غلظت کراتینین این مایع پس از آسپیراسیون مشابه کراتینین پلاسما است. تشخیص قطعی و بهترین رویکرد درمانی کدام است؟",options:[{key:"الف",text:"تجمع مایع لنفاوی (Lymphocele)؛ درمان قطعی با ایجاد پنجره پرینه‌آل به داخل حفره صفاق ترجیحاً به روش لاپاروسکوپی است."}, {key:"ب",text:"نشت ادراری (Urinoma)؛ درمان با تخلیه مکرر سوزنی زیر پوست."}, {key:"ج",text:"هماتوم عروقی؛ شروع کورتیکواستروئید دوز بالا."}, {key:"د",text:"آبسه فعال عفونی؛ جراحی مجدد حالب به مثانه."}],correct:"الف"},
{id:"۱۴۳",text:"خانم ۲۸ ساله‌ای با سابقه نارسایی انتهایی کلیه ثانویه به نفریت لوپوسی کلاس ۴، کاندید دریافت پیوند کلیه است. وی دارای سطح بالای آنتی‌بادی‌های ضد فسفولیپید (APS) در سرم است. ایمن‌ترین اپروچ جهت کاهش ریسک ترومبوز عروق آلوگرافت پس از پیوند در این بیمار کدام است؟",options:[{key:"الف",text:"شروع فوری داروی هپارین وریدی یا هپارین با وزن مولکولی پایین در اولین فرصت پس از اتمام آناستوموز عروقی آلوگرافت در اتاق عمل."}, {key:"ب",text:"به تعویق انداختن پیوند تا زمان منفی شدن کامل آنتی‌بادی‌ها."}, {key:"ج",text:"ممنوعیت مطلق تجویز هرگونه داروی سرکوب‌کننده ایمنی بجای MMF."}, {key:"د",text:"انجام بیوپسی‌های مکرر روزانه از کلیه پیوندی."}],correct:"الف"},
{id:"۱۴۴",text:"یک اهداکننده داوطلب با نژاد آفریقایی کاندید اهدای کلیه زنده به فرزندش است. پزشک تیم پیوند مشاوره ژنتیک برای بررسی واریانت‌های ریسک کلیوی *APOL1* را پیشنهاد می‌کند. کدام توضیح در خصوص حضور دو واریانت ریسک *APOL1* در این فرد داوطلب صحیح است؟",options:[{key:"الف",text:"وجود این دو واریانت به طور ذاتی ریسک ابتلای خود فرد به نارسایی کلیه را در طول عمر حتی بدون اهدای کلیه افزایش می‌دهد، اما تاثیر نفرکتومی بر تسریع این روند هنوز نامشخص است."}, {key:"ب",text:"وجود این دو واریانت یک کنتراندیکاسیون مطلق برای اهدای کلیه است زیرا منجر به نارسایی برق‌آسای کلیه مقابل پس از نفرکتومی می‌شود."}, {key:"ج",text:"این ژن تنها زمانی اهمیت دارد که گیرنده پیوند نیز دو واریانت ریسک مشابه را دارا باشد."}, {key:"د",text:"حضور این واریانت‌ها GFR پایه بیمار را بیش از ۵۰ درصد کاهش می‌دهد."}],correct:"الف"},

{id:"۱۴۶",text:"در رژیم‌های تصفیه مداوم کلیوی (CKRT) برای بیماران مبتلا به آسیب حاد مغزی و فشار داخل جمجمه‌ای (ICP) بالا، چرا تداوم تصفیه مداوم (Continuous) بر همودیالیز متمتناوب (IHD) ترجیح داده می‌شود؟",options:[{key:"الف",text:"CKRT منجر به مهار پمپ‌های سدیم کورتیکال مغز می‌شود."}, {key:"ب",text:"CKRT با کاهش ملایم و پیوسته سطوح اوره و اسمولالیته پلاسما، مانع از نوسانات شدید آب مغز و بروز تورم مغزی ناشی از گرادیان اسمزی معکوس و در نتیجه مانع از افزایش ناگهانی ICP می‌گردد."}, {key:"ج",text:"CKRT ترشح وازوپرسین را فعال می‌سازد."}, {key:"د",text:"IHD با مسدود کردن کانال‌های آکواپورین مغز همراه است."}],correct:"ب"},
{id:"۱۴۷",text:"قبل از انجام بیوپسی سوزنی کلیه بومی (Native Kidney Biopsy)، استفاده از پروتکل استاندارد \"Universal Protocol\" مصوب کمیسیون مشترک (Joint Commission) با چه گام‌هایی مانع از بروز خطاهای جدی پزشکی عروقی می‌گردد؟",options:[{key:"الف",text:"بررسی مداوم GFR به صورت هر ۱۲ ساعت."}, {key:"ب",text:"انجام سه مرحله شامل تایید اطلاعات قبل از پروسیجر (Verification)، علامت‌گذاری فیزیکی محل بیوپسی (Site marking) و اجرای زمان‌سنجی نهایی تیمی قبل از ورود سوزن (Time-out)."}, {key:"ج",text:"مهار دوگانه سیستم رآس با داروهای قوی."}, {key:"د",text:"تجویز روتین کلسیم وریدی دوز بالا."}],correct:"ب"},
{id:"۱۴۸",text:"در همودیالیز نگهدارنده، اندازه‌گیری کراتینین و اوره در سرم پس از دیالیز (Post-dialysis SUN) حساسیت بالایی به زمان خون‌گیری دارد. برای ممانعت از اثر کاهشی خطا بر روی ارزیابی دوز دیالیز (به دلیل پدیده rebound اوره)، کدام روش نمونه‌گیری طبق گایدلاین KDOQI توصیه می‌شود؟",options:[{key:"الف",text:"بلافاصله پس از خاموش کردن پمپ خون، نمونه از پورت تخلیه دیالیز گرفته شود."}, {key:"ب",text:"سرعت پمپ خون به ۱۰۰ میلی‌لیتر در دقیقه به مدت ۱۵ ثانیه کاهش یابد (تا ریباند ناشی از دسترسی عروقی برطرف شود) و سپس پمپ خاموش شده و نمونه از پورت خط ورودی (Arterial line) کشیده شود."}, {key:"ج",text:"نمونه از ورید دست مقابل در پایان دیالیز گرفته شود."}, {key:"د",text:"پلاسمافرز تهاجمی به مدت ۳ دقیقه قبل از قطع دیالیز انجام شود."}],correct:"ب"},

// ====== STATE ======
let shuffled = [];
let current = 0;
let correct = 0;
let wrong = 0;
let answered = false;
let wrongTopics = [];

// ====== PARTICLES ======
(function createParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 6 + 3;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      animation-duration:${Math.random()*12+8}s;
      animation-delay:${Math.random()*10}s;
    `;
    container.appendChild(p);
  }
})();

// ====== SHUFFLE ======
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ====== SCREENS ======
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ====== START ======
function startExam() {
  shuffled = shuffle(QUESTIONS);
  current = 0; correct = 0; wrong = 0; wrongTopics = [];
  showScreen('screen-exam');
  loadQuestion();
}

// ====== LOAD QUESTION ======
function loadQuestion() {
  const q = shuffled[current];
  answered = false;

  // Progress
  const pct = Math.round((current / 150) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `سوال ${current+1} از ۱۵۰`;
  document.getElementById('q-counter').textContent = `${current+1} / ۱۵۰`;
  document.getElementById('score-live').innerHTML = `✓ ${correct} &nbsp; ✗ ${wrong}`;
  document.getElementById('q-badge').textContent = `سوال ${q.id}`;

  // Animate card
  const card = document.getElementById('question-card');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'card-enter 0.45s cubic-bezier(.22,1,.36,1) both';

  document.getElementById('q-text').textContent = q.text;

  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<div class="option-key">${opt.key}</div><div>${opt.text}</div>`;
    btn.onclick = () => selectAnswer(btn, opt.key, q);
    grid.appendChild(btn);
  });

  document.getElementById('btn-next').classList.remove('visible');
}

// ====== SELECT ANSWER ======
function selectAnswer(btn, key, q) {
  if (answered) return;
  answered = true;

  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(b => b.disabled = true);

  if (key === q.correct) {
    btn.classList.add('correct');
    correct++;
  } else {
    btn.classList.add('wrong');
    wrong++;
    wrongTopics.push(q.text.substring(0, 60));
    // Show correct
    allBtns.forEach(b => {
      const k = b.querySelector('.option-key').textContent;
      if (k === q.correct) b.classList.add('correct');
    });
  }

  document.getElementById('score-live').innerHTML = `✓ ${correct} &nbsp; ✗ ${wrong}`;

  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = current < 149 ? 'سوال بعدی ←' : 'مشاهده نتایج ✓';
  nextBtn.classList.add('visible');
}

// ====== NEXT ======
function nextQuestion() {
  current++;
  if (current >= 150) {
    showResults();
  } else {
    loadQuestion();
  }
}

// ====== RESULTS ======
function showResults() {
  showScreen('screen-result');
  const pct = Math.round((correct / 150) * 100);

  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = wrong;

  // Ring animation
  const circumference = 439.82;
  const offset = circumference - (pct / 100) * circumference;
  setTimeout(() => {
    document.getElementById('ring-fill').style.strokeDashoffset = offset;
  }, 200);

  // Title
  let title, subtitle;
  if (pct >= 80) {
    title = '🏆 عالی! آفرین بر شما';
    subtitle = 'نتیجه فوق‌العاده‌ای کسب کردید';
  } else if (pct >= 60) {
    title = '👍 خوب بود!';
    subtitle = 'با کمی تمرین بیشتر به نتیجه ایده‌آل می‌رسید';
  } else {
    title = '📚 نیاز به مطالعه بیشتر';
    subtitle = 'مباحث ضعیف را مجدداً مرور کنید';
  }

  document.getElementById('result-title').textContent = title;
  document.getElementById('result-subtitle').textContent = subtitle;

  // Call Gemini
  callGemini(correct, wrong, pct, wrongTopics);
}

// ====== GEMINI CALL ======
async function callGemini(correct, wrong, pct, wrongTopics) {
  const workerUrl = 'WORKER_URL_PLACEHOLDER';

  const prompt = `شما یک استاد متخصص نفرولوژی هستید. دانشجوی پزشکی در آزمون بورد نفرولوژی شرکت کرده است.

نتایج آزمون:
- تعداد کل سوالات: 150
- پاسخ صحیح: ${correct}
- پاسخ اشتباه: ${wrong}
- نمره: ${pct}%

برخی از سوالاتی که اشتباه پاسخ داده شده:
${wrongTopics.slice(0, 15).join('\n')}

لطفاً یک تحلیل جامع و دلسوزانه به فارسی بنویسید که شامل:
1. ارزیابی کلی عملکرد
2. نقاط قوت احتمالی
3. حیطه‌های نیازمند مطالعه بیشتر
4. توصیه‌های عملی برای ارتقاء سطح علمی
باشد. تحلیل باید صمیمانه، دقیق و انگیزه‌بخش باشد.`;

  try {
    const res = await fetch(workerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });

    const data = await res.json();
    document.getElementById('analysis-content').innerHTML =
      `<div class="analysis-text">${data.text || data.result || 'تحلیل دریافت نشد.'}</div>`;
  } catch (err) {
    document.getElementById('analysis-content').innerHTML =
      `<div class="analysis-text" style="color:var(--wrong)">خطا در دریافت تحلیل. لطفاً اتصال اینترنت خود را بررسی کنید.</div>`;
  }
}

// ====== RESTART ======
function restartExam() {
  showScreen('screen-welcome');
}
</script>
